<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>液态玻璃 · 相场水珠</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; }
  #pagebg {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: cover; z-index: 0; user-select: none; -webkit-user-drag: none;
  }
  #gl {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 1; pointer-events: none; display: block;
  }
  #flow {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; display: none; z-index: 4;
  }
  #hud {
    position: fixed; top: 12px; right: 14px; z-index: 10;
    font: 500 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #cfe3ff; text-shadow: 0 1px 3px #000a;
    text-align: right; pointer-events: none; user-select: none;
  }
  #hud b { font-weight: 700; color: #fff; }
  #hud .dim { opacity: .5; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 278px; z-index: 10;
    max-height: calc(100vh - 24px);
    display: flex; flex-direction: column;
    padding: 12px 14px 14px;
    border-radius: 14px;
    background: rgba(14, 18, 24, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px) saturate(140%);
    font: 400 12px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #dfe7f2; user-select: none;
  }
  #panel.collapsed { width: auto; padding: 8px 12px; }
  #panel.collapsed .body { display: none; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head h1 { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .02em; }
  #toggle {
    all: unset; cursor: pointer; padding: 2px 7px; border-radius: 7px;
    font-size: 11px; color: #9fb3cc; background: rgba(255,255,255,.07);
  }
  #toggle:hover { background: rgba(255,255,255,.13); color: #dbe7f7; }
  .body { margin-top: 10px; display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  #sliders { overflow-y: auto; min-height: 0; padding-right: 4px; }
  #sliders::-webkit-scrollbar { width: 6px; }
  #sliders::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
  .row { margin: 8px 0; }
  .row label { display: flex; justify-content: space-between; gap: 8px; color: #a8b8cc; font-size: 11px; }
  .row label span:last-child { color: #e8f1ff; font-variant-numeric: tabular-nums; }
  .desc { margin-top: 1px; font-size: 10px; line-height: 1.35; color: #8395ab; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 16px;

  }

  .btns button, .btns label {

  .btns button:hover, .btns label:hover { background: rgba(255,255,255,.15); }
  .btns button.on { background: rgba(120,180,255,.28); border-color: rgba(150,200,255,.35); color: #fff; }
  input[type=file] { display: none; }
  .hint { margin-top: 10px; color: #7f90a6; font-size: 10.5px; line-height: 1.5; }

  #drop {

    white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
<img id="pagebg" alt="" aria-hidden="true" />
<canvas id="gl"></canvas>
<canvas id="flow"></canvas>

<div id="hud">
  <div><b id="fps">–</b> fps · <span id="ms">–</span> ms</div>
  <div class="dim"><span id="res">–</span> · 相场 <span id="phi">–</span></div>
  <div class="dim">GPU <span id="gpu">–</span> ms · φ <span id="mass">–</span> · 滴 <span id="comps">–</span></div>
  <div class="dim">质量漂移 <span id="drift">–</span> · 体积系数 <span id="vol">–</span></div>
</div>

<div id="panel">
  <div class="head">
    <h1>液态玻璃 · 相场水珠</h1>
    <button id="toggle">收起</button>
  </div>
  <div class="body">
    <div id="sliders"></div>
    <div class="btns">
      <button id="btnPause">暂停</button>
      <button id="btnCompare">对比原图</button>

      <button id="btnMass" class="on">质量校正</button>

      按住 <kbd>空格</kbd> 看原图 · <kbd>H</kbd> 收起面板 · 图片可直接拖进窗口
    </div>
  </div>
</div>

<div id="drop">松手载入图片</div>
<pre id="err"></pre>

<script src="hdri.js"></script>
<script>
"use strict";

/* ================================================================== *
 * 0. 常量与状态
 *
 * 这里没有“几只水滴、每只多大”的手工参数。初始液体由随机平滑场 + 总
 * 液体量生成；之后只由通量形式相场和外部无散流场演化。相场平流和界面
 * 通量本身是守恒的；clamp 后的少量数值漂移由探针上的乘法校正拉回。
 * 渲染再把 φ / Poisson 容量场变成 3D 高度。
 * ================================================================== */
const TAU = Math.PI * 2;
const WORLD_MM = 10;               // 屏幕高度对应的物理尺寸
const NW = [1.331, 1.333, 1.344];
const NG = [1.514, 1.520, 1.528];

const PHI_SCALE = 0.22;            // 相场/高度解算分辨率
const FLOW_W = 64, FLOW_H = 40;
const MAX_DPR_LEVELS = [0.55, 0.70, 0.85, 1.00, 1.20, 1.40];
const PSI_ITERS = 6;               // 每帧红黑 SOR 迭代（暖启动）
const PSI_ITERS_RESET = 96;        // 重置时的收敛迭代
let cacSubsteps = 2;

const DEFAULTS = {
  amount: 0.155,     // 初始液体量（φ 平均）
  flow: 0.020,       // 外部无散流场强度
  eps: 3.0,          // 相场界面宽度（格）
  mobility: 0.5,     // 保守 Allen-Cahn 迁移率（格²/秒）
  contact: 78,       // 接触角（度，仅渲染）
  lod: 0.15,
  spec: 1.0,
  density: 0.15,     // 介质光学厚度
  env: 1.0,
  envRot: 0,
  glass: 0.20,       // 屏幕玻璃厚度 mm
  speed: 1.0,
};

const SLIDERS = [
  ["amount",   "液体量",   0.04, 0.30, 0.005, "初始 φ 平均值；只决定总液体量，不决定滴数和位置"],
  ["flow",     "流场",     0,    0.20, 0.005, "外部无散速度场强度；液滴被它平流、拉长、合并"],
  ["eps",      "界面宽度", 1.5,  4.5,  0.1,   "保守相场的界面宽度 ε（相场格）"],
  ["mobility", "迁移率",   0.2,  2.0,  0.05,  "保守 Allen-Cahn 迁移率（格²/秒）"],
  ["contact",  "接触角",   35,   88,   1,     "渲染球冠的接触角；从面积等效半径和容量场重建高度"],
  ["lod",      "模糊",     -2,   3,    0.1,   "0 = 清透，往上加磨砂"],
  ["spec",     "高光",     0,    2.5,  0.02,  "曲面把环境光聚成的小点"],
  ["density",  "介质浓度", 0,    1,    0.01,  "参与介质的光学厚度；暗色吸收、亮色散射"],
  ["env",      "环境亮度", 0,    2,    0.05,  "HDR 环境反射强度"],
  ["envRot",   "环境旋转", 0,    360,  1,     "旋转 HDR 环境"],
  ["glass",    "玻璃厚度", 0,    1.5,  0.05,  "屏幕玻璃层厚度（mm）"],
  ["speed",    "速度",     0,    3,    0.02,  "整体时间倍率"],
];

const state = Object.assign({}, DEFAULTS);
state.massFix = true;
let paused = false;
let off = false;
let fillLight = false;
let showFlow = false;
let flowTime = 0;

/* ================================================================== *
 * 1. WebGL / DOM / 基础工具
 * ================================================================== */
const canvas = document.getElementById("gl");
const IS_STILL = /(?:^|#|&)still(?:&|=|$)/.test(location.hash);
const gl = canvas.getContext("webgl2", {
  alpha: true,
  antialias: false,
  depth: false,
  stencil: false,
  premultipliedAlpha: false,
  /* 截图/自动验收用；正常 RAF 模式不保留 drawing buffer。 */
  preserveDrawingBuffer: IS_STILL,
  powerPreference: "high-performance",
});
if (!gl) {
  document.body.innerHTML =
    '<div style="padding:40px;font:16px system-ui;color:#dde">这个浏览器/机器没有 WebGL2，跑不了。</div>';
  throw new Error("no webgl2");
}

const pageBg = document.getElementById("pagebg");
const flowCanvas = document.getElementById("flow");
const fctx = flowCanvas.getContext("2d");
const errEl = document.getElementById("err");
const hasFloat = !!gl.getExtension("EXT_color_buffer_float");

function fail(msg) {
  errEl.style.display = "block";
  errEl.textContent = "液态玻璃 demo 启动失败\n\n" + msg;
  throw new Error(msg);
}

const VERT = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    fail("着色器编译失败\n\n" + gl.getShaderInfoLog(s));
  }
  return s;
}

function linkProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    fail("着色器链接失败\n\n" + gl.getProgramInfoLog(p));
  }
  return p;
}

function uniforms(program, names) {
  const out = {};
  for (const n of names) out[n] = gl.getUniformLocation(program, n);
  return out;
}

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function drawQuad() {
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* sRGB 编码 LUT */
const srgbTex = gl.createTexture();
{
  const lut = new Uint8Array(256);
  for (let i = 0; i < 256; i += 1) {
    const c = i / 255;
    const s = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    lut[i] = Math.round(Math.max(0, Math.min(1, s)) * 255);
  }
  gl.bindTexture(gl.TEXTURE_2D, srgbTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, 1, 0, gl.RED, gl.UNSIGNED_BYTE, lut);
}

/* ================================================================== *
 * 2. 渲染目标
 * ================================================================== */
const FIELD_FMT = hasFloat ? gl.RGBA16F : gl.RGBA8;
const FIELD_TYPE = hasFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h, fmt, type, minFilter, magFilter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, magFilter || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (status !== gl.FRAMEBUFFER_COMPLETE) {
    gl.deleteTexture(tex);
    gl.deleteFramebuffer(fbo);
    return null;
  }
  return { tex, fbo, w, h };
}

function disposeTarget(t) {
  if (!t) return;
  gl.deleteTexture(t.tex);
  gl.deleteFramebuffer(t.fbo);
}

/* ================================================================== *
 * 3. 相场、Poisson 容量场、高度 / 法线、合成着色器
 * ================================================================== */
const CAC_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;

out vec4 outColor;

uniform sampler2D uPhi;
uniform sampler2D uFlow;
uniform vec2  uRes;
uniform float uDt;       // 秒
uniform float uEps;      // 格
uniform float uM;        // 格^2 / 秒

float P(vec2 uv) { return texture(uPhi, uv).r; }
vec2  U(vec2 uv) { return texture(uFlow, uv).xy * uRes.y; } // 格/秒

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 tx = 1.0 / uRes;

  float pc  = P(uv);
  float pL  = P(uv - vec2(tx.x, 0.0));
  float pR  = P(uv + vec2(tx.x, 0.0));
  float pD  = P(uv - vec2(0.0, tx.y));
  float pU  = P(uv + vec2(0.0, tx.y));
  float pLU = P(uv + vec2(-tx.x,  tx.y));
  float pRU = P(uv + vec2( tx.x,  tx.y));
  float pLD = P(uv + vec2(-tx.x, -tx.y));
  float pRD = P(uv + vec2( tx.x, -tx.y));

  vec2 vR = U(uv + vec2( 0.5 * tx.x, 0.0));
  vec2 vL = U(uv - vec2( 0.5 * tx.x, 0.0));
  vec2 vU = U(uv + vec2(0.0,  0.5 * tx.y));
  vec2 vD = U(uv - vec2(0.0,  0.5 * tx.y));

  /* 通量形式平流：∂tφ + ∇·(uφ)。一阶迎风，虽然数值扩散大一点，
     但每个面的通量由相邻两格共享，整场求和严格望远镜抵消。 */
  float fR = vR.x > 0.0 ? vR.x * pc : vR.x * pR;
  float fL = vL.x > 0.0 ? vL.x * pL : vL.x * pc;
  float fU = vU.y > 0.0 ? vU.y * pc : vU.y * pU;
  float fD = vD.y > 0.0 ? vD.y * pD : vD.y * pc;
  float divAdv = (fR - fL) + (fU - fD);

  /* 保守 Allen-Cahn 界面通量：
     ∇·( M [ ∇φ − (4/ε) φ(1−φ) n ] )
     界面通量也是面通量；不往空气里加 λ。 */
  float eps = max(uEps, 0.6);
  float s = 4.0 / eps;

  vec2 gR = vec2(pR - pc, 0.25 * (pU + pRU - pD - pRD));
  vec2 gL = vec2(pc - pL, 0.25 * (pU + pLU - pD - pLD));
  vec2 gU = vec2(0.25 * (pR + pRU - pL - pLU), pU - pc);
  vec2 gD = vec2(0.25 * (pR + pRD - pL - pLD), pc - pD);

  float pfR = 0.5 * (pc + pR);
  float pfL = 0.5 * (pL + pc);
  float pfU = 0.5 * (pc + pU);
  float pfD = 0.5 * (pD + pc);

  vec2 nR = gR / (length(gR) + 1e-7);
  vec2 nL = gL / (length(gL) + 1e-7);
  vec2 nU = gU / (length(gU) + 1e-7);
  vec2 nD = gD / (length(gD) + 1e-7);

  float aR = uM * (gR.x - s * pfR * (1.0 - pfR) * nR.x);
  float aL = uM * (gL.x - s * pfL * (1.0 - pfL) * nL.x);
  float aU = uM * (gU.y - s * pfU * (1.0 - pfU) * nU.y);
  float aD = uM * (gD.y - s * pfD * (1.0 - pfD) * nD.y);
  float divAc = (aR - aL) + (aU - aD);

  float next = pc + uDt * (divAc - divAdv);
  outColor = vec4(clamp(next, 0.0, 1.0), 0.0, 0.0, 1.0);
}`;

const MASS_FIX_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uPhi;
uniform vec2 uRes;
uniform float uScale;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float p = texture(uPhi, uv).r;
  outColor = vec4(clamp(p * uScale, 0.0, 1.0), 0.0, 0.0, 1.0);
}`;

const PROBE_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uPhi;
uniform vec2 uSrcRes;
uniform vec2 uDstRes;
void main() {
  ivec2 base = ivec2(floor(gl_FragCoord.xy)) * 4;
  int sxMax = int(uSrcRes.x) - 1;
  int syMax = int(uSrcRes.y) - 1;
  float sum = 0.0;
  for (int j = 0; j < 4; j++) {
    for (int i = 0; i < 4; i++) {
      int sx = min(base.x + i, sxMax);
      int sy = min(base.y + j, syMax);
      vec2 suv = (vec2(float(sx), float(sy)) + 0.5) / uSrcRes;
      sum += texture(uPhi, suv).r;
    }
  }
  outColor = vec4(sum / 16.0, 0.0, 0.0, 1.0);
}`;

const PSI_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uPsi;
uniform sampler2D uPhi;
uniform vec2  uRes;
uniform float uOmega;
uniform int   uParity;

float wetPhi(vec2 uv) { return texture(uPhi, uv).r; }
float wetPsi(vec2 uv) {
  return wetPhi(uv) >= 0.5 ? texture(uPsi, uv).r : 0.0;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 tx = 1.0 / uRes;
  ivec2 ip = ivec2(gl_FragCoord.xy);
  float psi = texture(uPsi, uv).r;

  if (((ip.x + ip.y) & 1) != uParity) {
    outColor = vec4(psi, 0.0, 0.0, 1.0);
    return;
  }
  if (wetPhi(uv) < 0.5) {
    outColor = vec4(0.0, 0.0, 0.0, 1.0);
    return;
  }

  /* ∇²ψ = −1，ψ=0 在接触线上。ψ 是“容量场”，不是距离场；
     它没有中轴折痕，圆滴中心的 ψ = R²/4。 */
  float l = wetPsi(uv - vec2(tx.x, 0.0));
  float r = wetPsi(uv + vec2(tx.x, 0.0));
  float d = wetPsi(uv - vec2(0.0, tx.y));
  float u = wetPsi(uv + vec2(0.0, tx.y));
  float gs = 0.25 * (l + r + d + u + 1.0);
  float next = mix(psi, gs, uOmega);
  outColor = vec4(max(next, 0.0), 0.0, 0.0, 1.0);
}`;

const GEO_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uPsi;
uniform sampler2D uPhi;
uniform sampler2D uScale;
uniform vec2  uRes;
uniform float uPH;       // PHI_H，格/屏幕高
uniform float uTheta;    // 接触角，弧度
uniform float uVolScale;

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 tx = 1.0 / uRes;
  float phi = texture(uPhi, uv).r;
  float psi = texture(uPsi, uv).r;
  float R = max(texture(uScale, uv).r, 0.008); // 屏幕高为单位
  float Rc = R * uPH;

  /* q = 1 − (r/R)²：由 Poisson 容量场给出的归一化径向坐标。 */
  float q = clamp(4.0 * psi / max(Rc * Rc, 1e-8), 0.0, 1.0);

  /* 球冠高度剖面，写成 q 的函数：
       h/H = (sqrt(cos²θ + sin²θ q) − cosθ) / (1 − cosθ)
     在 q=0 处斜率为 tanθ，在 q=1 处回到顶点高度 H。 */
  float c = cos(uTheta);
  float s2 = max(0.0, 1.0 - c * c);
  float root = sqrt(max(c * c + s2 * q, 0.0));
  float shape = (root - c) / max(1.0 - c, 1e-4);
  float dshape = s2 / (2.0 * max(root, 1e-5) * max(1.0 - c, 1e-4));
  float H = R * tan(0.5 * uTheta) * uVolScale;
  float wet = step(0.5, phi);
  float h = H * clamp(shape, 0.0, 1.0) * wet;

  /* 法线直接用 ∇ψ 的解析链式法则，不再对 h 做跨接触线的中心差分。
     ψ 在接触线内部光滑，避免了高度在干/湿格之间跳变造成的锯齿和脊线。 */
  float pl = texture(uPsi, uv - vec2(tx.x, 0.0)).r;
  float pr = texture(uPsi, uv + vec2(tx.x, 0.0)).r;
  float pd = texture(uPsi, uv - vec2(0.0, tx.y)).r;
  float pu = texture(uPsi, uv + vec2(0.0, tx.y)).r;
  float gpx = (pr - pl) * 0.5;
  float gpy = (pu - pd) * 0.5;
  float gradScale = H * dshape * 4.0 * uPH / max(Rc * Rc, 1e-8);
  float gx = gradScale * gpx * wet;
  float gy = gradScale * gpy * wet;
  vec3 N = normalize(vec3(-gx, -gy, 1.0));

  /* 接触线 alpha 的过渡至少覆盖一格，避免低分辨率相场在近水平边界
     上留下网格台阶；法线/折射本身是光滑的。 */
  float mask = smoothstep(0.35, 0.65, phi);
  outColor = vec4(N.xy * 0.5 + 0.5, mask, h);
}`;

const COMP_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
precision highp samplerCube;

out vec4 outColor;

uniform sampler2D   uGlass;
uniform sampler2D   uBg;
uniform samplerCube uEnv;
uniform sampler2D   uSRGB;
uniform vec2        uRes;
uniform vec2        uUvScale;
uniform vec2        uUvOffset;
uniform float       uOn;
uniform float       uLod;
uniform float       uSpec;
uniform float       uFillAlpha;
uniform float       uEnvRot;
uniform float       uEnvIntensity;
uniform float       uHref;
uniform float       uGlassT;
uniform vec3        uFill;
uniform vec3        uLightDir;

const vec3 NW = vec3(1.331, 1.333, 1.344);
const vec3 NG = vec3(1.514, 1.520, 1.528);

vec3 rotY(vec3 p, float a) {
  float c = cos(a), s = sin(a);
  return vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z);
}
float fresnel(float cosI, float n1, float n2) {
  float sinI2 = max(0.0, 1.0 - cosI * cosI);
  float eta = n1 / n2;
  float sinT2 = eta * eta * sinI2;
  if (sinT2 >= 1.0) return 1.0;
  float cosT = sqrt(1.0 - sinT2);
  float rs = (n1 * cosI - n2 * cosT) / (n1 * cosI + n2 * cosT);
  float rp = (n1 * cosT - n2 * cosI) / (n1 * cosT + n2 * cosI);
  return 0.5 * (rs * rs + rp * rp);
}
vec3 encodeSRGB(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return vec3(
    texture(uSRGB, vec2(c.r, 0.5)).r,
    texture(uSRGB, vec2(c.g, 0.5)).r,
    texture(uSRGB, vec2(c.b, 0.5)).r
  );
}

void main() {
  vec2 uv  = gl_FragCoord.xy / uRes;
  vec4 gbuf = texture(uGlass, uv);
  float mask = gbuf.b * uOn;
  if (mask < 0.0025) {
    outColor = vec4(0.0);
    return;
  }

  vec2 tUv = uv * uUvScale + uUvOffset;
  vec2 nxy = gbuf.rg * 2.0 - 1.0;
  vec3 N = vec3(nxy, sqrt(max(1.0 - dot(nxy, nxy), 0.0)));
  float h = gbuf.a;

  vec3 R = 2.0 * N.z * N - vec3(0.0, 0.0, 1.0);
  vec3 env = texture(uEnv, rotY(R, uEnvRot)).rgb * uEnvIntensity;
  vec3 L = rotY(normalize(uLightDir), uEnvRot);

  float aspect = uRes.x / max(uRes.y, 1.0);
  /* 越靠近接触线，法线越陡，折射会把远处的一大片背景压进几个像素。
     用更高的 mip 做面积预滤波，避免高对比壁纸在边缘被压成矩形锯齿。 */
  float lod = uLod + (1.0 - N.z) * 3.2;
  vec3 trans = vec3(0.0);
  float tGreen = 0.0;

  for (int c = 0; c < 3; c++) {
    float nw = c == 0 ? NW.r : (c == 1 ? NW.g : NW.b);
    float ng = c == 0 ? NG.r : (c == 1 ? NG.g : NG.b);
    vec3 T = refract(vec3(0.0, 0.0, -1.0), N, 1.0 / nw);
    float tw = h / max(-T.z, 1e-4);
    vec2 dp = T.xy * tw;
    if (uGlassT > 1e-6) {
      vec3 Tg = refract(T, vec3(0.0, 0.0, 1.0), nw / ng);
      float tg = uGlassT / max(-Tg.z, 1e-4);
      dp += Tg.xy * tg * smoothstep(0.0, 0.02 * uHref, h);
    }
    vec2 duv = vec2(dp.x / aspect, dp.y) * uUvScale;
    vec3 smp = textureLod(uBg, tUv + duv, lod).rgb;
    if (c == 0) trans.r = smp.r;
    else if (c == 1) { trans.g = smp.g; tGreen = tw; }
    else trans.b = smp.b;
  }

  float tau = uFillAlpha * (tGreen / max(uHref, 1e-4));
  float Tmed = exp(-tau);
  trans = Tmed * trans + (1.0 - Tmed) * uFill;

  float F = fresnel(clamp(N.z, 0.0, 1.0), 1.0, NW.g);
  float Fgw = 0.0;
  if (uGlassT > 1e-6) {
    vec3 Tq = refract(vec3(0.0, 0.0, -1.0), N, 1.0 / NW.g);
    Fgw = fresnel(clamp(-Tq.z, 0.0, 1.0), NW.g, NG.g);
  }

  float ndl = max(dot(N, L), 0.0);
  float k2 = ndl * ndl;
  float k4 = k2 * k2;
  float k8 = k4 * k4;
  float k16 = k8 * k8;
  float k32 = k16 * k16;
  float k64 = k32 * k32;
  float k128 = k64 * k64;
  float k256 = k128 * k128;

  vec3 col = trans * (1.0 - F) * (1.0 - Fgw) + env * F;
  col += vec3(1.0, 0.95, 0.88) * k256 * uSpec * 12.0;

  outColor = vec4(encodeSRGB(col), mask);
  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  outColor.rgb += (ign - 0.5) * (1.0 / 255.0);
}`;

const DEBUG_FRAG = `#version 300 es

uniform vec2 uRes;

/* ================================================================== *
 * 4. HDR 环境
 * ================================================================== */
const ENV_SIZE = 128;
let envTex = null;
let envLight = [0.3, 0.5, 0.8];

function decodeHDRI() {
  if (!window.HDRI_RGBE || !window.HDRI_W || !window.HDRI_H) return null;
  try {
    const bin = atob(window.HDRI_RGBE);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
    const w = window.HDRI_W, h = window.HDRI_H;
    if (bytes.length < w * h * 4) return null;
    const data = new Float32Array(w * h * 3);
    for (let i = 0; i < w * h; i += 1) {
      const e = bytes[i * 4 + 3];
      if (e !== 0) {
        const f = Math.pow(2, e - 136);
        data[i * 3] = bytes[i * 4] * f;
        data[i * 3 + 1] = bytes[i * 4 + 1] * f;
        data[i * 3 + 2] = bytes[i * 4 + 2] * f;
      }
    }
    return { w, h, data };
  } catch (_) {
    return null;
  }
}

function sampleEquirect(data, u, v, w, h) {
  const x = (((u % 1) + 1) % 1) * w - 0.5;
  const y = Math.max(0, Math.min(h - 1, v * h - 0.5));
  const x0 = Math.floor(x), x1 = (x0 + 1 + w) % w;
  const y0 = Math.floor(y), y1 = Math.min(h - 1, y0 + 1);
  const fx = x - Math.floor(x), fy = y - y0;
  const a = (y0 * w + x0) * 3, b = (y0 * w + x1) * 3;
  const c = (y1 * w + x0) * 3, d = (y1 * w + x1) * 3;
  const out = [0, 0, 0];
  for (let k = 0; k < 3; k += 1) {
    const top = data[a + k] * (1 - fx) + data[b + k] * fx;
    const bot = data[c + k] * (1 - fx) + data[d + k] * fx;
    out[k] = top * (1 - fy) + bot * fy;
  }
  return out;
}

function buildEnvironment() {
  const dec = decodeHDRI();
  let hdr, hdrW, hdrH;
  if (dec) {
    hdr = dec.data; hdrW = dec.w; hdrH = dec.h;
    if (Array.isArray(window.HDRI_LIGHT)) envLight = window.HDRI_LIGHT.slice();
  } else {
    hdrW = 256; hdrH = 128;
    hdr = new Float32Array(hdrW * hdrH * 3);
    for (let y = 0; y < hdrH; y += 1) {
      const v = (y + 0.5) / hdrH;
      for (let x = 0; x < hdrW; x += 1) {
        const i = (y * hdrW + x) * 3;
        const sky = Math.max(0, 1 - Math.abs(v - 0.42) * 2.2);
        hdr[i] = 0.08 + sky * 0.7;
        hdr[i + 1] = 0.10 + sky * 0.8;
        hdr[i + 2] = 0.16 + sky * 0.95;
      }
    }
    envLight = [0.3, 0.5, 0.8];
  }

  envTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, envTex);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const face = new Float32Array(ENV_SIZE * ENV_SIZE * 4);
  for (let f = 0; f < 6; f += 1) {
    for (let y = 0; y < ENV_SIZE; y += 1) {
      for (let x = 0; x < ENV_SIZE; x += 1) {
        const u = (2 * (x + 0.5)) / ENV_SIZE - 1;
        const v = (2 * (y + 0.5)) / ENV_SIZE - 1;
        let dx, dy, dz;
        if (f === 0) { dx = 1; dy = -v; dz = -u; }
        else if (f === 1) { dx = -1; dy = -v; dz = u; }
        else if (f === 2) { dx = u; dy = 1; dz = v; }
        else if (f === 3) { dx = u; dy = -1; dz = -v; }
        else if (f === 4) { dx = u; dy = -v; dz = 1; }
        else { dx = -u; dy = -v; dz = -1; }
        const len = Math.hypot(dx, dy, dz) || 1;
        dx /= len; dy /= len; dz /= len;
        const eu = Math.atan2(dz, dx) / TAU + 0.5;
        const ev = Math.acos(Math.max(-1, Math.min(1, dy))) / Math.PI;
        const c = sampleEquirect(hdr, eu, ev, hdrW, hdrH);
        const idx = (y * ENV_SIZE + x) * 4;
        /* RGBA16F 上限 65504；太阳原值会溢出成 Inf。 */
        face[idx]     = Math.min(c[0], 60000);
        face[idx + 1] = Math.min(c[1], 60000);
        face[idx + 2] = Math.min(c[2], 60000);
        face[idx + 3] = 1;
      }
    }
    gl.texImage2D(
      gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, gl.RGBA16F, ENV_SIZE, ENV_SIZE, 0,
      gl.RGBA, gl.FLOAT, face,
    );
  }
}

/* ================================================================== *
 * 5. 外部无散流场
 * ================================================================== */
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function flowPsi(x, y, t) {
  /* 流场在屏幕边缘之前就衰减到 0：液滴不会被推到画面外再被裁掉。
     只用低波数、慢时间的模态：大尺度漂移 + 轻微剪切，避免高频流场
     把液滴拉成薄膜。 */
  const win = smoothstep(0.68, 0.44, Math.abs(x)) * smoothstep(0.54, 0.32, Math.abs(y));
  if (win <= 0) return 0;
  const k1 = 1.35, k2 = 1.75, k3 = 2.15;
  const w1 = TAU / 78, w2 = TAU / 95, w3 = TAU / 63;
  const m1 = Math.sin(k1 * x + w1 * t + 0.7) * Math.cos(k1 * y + 0.3);
  const m2 = Math.cos(k2 * x - 0.4) * Math.sin(k2 * y + w2 * t + 1.1);
  const m3 = Math.sin(k3 * (x + y) + w3 * t + 2.0) * Math.cos(k3 * (x - y) - 0.8);
  return win * (0.70 * m1 + 0.45 * m2 + 0.25 * m3);
}

function flowAt(x, y, t) {
  const e = 1e-3;
  const ux = (flowPsi(x, y + e, t) - flowPsi(x, y - e, t)) / (2 * e);
  const uy = -(flowPsi(x + e, y, t) - flowPsi(x - e, y, t)) / (2 * e);
  return [ux * state.flow, uy * state.flow];
}

let flowTex = null;
const flowData = new Float32Array(FLOW_W * FLOW_H * 4);

function updateFlowTexture() {
  const aspect = Math.max(1e-3, cssW / Math.max(1, cssH));
  for (let y = 0; y < FLOW_H; y += 1) {
    const py = (y + 0.5) / FLOW_H - 0.5;
    for (let x = 0; x < FLOW_W; x += 1) {
      const px = ((x + 0.5) / FLOW_W - 0.5) * aspect;
      const u = flowAt(px, py, flowTime);
      const i = (y * FLOW_W + x) * 4;
      flowData[i] = u[0];
      flowData[i + 1] = u[1];
      flowData[i + 2] = 0;
      flowData[i + 3] = 1;
    }
  }
  if (!flowTex) flowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, flowTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, FLOW_W, FLOW_H, 0, gl.RGBA, gl.FLOAT, flowData);
}

    x.beginPath();
    x.arc(w * (0.12 + i * 0.095), h * (0.18 + (i % 3) * 0.30), 34 + i * 13, 0, Math.PI * 2);
    x.stroke();
  }
  x.fillStyle = "#f2f6ff";
  x.font = "600 92px ui-sans-serif, system-ui, sans-serif";
  x.fillText("LIQUID", w * 0.07, h * 0.80);
  x.font = "600 92px ui-monospace, Consolas, monospace";
  x.fillText("GLASS", w * 0.07, h * 0.90);
  addGrain(x, w, h, 0.05);
  return c;
}

function ensureBgTex() {
  if (bgTex) return;
  bgTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function uploadImage(img) {
  ensureBgTex();
  bgAspect = img.width / Math.max(1, img.height);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

function setBackground(kind) {
  const img = kind === "chart" ? makeChart(1920, 1280) : makePhoto(1920, 1280);
  pageBg.src = img.toDataURL("image/jpeg", 0.92);
  uploadImage(img);
}

/* ================================================================== *
 * 7. 相场 / 容量场 / 高度 / 玻璃层目标
 * ================================================================== */
let cssW = 1, cssH = 1;
let PHI_W = 2, PHI_H = 2;
let phiTargets = [];
let psiTargets = [];
let glassBuf = null;
let phiCur = 0;
let psiCur = 0;
let psiAllocated = false;

function allocSim() {
  for (const t of phiTargets) disposeTarget(t);
  for (const t of psiTargets) disposeTarget(t);
  disposeTarget(glassBuf);

  phiTargets = [];
  psiTargets = [];
  for (let i = 0; i < 2; i += 1) {
    const p = makeTarget(PHI_W, PHI_H, FIELD_FMT, FIELD_TYPE, gl.LINEAR, gl.LINEAR);
    if (!p) fail("无法创建相场渲染目标（RGBA16F / RGBA8）");
    phiTargets.push(p);
    const q = makeTarget(PHI_W, PHI_H, FIELD_FMT, FIELD_TYPE, gl.LINEAR, gl.LINEAR);
    if (!q) fail("无法创建容量场渲染目标");
    psiTargets.push(q);
  }
  glassBuf = makeTarget(PHI_W, PHI_H, FIELD_FMT, FIELD_TYPE, gl.LINEAR, gl.LINEAR);
  if (!glassBuf) fail("无法创建玻璃层渲染目标");

  phiCur = 0;
  psiCur = 0;
  psiAllocated = true;
  allocProbe();
}

function clearTarget(t, r, g, b, a) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.viewport(0, 0, t.w, t.h);
  gl.clearColor(r, g, b, a);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ================================================================== *
 * 8. 探针：GPU 降采样 + 异步回读；CPU 连通域 + 每滴等效半径
 *
 * 渲染高度需要每只液滴的“面积等效半径” R。这个量不能在像素着色器里
 * 从距离场得到（那正是脊线的来源），所以在 1/4 分辨率的探针上做连通域
 * 标记。它只影响渲染，不参与流体推进。
 * ================================================================== */
let PROBE_W = 2, PROBE_H = 2;
let probeTex = null, probeFbo = null, probeBuf = null;
let probeData = new Uint8Array(4);
let probeFence = null;
let scaleTex = null;
let scaleData = new Float32Array(4);
let scalePrev = new Float32Array(1);
let scaleFirst = true;
let massTarget = 0;
let massCurrent = 0;
let massFixScale = 1;
let volumeTarget = 0;
let volumeScale = 1;
let compCount = 0;
let lastMaxR = 0;

function allocProbe() {
  if (probeTex) gl.deleteTexture(probeTex);
  if (probeFbo) gl.deleteFramebuffer(probeFbo);
  if (probeBuf) gl.deleteBuffer(probeBuf);

  PROBE_W = Math.max(8, Math.round(PHI_W / 4));
  PROBE_H = Math.max(6, Math.round(PHI_H / 4));
  probeTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, probeTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, PROBE_W, PROBE_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  probeFbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, probeFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, probeTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  probeData = new Uint8Array(PROBE_W * PROBE_H * 4);
  probeBuf = gl.createBuffer();
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probeBuf);
  gl.bufferData(gl.PIXEL_PACK_BUFFER, probeData.byteLength, gl.STREAM_READ);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);

  if (probeFence) {
    gl.deleteSync(probeFence);
    probeFence = null;
  }

  if (scaleTex) gl.deleteTexture(scaleTex);
  scaleTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, scaleTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  scaleData = new Float32Array(PROBE_W * PROBE_H * 4);
  scalePrev = new Float32Array(PROBE_W * PROBE_H);
  scaleData.fill(0.12);
  for (let i = 0; i < PROBE_W * PROBE_H; i += 1) {
    scaleData[i * 4] = 0.12;
    scaleData[i * 4 + 3] = 1;
  }
  gl.texImage2D(
    gl.TEXTURE_2D, 0, gl.RGBA16F, PROBE_W, PROBE_H, 0, gl.RGBA, gl.FLOAT, scaleData,
  );
  scaleFirst = true;
}

function drawProbe(sync) {
  /* 同步探针会覆盖 GPU 上尚未完成的旧异步读回，先丢旧 fence。 */
  if (probeFence) {
    gl.deleteSync(probeFence);
    probeFence = null;
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, probeFbo);
  gl.viewport(0, 0, PROBE_W, PROBE_H);
  gl.useProgram(progProbe);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[phiCur].tex);
  gl.uniform1i(UProbe.uPhi, 0);
  gl.uniform2f(UProbe.uSrcRes, PHI_W, PHI_H);
  gl.uniform2f(UProbe.uDstRes, PROBE_W, PROBE_H);
  drawQuad();

  /* readPixels 必须从 probeFbo 读，不能先绑回默认帧缓冲。 */
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probeBuf);
  gl.readPixels(0, 0, PROBE_W, PROBE_H, gl.RGBA, gl.UNSIGNED_BYTE, 0);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  if (sync) {
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probeBuf);
    gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, probeData);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    onProbeData();
  } else {
    probeFence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();
  }
}

function pollProbe() {
  if (!probeFence) return;
  const status = gl.clientWaitSync(probeFence, 0, 0);
  if (status === gl.WAIT_FAILED) {
    gl.deleteSync(probeFence);
    probeFence = null;
    return;
  }
  if (status !== gl.ALREADY_SIGNALED && status !== gl.CONDITION_SATISFIED) return;
  gl.deleteSync(probeFence);
  probeFence = null;
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probeBuf);
  gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, probeData);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  onProbeData();
}

function onProbeData() {
  const W = PROBE_W, H = PROBE_H;
  const N = W * H;
  let sum = 0;
  for (let i = 0; i < N; i += 1) sum += probeData[i * 4];
  const mass = sum / (N * 255);
  massCurrent = mass;

  const wet = new Uint8Array(N);
  for (let i = 0; i < N; i += 1) wet[i] = probeData[i * 4] > 127 ? 1 : 0;

  const label = new Int32Array(N).fill(-1);
  const comps = [];
  const stack = new Int32Array(N);
  for (let i = 0; i < N; i += 1) {
    if (!wet[i] || label[i] >= 0) continue;
    const id = comps.length;
    let sp = 0;
    stack[sp++] = i;
    label[i] = id;
    let area = 0;
    while (sp > 0) {
      const k = stack[--sp];
      area += 1;
      const x = k % W, y = (k / W) | 0;
      if (x > 0 && wet[k - 1] && label[k - 1] < 0) { label[k - 1] = id; stack[sp++] = k - 1; }
      if (x + 1 < W && wet[k + 1] && label[k + 1] < 0) { label[k + 1] = id; stack[sp++] = k + 1; }
      if (y > 0 && wet[k - W] && label[k - W] < 0) { label[k - W] = id; stack[sp++] = k - W; }
      if (y + 1 < H && wet[k + W] && label[k + W] < 0) { label[k + W] = id; stack[sp++] = k + W; }
    }
    comps.push({ area });
  }
  compCount = comps.length;

  const aspect = Math.max(1e-3, PHI_W / Math.max(1, PHI_H));
  const cellArea = (4 * aspect / Math.max(1, PHI_W)) * (4 / Math.max(1, PHI_H));
  const radii = new Float32Array(comps.length);
  for (let i = 0; i < comps.length; i += 1) {
    const A = comps[i].area * cellArea;
    radii[i] = Math.max(0.015, Math.min(0.8, Math.sqrt(A / Math.PI)));
  }

  /* 每只液滴的 R 扩散到全屏，供高度着色器双线性采样。
     这样液滴合并/分裂时 R 会平滑过渡，不会在接触线处出现矩形或台阶。 */
  const rMap = new Float32Array(N);
  const queue = new Int32Array(N);
  let qh = 0, qt = 0;
  for (let i = 0; i < N; i += 1) {
    const id = label[i];
    if (id >= 0) {
      rMap[i] = radii[id];
      queue[qt++] = i;
    }
  }
  if (qt === 0) {
    rMap.fill(0.12);
  } else {
    while (qh < qt) {
      const k = queue[qh++];
      const r = rMap[k];
      const x = k % W, y = (k / W) | 0;
      if (x > 0 && rMap[k - 1] === 0) { rMap[k - 1] = r; queue[qt++] = k - 1; }
      if (x + 1 < W && rMap[k + 1] === 0) { rMap[k + 1] = r; queue[qt++] = k + 1; }
      if (y > 0 && rMap[k - W] === 0) { rMap[k - W] = r; queue[qt++] = k - W; }
      if (y + 1 < H && rMap[k + W] === 0) { rMap[k + W] = r; queue[qt++] = k + W; }
    }
  }

  const blend = scaleFirst ? 1 : 0.35;
  for (let i = 0; i < N; i += 1) {
    const v = rMap[i] || 0.12;
    const prev = scalePrev[i] || 0.12;
    const next = prev + (v - prev) * blend;
    scalePrev[i] = next;
    scaleData[i * 4] = next;
    scaleData[i * 4 + 1] = 0;
    scaleData[i * 4 + 2] = 0;
    scaleData[i * 4 + 3] = 1;
  }
  scaleFirst = false;

  gl.bindTexture(gl.TEXTURE_2D, scaleTex);
  gl.texImage2D(
    gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.FLOAT, scaleData,
  );

  /* 体积：把和面积等效半径 R 对应的球冠体积加起来。总面积变化时用
     volumeScale 做一次全局重标定，保证 3D 体积不随合并/分裂漂移。 */
  const tanHalf = Math.tan(0.5 * (state.contact * Math.PI) / 180);
  const capK = Math.PI * tanHalf * (3 + tanHalf * tanHalf) / 6;
  let sumR3 = 0;
  lastMaxR = 0;
  for (let i = 0; i < radii.length; i += 1) {
    sumR3 += radii[i] ** 3;
    if (radii[i] > lastMaxR) lastMaxR = radii[i];
  }
  const capVol = Math.max(capK * sumR3, 1e-9);

  if (radii.length > 0) {
    if (volumeTarget <= 0) {
      volumeTarget = capVol;
      volumeScale = 1;
    } else {
      const target = Math.max(0.3, Math.min(3.0, volumeTarget / capVol));
      volumeScale += (target - volumeScale) * 0.2;
    }
  }

  if (massTarget <= 0 && mass > 1e-5) massTarget = mass;

  if (state.massFix && massTarget > 1e-5) {
    const drift = mass / massTarget - 1;
    if (Math.abs(drift) > 0.0015) {
      massFixScale = Math.max(0.98, Math.min(1.02, massTarget / mass));
    }
  }
}

/* ================================================================== *
 * 9. 初始场：随机低频场 + 总液体量阈值
 * ================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let resetSeed = 1;
let fixedSeed = null;

function makeInitialField() {
  const W = PHI_W, H = PHI_H;
  const aspect = W / H;
  const rng = mulberry32(resetSeed);

  /* 随机“元球”初始场：不在代码里摆固定的水滴，也不规定滴数。
     只随机撒一些平滑的液体核，再用总液体量做全局阈值；核之间可以
     自然重叠/合并。这个场只决定 t=0，之后完全交给相场。 */
  const centers = [];
  const targetN = 5 + Math.floor(rng() * 2);
  for (let tries = 0; tries < 420 && centers.length < targetN; tries += 1) {
    const cx = (rng() * 2 - 1) * 0.37;
    const cy = (rng() * 2 - 1) * 0.29;
    const s = 0.045 + rng() * 0.020;
    let ok = true;
    for (const c of centers) {
      if (Math.hypot(c.x - cx, c.y - cy) < 0.225) { ok = false; break; }
    }
    if (!ok) continue;
    centers.push({ x: cx, y: cy, s, w: 0.78 + rng() * 0.32 });
  }
  if (centers.length === 0) centers.push({ x: 0, y: 0, s: 0.07, w: 1 });

  const noise = [];
  for (let k = 0; k < 3; k += 1) {
    const ang = rng() * TAU;
    const freq = 2.5 + rng() * 4.0;
    noise.push({
      cx: Math.cos(ang) * freq,
      cy: Math.sin(ang) * freq,
      phase: rng() * TAU,
      amp: 0.025 + rng() * 0.025,
    });
  }

  const f = new Float32Array(W * H);
  let fmax = 0;
  for (let y = 0; y < H; y += 1) {
    const sy = (y + 0.5) / H - 0.5;
    for (let x = 0; x < W; x += 1) {
      const sx = ((x + 0.5) / W - 0.5) * aspect;
      let v = 0;
      for (const c of centers) {
        const dx = sx - c.x;
        const dy = sy - c.y;
        v += c.w * Math.exp(-(dx * dx + dy * dy) / (2 * c.s * c.s));
      }
      let wobble = 0;
      for (const n of noise) wobble += n.amp * Math.cos(n.cx * sx + n.cy * sy + n.phase);
      v += wobble * Math.min(1, v * 2.5);
      f[y * W + x] = v;
      if (v > fmax) fmax = v;
    }
  }

  /* 阈值只由总液体量决定；软边只控制初始界面宽度。 */
  const soft = Math.max(0.02, fmax * 0.055);
  let lo = -1e-3, hi = fmax + 1e-3;
  for (let it = 0; it < 34; it += 1) {
    const mid = 0.5 * (lo + hi);
    let sum = 0;
    for (let i = 0; i < W * H; i += 1) {
      sum += 0.5 * (1 + Math.tanh((f[i] - mid) / soft));
    }
    const avg = sum / (W * H);
    if (avg > state.amount) lo = mid; else hi = mid;
  }
  const thr = 0.5 * (lo + hi);

  if (FIELD_FMT === gl.RGBA8) {
    const data = new Uint8Array(W * H * 4);
    for (let i = 0; i < W * H; i += 1) {
      const phi = 0.5 * (1 + Math.tanh((f[i] - thr) / soft));
      data[i * 4] = Math.round(phi * 255);
      data[i * 4 + 3] = 255;
    }
    return data;
  }
  const data = new Float32Array(W * H * 4);
  for (let i = 0; i < W * H; i += 1) {
    data[i * 4] = 0.5 * (1 + Math.tanh((f[i] - thr) / soft));
    data[i * 4 + 3] = 1;
  }
  return data;
}

function uploadField(data) {
  /* RGBA16F 上传 Float32Array 时必须用 gl.FLOAT；gl.HALF_FLOAT 只接受
     Uint16Array 的半精度位模式。渲染目标分配时用 HALF_FLOAT + null 没问题。 */
  const uploadType = FIELD_FMT === gl.RGBA8 ? gl.UNSIGNED_BYTE : gl.FLOAT;
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[0].tex);
  gl.texImage2D(
    gl.TEXTURE_2D, 0, FIELD_FMT, PHI_W, PHI_H, 0, gl.RGBA, uploadType, data,
  );
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[1].tex);
  gl.texImage2D(
    gl.TEXTURE_2D, 0, FIELD_FMT, PHI_W, PHI_H, 0, gl.RGBA, uploadType,
    FIELD_FMT === gl.RGBA8 ? new Uint8Array(PHI_W * PHI_H * 4) : new Float32Array(PHI_W * PHI_H * 4),
  );
  phiCur = 0;
}

/* ================================================================== *
 * 10. 每一步 GPU pass
 * ================================================================== */
function cacStep(dt) {
  const dst = 1 - phiCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, phiTargets[dst].fbo);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progCac);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[phiCur].tex);
  gl.uniform1i(UCac.uPhi, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, flowTex);
  gl.uniform1i(UCac.uFlow, 1);
  gl.uniform2f(UCac.uRes, PHI_W, PHI_H);
  gl.uniform1f(UCac.uDt, dt);
  gl.uniform1f(UCac.uEps, state.eps);
  gl.uniform1f(UCac.uM, state.mobility);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  phiCur = dst;
}

function applyMassFix() {
  const dst = 1 - phiCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, phiTargets[dst].fbo);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progMassFix);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[phiCur].tex);
  gl.uniform1i(UMass.uPhi, 0);
  gl.uniform2f(UMass.uRes, PHI_W, PHI_H);
  gl.uniform1f(UMass.uScale, massFixScale);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  phiCur = dst;
  massFixScale = 1;
}

function psiIterations(n) {
  if (!psiAllocated) return;
  gl.useProgram(progPsi);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.uniform2f(UPsi.uRes, PHI_W, PHI_H);
  gl.uniform1f(UPsi.uOmega, 1.82);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[phiCur].tex);
  gl.uniform1i(UPsi.uPhi, 1);
  for (let i = 0; i < n; i += 1) {
    /* 红：psiA -> psiB */
    gl.bindFramebuffer(gl.FRAMEBUFFER, psiTargets[1].fbo);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, psiTargets[0].tex);
    gl.uniform1i(UPsi.uPsi, 0);
    gl.uniform1i(UPsi.uParity, 0);
    drawQuad();
    /* 黑：psiB -> psiA */
    gl.bindFramebuffer(gl.FRAMEBUFFER, psiTargets[0].fbo);
    gl.bindTexture(gl.TEXTURE_2D, psiTargets[1].tex);
    gl.uniform1i(UPsi.uPsi, 0);
    gl.uniform1i(UPsi.uParity, 1);
    drawQuad();
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  psiCur = 0;
}

function geoPass() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, glassBuf.fbo);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progGeo);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, psiTargets[psiCur].tex);
  gl.uniform1i(UG.uPsi, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, phiTargets[phiCur].tex);
  gl.uniform1i(UG.uPhi, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, scaleTex);
  gl.uniform1i(UG.uScale, 2);
  gl.uniform2f(UG.uRes, PHI_W, PHI_H);
  gl.uniform1f(UG.uPH, PHI_H);
  gl.uniform1f(UG.uTheta, (state.contact * Math.PI) / 180);
  gl.uniform1f(UG.uVolScale, volumeScale);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function uvRect() {
  const view = outW / Math.max(1, outH);
  let sx = 1, sy = 1, ox = 0, oy = 0;
  if (bgAspect > view) {
    sx = view / bgAspect;
    ox = (1 - sx) * 0.5;
  } else {
    sy = bgAspect / view;
    oy = (1 - sy) * 0.5;
  }
  return [sx, sy, ox, oy];
}

function fillPalette() {
  const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return fillLight ? [1, 1, 1] : [lin(0.12), lin(0.12), lin(0.12)];
}

function composite() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, outW, outH);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (off) return;

  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, glassBuf.tex);
  gl.uniform1i(UC.uGlass, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.uniform1i(UC.uBg, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, envTex);
  gl.uniform1i(UC.uEnv, 2);
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, srgbTex);
  gl.uniform1i(UC.uSRGB, 3);

  const [sx, sy, ox, oy] = uvRect();
  gl.uniform2f(UC.uRes, outW, outH);
  gl.uniform2f(UC.uUvScale, sx, sy);
  gl.uniform2f(UC.uUvOffset, ox, oy);
  gl.uniform1f(UC.uOn, 1);
  gl.uniform1f(UC.uLod, state.lod);
  gl.uniform1f(UC.uSpec, state.spec);
  gl.uniform1f(UC.uFillAlpha, state.density);
  gl.uniform1f(UC.uEnvRot, (state.envRot * Math.PI) / 180);
  gl.uniform1f(UC.uEnvIntensity, state.env);
  gl.uniform1f(UC.uHref, 0.08);
  gl.uniform1f(UC.uGlassT, state.glass / WORLD_MM);
  gl.uniform3fv(UC.uFill, fillPalette());
  gl.uniform3fv(UC.uLightDir, envLight);
  drawQuad();
}

/* ================================================================== *
 * 11. 尺寸 / 自适应
 * ================================================================== */
let outW = 2, outH = 2;
let dprLevel = 3;
let dpr = MAX_DPR_LEVELS[dprLevel];

function outSize() {
  return [
    Math.max(2, Math.round(cssW * dpr)),
    Math.max(2, Math.round(cssH * dpr)),
  ];
}

function resizeOutput() {
  const [w, h] = outSize();
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  outW = w; outH = h;
  elRes.textContent = "输出 " + w + "×" + h + " · DPR " + dpr.toFixed(2);
}

function initSimSize() {
  const gW = Math.max(48, Math.round(cssW * PHI_SCALE));
  const gH = Math.max(32, Math.round(cssH * PHI_SCALE));
  const changed = gW !== PHI_W || gH !== PHI_H;
  if (changed) {
    PHI_W = gW; PHI_H = gH;
    allocSim();
  }
  return changed;
}

function resizeLayout() {
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  flowCanvas.width = Math.max(2, Math.round(cssW));
  flowCanvas.height = Math.max(2, Math.round(cssH));
  dprLevel = Math.min(MAX_DPR_LEVELS.length - 1, Math.max(0, dprLevel));
  dpr = MAX_DPR_LEVELS[dprLevel];
  resizeOutput();
  const changed = initSimSize();
  elPhi.textContent = PHI_W + "×" + PHI_H;
  if (changed) resetScene(false);
}

/* ================================================================== *
 * 12. 重置 / 渲染循环
 * ================================================================== */
function resetScene(skipProbe) {
  resetSeed = fixedSeed !== null ? fixedSeed : ((Math.random() * 1e9) | 0);
  const data = makeInitialField();
  uploadField(data);
  for (const t of psiTargets) clearTarget(t, 0, 0, 0, 0);
  psiCur = 0;
  massTarget = 0;
  massCurrent = 0;
  massFixScale = 1;
  volumeTarget = 0;
  volumeScale = 1;
  compCount = 0;
  scaleFirst = true;
  scalePrev.fill(0.12);
  flowTime = 0;
  updateFlowTexture();
  psiIterations(PSI_ITERS_RESET);
  if (!skipProbe) {
    drawProbe(true);
    /* 探针已经给出初始 R 和总质量；再解几轮让高度贴合新的 R。 */
    psiIterations(4);
  }
  lastProbeAt = performance.now();
}

let last = performance.now();
let lastPresent = 0;
let acc = 0, frames = 0, fps = 0, frameMs = 0;
let lastProbeAt = 0;
let lastAdjust = 0;
let justDown = false;
let gpuMs = 6.0;
const BUDGET_HI = 8.0, BUDGET_LO = 4.8;
const timerExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");
let gpuQuery = null;
const gpuPending = [];

const elFps = document.getElementById("fps");
const elMs = document.getElementById("ms");
const elGpu = document.getElementById("gpu");
const elRes = document.getElementById("res");
const elPhi = document.getElementById("phi");
const elMass = document.getElementById("mass");
const elComps = document.getElementById("comps");
const elDrift = document.getElementById("drift");
const elVol = document.getElementById("vol");

function drawFlowOverlay() {
  const w = flowCanvas.width, h = flowCanvas.height;
  fctx.clearRect(0, 0, w, h);
  if (!showFlow) return;
  fctx.strokeStyle = "rgba(150,195,255,0.34)";
  fctx.fillStyle = "rgba(150,195,255,0.34)";
  fctx.lineWidth = 1;
  const cols = 16, rows = 10;
  for (let j = 0; j < rows; j += 1) {
    for (let i = 0; i < cols; i += 1) {
      const px = ((i + 0.5) / cols - 0.5) * (w / h);
      const py = 0.5 - (j + 0.5) / rows;
      const u = flowAt(px, py, flowTime);
      const sx = w * 0.5 + px * h;
      const sy = h * 0.5 - py * h;
      const scale = h * 1.1;
      const ex = sx + u[0] * scale;
      const ey = sy - u[1] * scale;
      fctx.beginPath(); fctx.moveTo(sx, sy); fctx.lineTo(ex, ey); fctx.stroke();
      const a = Math.atan2(ey - sy, ex - sx);
      fctx.beginPath();
      fctx.moveTo(ex, ey);
      fctx.lineTo(ex - 4 * Math.cos(a - 0.5), ey - 4 * Math.sin(a - 0.5));
      fctx.lineTo(ex - 4 * Math.cos(a + 0.5), ey - 4 * Math.sin(a + 0.5));
      fctx.closePath(); fctx.fill();
    }
  }
}

function advanceSim(dt) {
  flowTime += dt;
  updateFlowTexture();
  const sub = Math.min(Math.max(dt, 0), 0.033) / cacSubsteps;
  for (let i = 0; i < cacSubsteps; i += 1) cacStep(sub);
  if (massFixScale !== 1) applyMassFix();
  psiIterations(PSI_ITERS);
}

function drawDebug() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, outW, outH);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(progDebug);
  gl.activeTexture(gl.TEXTURE0);
  let tex = phiTargets[phiCur].tex;
  let mode = 0;
  let scale = 1;
  if (debugMode === "psi") {
    tex = psiTargets[psiCur].tex;
    scale = 1 / 200;
  } else if (debugMode === "h") {
    tex = glassBuf.tex;
    mode = 2;
    scale = 5;
  } else if (debugMode === "glass") {
    tex = glassBuf.tex;
    mode = 1;
  }
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(UDebug.uTex, 0);
  gl.uniform2f(UDebug.uRes, outW, outH);
  gl.uniform1i(UDebug.uMode, mode);
  gl.uniform1f(UDebug.uScale, scale);
  drawQuad();
}

function renderFrame() {
  geoPass();
  if (debugMode) {
    drawDebug();
  } else {
    composite();
  }
  drawFlowOverlay();
}

function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = Math.min((now - last) / 1000, 0.05);
  const dt = rawDt * state.speed;
  last = now;

  if (timerExt && !gpuQuery) {
    gpuQuery = gl.createQuery();
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, gpuQuery);
  }

  pollProbe();
  if (!paused) advanceSim(dt);

  if (now - lastProbeAt > 220 && !probeFence) {
    lastProbeAt = now;
    drawProbe(false);
  }

  renderFrame();

  if (timerExt && gpuQuery) {
    gl.endQuery(timerExt.TIME_ELAPSED_EXT);
    gpuPending.push(gpuQuery);
    gpuQuery = null;
  }
  if (timerExt) {
    while (gpuPending.length) {
      const q = gpuPending[0];
      if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break;
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
        const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);
        gpuMs = gpuMs * 0.88 + (ns / 1e6) * 0.12;
      }
      gl.deleteQuery(q);
      gpuPending.shift();
    }
    while (gpuPending.length > 8) gl.deleteQuery(gpuPending.shift());
  } else {
    gpuMs = gpuMs * 0.92 + Math.min(rawDt * 1000, 33) * 0.08;
  }

  /* 有 GPU timer 时按 120fps 的 8ms 预算；没有 timer 时帧间隔含 vsync，
     用 60Hz 的宽松预算，避免在 60Hz 屏上无意义地降 DPR。 */
  const budgetHi = timerExt ? BUDGET_HI : 19.0;
  const budgetLo = timerExt ? BUDGET_LO : 17.4;
  if (now - lastAdjust > (justDown ? 1600 : 5000) && now > 2500 && !document.hidden) {
    if (gpuMs > budgetHi && dprLevel > 0) {
      dprLevel -= 1; dpr = MAX_DPR_LEVELS[dprLevel]; resizeOutput();
      lastAdjust = now; justDown = true;
    } else if (gpuMs < budgetLo && dprLevel < MAX_DPR_LEVELS.length - 1) {
      dprLevel += 1; dpr = MAX_DPR_LEVELS[dprLevel]; resizeOutput();
      lastAdjust = now; justDown = false;
    }
  }

  acc += rawDt; frames += 1;
  if (acc >= 0.5) {
    fps = frames / acc;
    frameMs = (acc / frames) * 1000;
    elFps.textContent = fps.toFixed(0);
    elMs.textContent = frameMs.toFixed(1);
    elGpu.textContent = gpuMs.toFixed(1);
    elMass.textContent = (massCurrent * 100).toFixed(2) + "%";
    elComps.textContent = String(compCount);
    const md = massTarget > 1e-5 ? (massCurrent / massTarget - 1) * 100 : 0;
    elDrift.textContent = (md >= 0 ? "+" : "") + md.toFixed(2) + "%";
    elVol.textContent = volumeScale.toFixed(2);
    acc = 0; frames = 0;
  }
}

/* ================================================================== *
 * 13. UI
 * ================================================================== */
const slidersEl = document.getElementById("sliders");
const inputs = {};

function rebuildAndReset() {
  resetScene(false);
}

for (const [key, label, min, max, step, desc] of SLIDERS) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("label");
  const name = document.createElement("span");
  const val = document.createElement("span");
  name.textContent = label;
  lab.append(name, val);
  const input = document.createElement("input");
  input.type = "range";
  input.min = min; input.max = max; input.step = step;
  input.value = state[key];
  input.title = desc || "";
  const show = () => {
    const v = Number(input.value);
    if (key === "envRot" || key === "contact") { val.textContent = v.toFixed(0); return; }
    const dp = step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    val.textContent = v.toFixed(dp);
  };
  input.addEventListener("input", () => {
    state[key] = Number(input.value);
    show();
  });
  input.addEventListener("change", () => {
    if (key === "amount") rebuildAndReset();
    if (key === "contact") {
      volumeTarget = 0;
      volumeScale = 1;
    }
  });
  show();
  row.append(lab, input);
  if (desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = desc;
    row.append(d);
  }
  slidersEl.append(row);
  inputs[key] = { input, show };
}

function syncInputs() {
  for (const [key] of SLIDERS) {
    inputs[key].input.value = state[key];
    inputs[key].show();
  }
}

const panelEl = document.getElementById("panel");
const toggleEl = document.getElementById("toggle");
function setCollapsed(v) {
  panelEl.classList.toggle("collapsed", v);
  toggleEl.textContent = v ? "展开" : "收起";
  try { localStorage.setItem("lg.panel2", v ? "1" : "0"); } catch (_) {}
}
toggleEl.addEventListener("click", () => setCollapsed(!panelEl.classList.contains("collapsed")));
try {
  if (localStorage.getItem("lg.panel2") !== "0") setCollapsed(true);
} catch (_) {
  setCollapsed(true);
}

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyH") setCollapsed(!panelEl.classList.contains("collapsed"));
  if (e.code === "Escape") setCollapsed(true);
});

const btnPause = document.getElementById("btnPause");
btnPause.addEventListener("click", () => {
  paused = !paused;
  btnPause.classList.toggle("on", paused);
  btnPause.textContent = paused ? "继续" : "暂停";
});

const btnCompare = document.getElementById("btnCompare");
btnCompare.addEventListener("pointerdown", () => { off = true; btnCompare.classList.add("on"); });
btnCompare.addEventListener("pointerup", () => { off = false; btnCompare.classList.remove("on"); });
btnCompare.addEventListener("pointerleave", () => { off = false; btnCompare.classList.remove("on"); });

document.getElementById("btnReset").addEventListener("click", () => {
  resetScene(false);
});

const btnFill = document.getElementById("btnFill");
btnFill.addEventListener("click", () => {
  fillLight = !fillLight;
  btnFill.textContent = fillLight ? "底色：亮" : "底色：暗";
});

const btnMass = document.getElementById("btnMass");
btnMass.addEventListener("click", () => {
  state.massFix = !state.massFix;
  btnMass.classList.toggle("on", state.massFix);
});

const btnFlow = document.getElementById("btnFlow");
btnFlow.addEventListener("click", () => {
  showFlow = !showFlow;
  flowCanvas.style.display = showFlow ? "block" : "none";
  btnFlow.classList.toggle("on", showFlow);
});

const btnPhoto = document.getElementById("btnPhoto");
const btnChart = document.getElementById("btnChart");
btnPhoto.addEventListener("click", () => {
  setBackground("photo");
  btnPhoto.classList.add("on"); btnChart.classList.remove("on");
});
btnChart.addEventListener("click", () => {
  setBackground("chart");
  btnChart.classList.add("on"); btnPhoto.classList.remove("on");
});

document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
});

function loadFile(file) {
  if (!file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  pageBg.src = url;
  const img = new Image();
  img.onload = () => {
    uploadImage(img);
    btnPhoto.classList.remove("on");
    btnChart.classList.remove("on");
  };
  img.src = url;
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); off = true; }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") { e.preventDefault(); off = false; }
});

const dropEl = document.getElementById("drop");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  e.preventDefault(); dragDepth++; dropEl.classList.add("show");
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("dragleave", (e) => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("show"); }
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0; dropEl.classList.remove("show");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

window.addEventListener("resize", () => {
  clearTimeout(window.__lgResizeTimer);
  window.__lgResizeTimer = setTimeout(resizeLayout, 180);
});

/* ================================================================== *
 * 14. 启动 / hash 参数
 * ================================================================== */
const hash = location.hash.slice(1);
const hashParts = hash.split("&").filter(Boolean);
const hashMap = {};
for (const kv of hashParts) {
  const [k, v] = kv.split("=");
  if (!k) continue;
  hashMap[k] = v === undefined ? true : v;
}
for (const k of Object.keys(state)) {
  if (hashMap[k] !== undefined && typeof state[k] === "number") {
    const n = parseFloat(hashMap[k]);
    if (isFinite(n)) state[k] = n;
  }
}
if (hashMap.clean) document.body.classList.add("clean");
if (hashMap.debug) debugMode = String(hashMap.debug);
if (hashMap.seed !== undefined) {
  const s = parseInt(hashMap.seed, 10);
  if (isFinite(s)) fixedSeed = s;
}
if (hashMap.substeps !== undefined) {
  const s = parseInt(hashMap.substeps, 10);
  if (isFinite(s)) cacSubsteps = Math.max(1, Math.min(12, s));
}

setBackground(hashMap.chart ? "chart" : "photo");
if (hashMap.chart) {
  btnChart.classList.add("on");
  btnPhoto.classList.remove("on");
}
syncInputs();
buildEnvironment();

cssW = Math.max(1, window.innerWidth);
cssH = Math.max(1, window.innerHeight);
flowCanvas.width = Math.max(2, Math.round(cssW));
flowCanvas.height = Math.max(2, Math.round(cssH));
initSimSize();
resizeOutput();
resetScene(false);

/* 开发/自动验收接口；产品里不会出现。 */
window.__lg = {
  state,
  reset: () => resetScene(false),
  probe: () => drawProbe(true),
  step: (n) => {
    for (let i = 0; i < n; i += 1) {
      advanceSim(1 / 60);
    }
  },
  render: renderFrame,
  mass: () => ({ mass: massCurrent, target: massTarget, comps: compCount, volumeScale }),
  gl,
  targets: () => ({ phiW: PHI_W, phiH: PHI_H, phiCur, probeW: PROBE_W, probeH: PROBE_H }),
};

if (hashMap.still) {
  const steps = Math.max(1, Math.min(600, parseInt(hashMap.steps || "90", 10) || 90));
  const probeEvery = Math.max(0, parseInt(hashMap.probeEvery || "0", 10) || 0);
  if (probeEvery > 0) {
    for (let i = 0; i < steps; i += 1) {
      advanceSim(1 / 60);
      if ((i + 1) % probeEvery === 0) {
        drawProbe(true);
        if (massFixScale !== 1) applyMassFix();
      }
    }
  } else {
    window.__lg.step(steps);
  }
  drawProbe(true);
  psiIterations(6);
  renderFrame();
  document.title = "STILL mass=" + massCurrent.toFixed(4) +
    " comps=" + compCount + " drift=" +
    (massTarget > 0 ? ((massCurrent / massTarget - 1) * 100).toFixed(2) : "0") + "%" +
    " vol=" + volumeScale.toFixed(2) +
    " R=" + lastMaxR.toFixed(3) +
    " hmax=" + (lastMaxR * Math.tan(0.5 * state.contact * Math.PI / 180) * volumeScale).toFixed(3);
  /* 只重画、不推进模拟；让截图/合成器稳定拿到 WebGL 画布。 */
  const stillLoop = () => {
    renderFrame();
    requestAnimationFrame(stillLoop);
  };
  requestAnimationFrame(stillLoop);
} else {
  requestAnimationFrame(frame);
}
</script>
