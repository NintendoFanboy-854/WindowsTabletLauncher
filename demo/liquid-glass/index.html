<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>液态玻璃 · 动态引力场</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; }
  #pagebg {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: cover; z-index: 0; user-select: none; -webkit-user-drag: none;
  }
  #gl {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 1; pointer-events: none; display: block;
  }
  #flow {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; display: none; z-index: 4;
  }
  #hud {
    position: fixed; top: 12px; right: 14px; z-index: 10;
    font: 500 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #cfe3ff; text-shadow: 0 1px 3px #000a;
    text-align: right; pointer-events: none; user-select: none;
  }
  #hud b { font-weight: 700; color: #fff; }
  #hud .dim { opacity: .5; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 278px; z-index: 10;
    max-height: calc(100vh - 24px);
    display: flex; flex-direction: column;
    padding: 12px 14px 14px;
    border-radius: 14px;
    background: rgba(14, 18, 24, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px) saturate(140%);
    font: 400 12px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #dfe7f2; user-select: none;
  }
  #panel.collapsed { width: auto; padding: 8px 12px; }
  #panel.collapsed .body { display: none; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head h1 { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .02em; }
  #toggle {
    all: unset; cursor: pointer; padding: 2px 7px; border-radius: 7px;
    font-size: 11px; color: #9fb3cc; background: rgba(255,255,255,.07);
  }
  #toggle:hover { background: rgba(255,255,255,.13); color: #dbe7f7; }
  .body { margin-top: 10px; display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  #sliders { overflow-y: auto; min-height: 0; padding-right: 4px; }
  #sliders::-webkit-scrollbar { width: 6px; }
  #sliders::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
  .row { margin: 8px 0; }
  .row label { display: flex; justify-content: space-between; gap: 8px; color: #a8b8cc; font-size: 11px; }
  .row label span:last-child { color: #e8f1ff; font-variant-numeric: tabular-nums; }
  .desc { margin-top: 1px; font-size: 10px; line-height: 1.35; color: #8395ab; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
    background: transparent; margin: 2px 0 0; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: rgba(255,255,255,.16);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px;
    border-radius: 50%; background: #e9f2ff; box-shadow: 0 0 0 1px #0006, 0 2px 6px #0007;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .btns button, .btns label {
    all: unset; cursor: pointer; padding: 5px 9px; border-radius: 8px;
    font-size: 11px; color: #cfe0f5; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.08);
  }
  .btns button:hover, .btns label:hover { background: rgba(255,255,255,.15); }
  .btns button.on { background: rgba(120,180,255,.28); border-color: rgba(150,200,255,.35); color: #fff; }
  input[type=file] { display: none; }
  .hint { margin-top: 10px; color: #7f90a6; font-size: 10.5px; line-height: 1.5; }
  kbd { font: inherit; padding: 0 4px; border-radius: 4px; background: rgba(255,255,255,.1); }
  #drop {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(8, 12, 18, .72); z-index: 20;
    font: 600 18px ui-sans-serif, system-ui, sans-serif; color: #dbe9ff;
    border: 3px dashed rgba(140, 190, 255, .5); border-radius: 10px;
  }
  #drop.show { display: grid; }
  body.clean #panel, body.clean #hud, body.clean #flow { display: none !important; }
  #err {
    position: fixed; inset: 0; z-index: 99; margin: 0; padding: 16px; overflow: auto;
    background: #2a0d0d; color: #ffd7d7; font: 12px/1.5 ui-monospace, monospace;
    white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
<img id="pagebg" alt="" aria-hidden="true" />
<canvas id="gl"></canvas>
<canvas id="flow"></canvas>

<div id="hud">
  <div><b id="fps">–</b> fps · <span id="ms">–</span> ms</div>
  <div class="dim"><span id="res">–</span> · 液体 <span id="blobs">–</span></div>
  <div class="dim">GPU <span id="gpu">–</span> ms · 引点 <span id="grav">–</span> · 质量 <span id="mass">–</span></div>
</div>

<div id="panel">
  <div class="head">
    <h1>液态玻璃 · 动态引力场</h1>
    <button id="toggle">收起</button>
  </div>
  <div class="body">
    <div id="sliders"></div>
    <div class="btns">
      <button id="btnPause">暂停</button>
      <button id="btnCompare">对比原图</button>
      <button id="btnReset">重置</button>
      <button id="btnFill">底色：暗</button>
      <button id="btnFlow">流场 / 引点</button>
    </div>
    <div class="btns">
      <button id="btnPhoto" class="on">风景</button>
      <button id="btnChart">测试图</button>
      <label for="file">上传照片…</label>
      <input id="file" type="file" accept="image/*" />
    </div>
    <div class="hint">
      按住 <kbd>空格</kbd> 看原图 · <kbd>H</kbd> 收起面板 · 图片可直接拖进窗口
    </div>
  </div>
</div>

<div id="drop">松手载入图片</div>
<pre id="err"></pre>

<script src="hdri.js"></script>
<script>
"use strict";

/* ================================================================== *
 * 0. 常量与状态
 *
 * 这一版是一个“动态液体团块 + metaball 界面”模型：
 *   - 团块（blob）有位置、可见半径、质量；总质量固定；
 *   - 当前分布做加权 k-means，取 k 个质量簇中心作为 top-k 引力点；
 *   - 引力把团块吸向这些中心；
 *   - 低频速度场平流团块，并在局部应变大时把团块拉裂；
 *   - 团块靠近会合并，质量在合并/分裂中守恒；
 *   - 渲染时把所有团块加成 metaball 场，得到光滑液面和折射。
 *
 * 团块不是固定水滴：数量、位置、半径、质量都在变，引力点也在变。
 * ================================================================== */
const TAU = Math.PI * 2;
const WORLD_MM = 10;
const BLOB_MAX = 16;
const GLASS_SCALE = 0.18;          // 液面/法线纹理分辨率（屏幕高）
const MAX_DPR_LEVELS = [0.55, 0.70, 0.85, 1.00, 1.20, 1.40];
const GRAV_SIGMA = 0.22;

const DEFAULTS = {
  amount: 0.14,
  flow: 0.05,
  gravity: 0.35,
  gravityR: 0.20,
  k: 4,
  height: 0.12,
  lod: 0.15,
  spec: 1.1,
  density: 0.20,
  env: 1.0,
  envRot: 0,
  glass: 0.20,
  speed: 1.0,
};

const SLIDERS = [
  ["amount",   "液体量",   0.05, 0.30, 0.005, "初始团块尺寸/覆盖；重置后生效"],
  ["flow",     "搅动",     0,    0.12, 0.005, "低频速度场强度；局部应变会把团块拉裂"],
  ["gravity",  "引力",     0,    2.0,  0.02,  "top-k 引力点对团块的吸引强度"],
  ["gravityR", "引力半径", 0.08, 0.35, 0.01,  "高斯引力核尺度"],
  ["k",        "引力点数", 1,    5,    1,     "从当前团块分布取多少个质量簇中心"],
  ["height",   "水滴高度", 0.04, 0.20, 0.005, "metaball 场到屏幕高度的缩放"],
  ["lod",      "模糊",     -2,   3,    0.1,   "0 = 清透，往上加磨砂"],
  ["spec",     "高光",     0,    2.5,  0.02,  "曲面把环境光聚成的小点"],
  ["density",  "介质浓度", 0,    1,    0.01,  "参与介质光学厚度；暗色吸收、亮色散射"],
  ["env",      "环境亮度", 0,    2,    0.05,  "HDR 环境反射强度"],
  ["envRot",   "环境旋转", 0,    360,  1,     "旋转 HDR 环境"],
  ["glass",    "玻璃厚度", 0,    1.5,  0.05,  "屏幕玻璃层厚度（mm）"],
  ["speed",    "速度",     0,    3,    0.02,  "整体时间倍率"],
];

const state = Object.assign({}, DEFAULTS);
let paused = false;
let off = false;
let fillLight = false;
let showFlow = false;
let flowTime = 0;
let blobs = [];
let gravityPoints = [];
let resetSeed = 1;
let fixedSeed = null;

/* ================================================================== *
 * 1. WebGL / DOM / 基础工具
 * ================================================================== */
const canvas = document.getElementById("gl");
const IS_STILL = /(?:^|#|&)still(?:&|=|$)/.test(location.hash);
const gl = canvas.getContext("webgl2", {
  alpha: true,
  antialias: false,
  depth: false,
  stencil: false,
  premultipliedAlpha: false,
  preserveDrawingBuffer: IS_STILL,
  powerPreference: "high-performance",
});
if (!gl) {
  document.body.innerHTML =
    '<div style="padding:40px;font:16px system-ui;color:#dde">这个浏览器/机器没有 WebGL2，跑不了。</div>';
  throw new Error("no webgl2");
}

const pageBg = document.getElementById("pagebg");
const flowCanvas = document.getElementById("flow");
const fctx = flowCanvas.getContext("2d");
const errEl = document.getElementById("err");
const hasFloat = !!gl.getExtension("EXT_color_buffer_float");

function fail(msg) {
  errEl.style.display = "block";
  errEl.textContent = "液态玻璃 demo 启动失败\n\n" + msg;
  throw new Error(msg);
}
const VERT = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    fail("着色器编译失败\n\n" + gl.getShaderInfoLog(s));
  }
  return s;
}
function linkProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    fail("着色器链接失败\n\n" + gl.getProgramInfoLog(p));
  }
  return p;
}
function uniforms(program, names) {
  const out = {};
  for (const n of names) out[n] = gl.getUniformLocation(program, n);
  return out;
}
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function drawQuad() { gl.drawArrays(gl.TRIANGLES, 0, 3); }

/* sRGB 编码 LUT */
const srgbTex = gl.createTexture();
{
  const lut = new Uint8Array(256);
  for (let i = 0; i < 256; i += 1) {
    const c = i / 255;
    const s = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    lut[i] = Math.round(Math.max(0, Math.min(1, s)) * 255);
  }
  gl.bindTexture(gl.TEXTURE_2D, srgbTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, 1, 0, gl.RED, gl.UNSIGNED_BYTE, lut);
}

/* ================================================================== *
 * 2. 渲染目标
 * ================================================================== */
const FIELD_FMT = hasFloat ? gl.RGBA16F : gl.RGBA8;
const FIELD_TYPE = hasFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h, fmt, type, minFilter, magFilter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, magFilter || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (status !== gl.FRAMEBUFFER_COMPLETE) {
    gl.deleteTexture(tex);
    gl.deleteFramebuffer(fbo);
    return null;
  }
  return { tex, fbo, w, h };
}
function disposeTarget(t) {
  if (!t) return;
  gl.deleteTexture(t.tex);
  gl.deleteFramebuffer(t.fbo);
}

/* ================================================================== *
 * 3. 着色器：metaball 液面 + 光学合成
 * ================================================================== */
const GEO_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;

uniform vec4  uBlob[${BLOB_MAX}]; // xy = 位置（屏幕坐标系），z = 半径，w = 质量
uniform int   uBlobCount;
uniform vec2  uRes;
uniform float uAspect;
uniform float uHeight;

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = vec2((uv.x - 0.5) * uAspect, uv.y - 0.5);

  float F = 0.0;
  vec2 G = vec2(0.0);
  for (int i = 0; i < ${BLOB_MAX}; i++) {
    if (i >= uBlobCount) break;
    vec4 b = uBlob[i];
    vec2 d = p - b.xy;
    float r = max(b.z, 0.01);
    float r2 = dot(d, d) / (2.0 * r * r);
    if (r2 > 14.0) continue;
    float e = exp(-r2);
    F += e;
    G += -e * d / (r * r);
  }

  float tn = clamp((F - 0.12) / 0.88, 0.0, 1.0);
  float h = uHeight * pow(tn, 0.70);
  float dh = uHeight * 0.70 * pow(max(tn, 1e-4), -0.30) / 0.88;
  vec3 N = normalize(vec3(-dh * G, 1.0));
  float mask = smoothstep(0.06, 0.24, F);
  outColor = vec4(N.xy * 0.5 + 0.5, mask, h);
}`;

const COMP_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
precision highp samplerCube;

out vec4 outColor;
uniform sampler2D   uGlass;
uniform sampler2D   uBg;
uniform samplerCube uEnv;
uniform sampler2D   uSRGB;
uniform vec2        uRes;
uniform vec2        uUvScale;
uniform vec2        uUvOffset;
uniform float       uOn;
uniform float       uLod;
uniform float       uSpec;
uniform float       uFillAlpha;
uniform float       uEnvRot;
uniform float       uEnvIntensity;
uniform float       uHref;
uniform float       uGlassT;
uniform vec3        uFill;
uniform vec3        uLightDir;

const vec3 NW = vec3(1.331, 1.333, 1.344);
const vec3 NG = vec3(1.514, 1.520, 1.528);

vec3 rotY(vec3 p, float a) {
  float c = cos(a), s = sin(a);
  return vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z);
}
float fresnel(float cosI, float n1, float n2) {
  float sinI2 = max(0.0, 1.0 - cosI * cosI);
  float eta = n1 / n2;
  float sinT2 = eta * eta * sinI2;
  if (sinT2 >= 1.0) return 1.0;
  float cosT = sqrt(1.0 - sinT2);
  float rs = (n1 * cosI - n2 * cosT) / (n1 * cosI + n2 * cosT);
  float rp = (n1 * cosT - n2 * cosI) / (n1 * cosT + n2 * cosI);
  return 0.5 * (rs * rs + rp * rp);
}
vec3 encodeSRGB(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return vec3(
    texture(uSRGB, vec2(c.r, 0.5)).r,
    texture(uSRGB, vec2(c.g, 0.5)).r,
    texture(uSRGB, vec2(c.b, 0.5)).r
  );
}

void main() {
  vec2 uv  = gl_FragCoord.xy / uRes;
  vec4 gbuf = texture(uGlass, uv);
  float mask = gbuf.b * uOn;
  if (mask < 0.0025) {
    outColor = vec4(0.0);
    return;
  }

  vec2 tUv = uv * uUvScale + uUvOffset;
  vec2 nxy = gbuf.rg * 2.0 - 1.0;
  vec3 N = vec3(nxy, sqrt(max(1.0 - dot(nxy, nxy), 0.0)));
  float h = gbuf.a;

  vec3 R = 2.0 * N.z * N - vec3(0.0, 0.0, 1.0);
  vec3 env = texture(uEnv, rotY(R, uEnvRot)).rgb * uEnvIntensity;
  vec3 L = rotY(normalize(uLightDir), uEnvRot);

  float aspect = uRes.x / max(uRes.y, 1.0);
  /* 接触线附近压缩了远处背景；用更高 mip 做面积预滤波。 */
  float lod = uLod + (1.0 - N.z) * 3.2;
  vec3 trans = vec3(0.0);
  float tGreen = 0.0;

  for (int c = 0; c < 3; c++) {
    float nw = c == 0 ? NW.r : (c == 1 ? NW.g : NW.b);
    float ng = c == 0 ? NG.r : (c == 1 ? NG.g : NG.b);
    vec3 T = refract(vec3(0.0, 0.0, -1.0), N, 1.0 / nw);
    float tw = h / max(-T.z, 1e-4);
    vec2 dp = T.xy * tw;
    if (uGlassT > 1e-6) {
      vec3 Tg = refract(T, vec3(0.0, 0.0, 1.0), nw / ng);
      float tg = uGlassT / max(-Tg.z, 1e-4);
      dp += Tg.xy * tg * smoothstep(0.0, 0.02 * uHref, h);
    }
    vec2 duv = vec2(dp.x / aspect, dp.y) * uUvScale;
    vec3 smp = textureLod(uBg, tUv + duv, lod).rgb;
    if (c == 0) trans.r = smp.r;
    else if (c == 1) { trans.g = smp.g; tGreen = tw; }
    else trans.b = smp.b;
  }

  float tau = uFillAlpha * (tGreen / max(uHref, 1e-4));
  float Tmed = exp(-tau);
  trans = Tmed * trans + (1.0 - Tmed) * uFill;

  float F = fresnel(clamp(N.z, 0.0, 1.0), 1.0, NW.g);
  float Fgw = 0.0;
  if (uGlassT > 1e-6) {
    vec3 Tq = refract(vec3(0.0, 0.0, -1.0), N, 1.0 / NW.g);
    Fgw = fresnel(clamp(-Tq.z, 0.0, 1.0), NW.g, NG.g);
  }

  float ndl = max(dot(N, L), 0.0);
  float k2 = ndl * ndl;
  float k4 = k2 * k2;
  float k8 = k4 * k4;
  float k16 = k8 * k8;
  float k32 = k16 * k16;
  float k64 = k32 * k32;
  float k128 = k64 * k64;
  float k256 = k128 * k128;

  vec3 col = trans * (1.0 - F) * (1.0 - Fgw) + env * F;
  col += vec3(1.0, 0.95, 0.88) * k256 * uSpec * 12.0;

  outColor = vec4(encodeSRGB(col), mask);
  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  outColor.rgb += (ign - 0.5) * (1.0 / 255.0);
}`;

const DEBUG_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform int uMode;
uniform float uScale;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 s = texture(uTex, uv);
  if (uMode == 0) {
    float v = clamp(s.r * uScale, 0.0, 1.0);
    outColor = vec4(v, v, v, 1.0);
  } else if (uMode == 2) {
    float v = clamp(s.a * uScale, 0.0, 1.0);
    outColor = vec4(v, v, v, 1.0);
  } else {
    outColor = vec4(s.rgb, 1.0);
  }
}`;

const progGeo = linkProgram(GEO_FRAG);
const progComp = linkProgram(COMP_FRAG);
const progDebug = linkProgram(DEBUG_FRAG);

const UG = uniforms(progGeo, ["uBlob[0]", "uBlobCount", "uRes", "uAspect", "uHeight"]);
const UC = uniforms(progComp, [
  "uGlass", "uBg", "uEnv", "uSRGB", "uRes", "uUvScale", "uUvOffset", "uOn",
  "uLod", "uSpec", "uFillAlpha", "uEnvRot", "uEnvIntensity", "uHref",
  "uGlassT", "uFill", "uLightDir",
]);
const UDebug = uniforms(progDebug, ["uTex", "uRes", "uMode", "uScale"]);

/* ================================================================== *
 * 4. HDR 环境
 * ================================================================== */
const ENV_SIZE = 128;
let envTex = null;
let envLight = [0.3, 0.5, 0.8];

function decodeHDRI() {
  if (!window.HDRI_RGBE || !window.HDRI_W || !window.HDRI_H) return null;
  try {
    const bin = atob(window.HDRI_RGBE);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
    const w = window.HDRI_W, h = window.HDRI_H;
    if (bytes.length < w * h * 4) return null;
    const data = new Float32Array(w * h * 3);
    for (let i = 0; i < w * h; i += 1) {
      const e = bytes[i * 4 + 3];
      if (e !== 0) {
        const f = Math.pow(2, e - 136);
        data[i * 3] = bytes[i * 4] * f;
        data[i * 3 + 1] = bytes[i * 4 + 1] * f;
        data[i * 3 + 2] = bytes[i * 4 + 2] * f;
      }
    }
    return { w, h, data };
  } catch (_) {
    return null;
  }
}
function sampleEquirect(data, u, v, w, h) {
  const x = (((u % 1) + 1) % 1) * w - 0.5;
  const y = Math.max(0, Math.min(h - 1, v * h - 0.5));
  const x0 = Math.floor(x), x1 = (x0 + 1 + w) % w;
  const y0 = Math.floor(y), y1 = Math.min(h - 1, y0 + 1);
  const fx = x - Math.floor(x), fy = y - y0;
  const a = (y0 * w + x0) * 3, b = (y0 * w + x1) * 3;
  const c = (y1 * w + x0) * 3, d = (y1 * w + x1) * 3;
  const out = [0, 0, 0];
  for (let k = 0; k < 3; k += 1) {
    const top = data[a + k] * (1 - fx) + data[b + k] * fx;
    const bot = data[c + k] * (1 - fx) + data[d + k] * fx;
    out[k] = top * (1 - fy) + bot * fy;
  }
  return out;
}
function buildEnvironment() {
  const dec = decodeHDRI();
  let hdr, hdrW, hdrH;
  if (dec) {
    hdr = dec.data; hdrW = dec.w; hdrH = dec.h;
    if (Array.isArray(window.HDRI_LIGHT)) envLight = window.HDRI_LIGHT.slice();
  } else {
    hdrW = 256; hdrH = 128;
    hdr = new Float32Array(hdrW * hdrH * 3);
    for (let y = 0; y < hdrH; y += 1) {
      const v = (y + 0.5) / hdrH;
      for (let x = 0; x < hdrW; x += 1) {
        const i = (y * hdrW + x) * 3;
        const sky = Math.max(0, 1 - Math.abs(v - 0.42) * 2.2);
        hdr[i] = 0.08 + sky * 0.7;
        hdr[i + 1] = 0.10 + sky * 0.8;
        hdr[i + 2] = 0.16 + sky * 0.95;
      }
    }
    envLight = [0.3, 0.5, 0.8];
  }

  envTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, envTex);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const face = new Float32Array(ENV_SIZE * ENV_SIZE * 4);
  for (let f = 0; f < 6; f += 1) {
    for (let y = 0; y < ENV_SIZE; y += 1) {
      for (let x = 0; x < ENV_SIZE; x += 1) {
        const u = (2 * (x + 0.5)) / ENV_SIZE - 1;
        const v = (2 * (y + 0.5)) / ENV_SIZE - 1;
        let dx, dy, dz;
        if (f === 0) { dx = 1; dy = -v; dz = -u; }
        else if (f === 1) { dx = -1; dy = -v; dz = u; }
        else if (f === 2) { dx = u; dy = 1; dz = v; }
        else if (f === 3) { dx = u; dy = -1; dz = -v; }
        else if (f === 4) { dx = u; dy = -v; dz = 1; }
        else { dx = -u; dy = -v; dz = -1; }
        const len = Math.hypot(dx, dy, dz) || 1;
        dx /= len; dy /= len; dz /= len;
        const eu = Math.atan2(dz, dx) / TAU + 0.5;
        const ev = Math.acos(Math.max(-1, Math.min(1, dy))) / Math.PI;
        const c = sampleEquirect(hdr, eu, ev, hdrW, hdrH);
        const idx = (y * ENV_SIZE + x) * 4;
        face[idx]     = Math.min(c[0], 60000);
        face[idx + 1] = Math.min(c[1], 60000);
        face[idx + 2] = Math.min(c[2], 60000);
        face[idx + 3] = 1;
      }
    }
    gl.texImage2D(
      gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, gl.RGBA16F, ENV_SIZE, ENV_SIZE, 0,
      gl.RGBA, gl.FLOAT, face,
    );
  }
}

/* ================================================================== *
 * 5. 背景
 * ================================================================== */
let bgTex = null;
let bgAspect = 3 / 2;

function newCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
function addGrain(ctx, w, h, amount) {
  const n = newCanvas(128, 128);
  const nx = n.getContext("2d");
  const id = nx.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 128 + (Math.random() * 2 - 1) * 46;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  nx.putImageData(id, 0, 0);
  ctx.save();
  ctx.globalAlpha = amount;
  ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = ctx.createPattern(n, "repeat");
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}
function hill(ctx, w, h, baseY, amp, freq, phase, color) {
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 4) {
    const y = baseY +
      Math.sin((x / w) * Math.PI * freq + phase) * amp +
      Math.sin((x / w) * Math.PI * freq * 2.7 + phase * 2.1) * amp * 0.34;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function makePhoto(w, h) {
  const c = newCanvas(w, h);
  const x = c.getContext("2d");
  const sky = x.createLinearGradient(0, 0, 0, h * 0.82);
  sky.addColorStop(0.00, "#0a1730");
  sky.addColorStop(0.34, "#22386b");
  sky.addColorStop(0.58, "#6a5a8f");
  sky.addColorStop(0.76, "#c4705c");
  sky.addColorStop(0.90, "#eaa063");
  sky.addColorStop(1.00, "#f6c98a");
  x.fillStyle = sky;
  x.fillRect(0, 0, w, h);
  const sx = w * 0.665, sy = h * 0.615, sr = w * 0.075;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 6.5);
  sg.addColorStop(0.00, "rgba(255,247,215,1)");
  sg.addColorStop(0.10, "rgba(255,226,168,0.95)");
  sg.addColorStop(0.28, "rgba(255,168,104,0.42)");
  sg.addColorStop(0.60, "rgba(224,120,96,0.14)");
  sg.addColorStop(1.00, "rgba(200,100,90,0)");
  x.fillStyle = sg;
  x.fillRect(0, 0, w, h);
  x.fillStyle = "rgba(255,250,225,0.98)";
  x.beginPath(); x.arc(sx, sy, sr, 0, 7); x.fill();
  hill(x, w, h, h * 0.655, h * 0.045, 2.1, 0.6, "#3b2f52");
  hill(x, w, h, h * 0.705, h * 0.055, 1.4, 2.1, "#2a2340");
  hill(x, w, h, h * 0.775, h * 0.040, 3.2, 4.0, "#191527");
  hill(x, w, h, h * 0.865, h * 0.030, 4.6, 1.2, "#0d0b15");
  const water = x.createLinearGradient(0, h * 0.87, 0, h);
  water.addColorStop(0, "rgba(120,90,130,0.10)");
  water.addColorStop(1, "rgba(20,18,34,0.55)");
  x.fillStyle = water;
  x.fillRect(0, h * 0.87, w, h * 0.13);
  addGrain(x, w, h, 0.07);
  return c;
}
function makeChart(w, h) {
  const c = newCanvas(w, h);
  const x = c.getContext("2d");
  x.fillStyle = "#0d1117";
  x.fillRect(0, 0, w, h);
  for (let i = 0; i <= w / 64; i++) {
    x.fillStyle = i % 4 === 0 ? "rgba(120,180,255,.28)" : "rgba(120,180,255,.11)";
    x.fillRect(i * 64, 0, i % 4 === 0 ? 2 : 1, h);
  }
  for (let j = 0; j <= h / 64; j++) {
    x.fillStyle = j % 4 === 0 ? "rgba(120,180,255,.28)" : "rgba(120,180,255,.11)";
    x.fillRect(0, j * 64, w, j % 4 === 0 ? 2 : 1);
  }
  const colors = ["#ff5d5d", "#ffb23f", "#ffe14a", "#5ddc7a", "#4fc3f7", "#9b7bff", "#ff6fd8"];
  for (let i = 0; i < 26; i++) {
    x.globalAlpha = 0.85;
    x.fillStyle = colors[i % colors.length];
    const bw = 40 + Math.random() * 190;
    const bh = 28 + Math.random() * 150;
    x.fillRect(Math.random() * (w - bw), Math.random() * (h - bh), bw, bh);
  }
  x.globalAlpha = 1;
  for (let i = 0; i < 9; i++) {
    x.strokeStyle = colors[i % colors.length];
    x.lineWidth = 2 + (i % 3);
    x.beginPath();
    x.arc(w * (0.12 + i * 0.095), h * (0.18 + (i % 3) * 0.30), 34 + i * 13, 0, Math.PI * 2);
    x.stroke();
  }
  x.fillStyle = "#f2f6ff";
  x.font = "600 92px ui-sans-serif, system-ui, sans-serif";
  x.fillText("LIQUID", w * 0.07, h * 0.80);
  x.font = "600 92px ui-monospace, Consolas, monospace";
  x.fillText("GLASS", w * 0.07, h * 0.90);
  addGrain(x, w, h, 0.05);
  return c;
}

function ensureBgTex() {
  if (bgTex) return;
  bgTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
function uploadImage(img) {
  ensureBgTex();
  bgAspect = img.width / Math.max(1, img.height);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}
function setBackground(kind) {
  const img = kind === "chart" ? makeChart(1920, 1280) : makePhoto(1920, 1280);
  pageBg.src = img.toDataURL("image/jpeg", 0.92);
  uploadImage(img);

/* ================================================================== *
 * 6. 流场 + 引力
 * ================================================================== */
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function flowPsi(x, y, t) {
  const win = smoothstep(0.66, 0.40, Math.abs(x)) * smoothstep(0.52, 0.28, Math.abs(y));
  if (win <= 0) return 0;
  const k1 = 1.55, k2 = 2.15, k3 = 2.85;
  const w1 = TAU / 61, w2 = TAU / 83, w3 = TAU / 47;
  const m1 = Math.sin(k1 * x + w1 * t + 0.7) * Math.cos(k1 * y + 0.3);
  const m2 = Math.cos(k2 * x - 0.4) * Math.sin(k2 * y + w2 * t + 1.1);
  const m3 = Math.sin(k3 * (x + y) + w3 * t + 2.0) * Math.cos(k3 * (x - y) - 0.8);
  return win * (0.70 * m1 + 0.45 * m2 + 0.25 * m3);
}
function flowAt(x, y, t) {
  const e = 1e-3;
  const ux = (flowPsi(x, y + e, t) - flowPsi(x, y - e, t)) / (2 * e);
  const uy = -(flowPsi(x + e, y, t) - flowPsi(x - e, y, t)) / (2 * e);
  return [ux * state.flow, uy * state.flow];
}
function gravityAt(x, y) {
  /* 每个团块只被最近的引力点吸引；否则多个点会一起把液体拖成一个大团。 */
  let best = null, bd = Infinity;
  for (const g of gravityPoints) {
    const d = (g.x - x) ** 2 + (g.y - y) ** 2;
    if (d < bd) { bd = d; best = g; }
  }
  if (!best) return [0, 0];
  const R = Math.max(0.03, state.gravityR);
  const dx = best.x - x;
  const dy = best.y - y;
  const r = Math.hypot(dx, dy) + 1e-6;
  const rn = r / R;
  /* 高斯导数核：r=0 时为零，r≈R 时最强，然后衰减。 */
  const pull = state.gravity * best.w * rn * Math.exp(-0.5 * rn * rn);
  return [(dx / r) * pull, (dy / r) * pull];
}

/* ================================================================== *
 * 7. top-k 引力点：对当前团块做加权 k-means
 * ================================================================== */
function updateGravityPoints() {
  const k = Math.max(1, Math.min(BLOB_MAX, Math.round(state.k)));
  if (blobs.length === 0) {
    gravityPoints = [];
    return;
  }
  const totalM = blobs.reduce((s, b) => s + b.m, 0) || 1;
  const centers = [];
  const n = Math.min(k, blobs.length);
  if (gravityPoints.length >= n) {
    for (let i = 0; i < n; i += 1) centers.push({ x: gravityPoints[i].x, y: gravityPoints[i].y, w: 1 });
  } else {
    const sorted = blobs.slice().sort((a, b) => b.m - a.m);
    for (let i = 0; i < n; i += 1) {
      centers.push({ x: sorted[i].x, y: sorted[i].y, w: 1 });
    }
  }
  for (let iter = 0; iter < 5; iter += 1) {
    const sx = new Float64Array(centers.length);
    const sy = new Float64Array(centers.length);
    const sw = new Float64Array(centers.length);
    for (const b of blobs) {
      let bi = 0, bd = 1e9;
      for (let i = 0; i < centers.length; i += 1) {
        const d = (b.x - centers[i].x) ** 2 + (b.y - centers[i].y) ** 2;
        if (d < bd) { bd = d; bi = i; }
      }
      sx[bi] += b.x * b.m;
      sy[bi] += b.y * b.m;
      sw[bi] += b.m;
    }
    for (let i = 0; i < centers.length; i += 1) {
      if (sw[i] > 1e-6) {
        centers[i].x = sx[i] / sw[i];
        centers[i].y = sy[i] / sw[i];
        centers[i].w = Math.max(0.25, Math.min(1.5, (sw[i] / totalM) * centers.length));
      }
    }
  }
  gravityPoints = centers;
}

/* ================================================================== *
 * 8. 团块演化：平流、合并、应变分裂
 * ================================================================== */
function updateBlobs(dt) {
  const aspect = Math.max(1e-3, cssW / Math.max(1, cssH));
  const xLim = aspect * 0.38;
  const yLim = 0.36;

  for (const b of blobs) {
    const u = flowAt(b.x, b.y, flowTime);
    const g = gravityAt(b.x, b.y);
    b.x += (u[0] + g[0]) * dt;
    b.y += (u[1] + g[1]) * dt;
    b.x = Math.max(-xLim, Math.min(xLim, b.x));
    b.y = Math.max(-yLim, Math.min(yLim, b.y));
    b.cool = Math.max(0, (b.cool || 0) - dt);
  }

  /* 短程排斥：让团块保持独立，不会因为引力全部并成一个大水团。
     这是很便宜的“分离压”，不参与光学。 */
  for (let i = 0; i < blobs.length; i += 1) {
    for (let j = i + 1; j < blobs.length; j += 1) {
      const a = blobs[i], b = blobs[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.hypot(dx, dy) + 1e-6;
      const minD = (a.r + b.r) * 3.0;
      if (d >= minD) continue;
      const f = ((minD - d) / minD) * 0.9 * dt;
      const nx = dx / d, ny = dy / d;
      a.x += nx * f * 0.5;
      a.y += ny * f * 0.5;
      b.x -= nx * f * 0.5;
      b.y -= ny * f * 0.5;
    }
  }

  /* 合并：距离足够近时质量、面积相加；总质量守恒。 */
  for (let i = 0; i < blobs.length; i += 1) {
    for (let j = i + 1; j < blobs.length; j += 1) {
      const a = blobs[i], b = blobs[j];
      if ((a.cool || 0) > 0.2 || (b.cool || 0) > 0.2) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < (a.r + b.r) * 0.55) {
        const m = a.m + b.m;
        a.x = (a.x * a.m + b.x * b.m) / m;
        a.y = (a.y * a.m + b.y * b.m) / m;
        a.m = m;
        a.r = Math.sqrt(a.r * a.r + b.r * b.r);
        blobs.splice(j, 1);
        j -= 1;
      }
    }
  }

  /* 分裂：局部速度梯度大时，把团块沿拉伸方向拉成两个。 */
  for (let i = 0; i < blobs.length && blobs.length < 8; i += 1) {
    const b = blobs[i];
    if (b.r < 0.030 || (b.cool || 0) > 0) continue;
    const r = b.r;
    const uR = flowAt(b.x + r, b.y, flowTime);
    const uL = flowAt(b.x - r, b.y, flowTime);
    const uU = flowAt(b.x, b.y + r, flowTime);
    const uD = flowAt(b.x, b.y - r, flowTime);
    const gR = gravityAt(b.x + r, b.y);
    const gL = gravityAt(b.x - r, b.y);
    const gU = gravityAt(b.x, b.y + r);
    const gD = gravityAt(b.x, b.y - r);
    const vx = (uR[0] + gR[0]) - (uL[0] + gL[0]);
    const vy = (uU[1] + gU[1]) - (uD[1] + gD[1]);
    const strain = Math.hypot(vx, vy) / (2 * r);
    if (strain < 2.2) continue;
    const len = Math.hypot(vx, vy) || 1;
    const nx = vx / len, ny = vy / len;
    const m2 = b.m * 0.5;
    const r2 = b.r / Math.SQRT2;
    const cx = b.x, cy = b.y;
    const off = r * 0.95;
    b.m = m2; b.r = r2;
    b.x = cx + nx * off;
    b.y = cy + ny * off;
    b.cool = 1.2;
    blobs.push({
      x: cx - nx * off,
      y: cy - ny * off,
      r: r2,
      m: m2,
      cool: 1.2,
    });
  }

  const total = blobs.reduce((s, b) => s + b.m, 0) || 1;
  for (const b of blobs) b.m /= total;
  updateGravityPoints();
}

/* ================================================================== *
 * 9. 初始团块
 * ================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeBlobs() {
  const rng = mulberry32(resetSeed);
  const aspect = Math.max(1e-3, cssW / Math.max(1, cssH));
  const n = 6 + Math.floor(rng() * 2);
  const scale = Math.sqrt(state.amount / 0.14);
  const list = [];
  let guard = 0;
  while (list.length < n && guard < 500) {
    guard += 1;
    const x = (rng() * 2 - 1) * aspect * 0.34;
    const y = (rng() * 2 - 1) * 0.30;
    const r = (0.026 + rng() * 0.026) * scale;
    let ok = true;
    for (const b of list) {
      if (Math.hypot(b.x - x, b.y - y) < (b.r + r) * 2.2) { ok = false; break; }
    }
    if (!ok) continue;
    list.push({ x, y, r, m: r * r, cool: 0 });
  }
  if (list.length === 0) list.push({ x: 0, y: 0, r: 0.07 * scale, m: 1, cool: 0 });
  const total = list.reduce((s, b) => s + b.m, 0) || 1;
  for (const b of list) b.m /= total;
  return list;
}

function resetScene() {
  resetSeed = fixedSeed !== null ? fixedSeed : ((Math.random() * 1e9) | 0);
  blobs = makeBlobs();
  gravityPoints = [];
  flowTime = 0;
  updateGravityPoints();
}

/* ================================================================== *
 * 10. 液面 pass / 合成
 * ================================================================== */
let cssW = 1, cssH = 1;
let GLASS_W = 2, GLASS_H = 2;
let glassBuf = null;
let outW = 2, outH = 2;
let dprLevel = 3;
let dpr = MAX_DPR_LEVELS[dprLevel];
const blobData = new Float32Array(BLOB_MAX * 4);

function allocGlass() {
  disposeTarget(glassBuf);
  GLASS_W = Math.max(64, Math.round(cssW * GLASS_SCALE));
  GLASS_H = Math.max(48, Math.round(cssH * GLASS_SCALE));
  glassBuf = makeTarget(GLASS_W, GLASS_H, FIELD_FMT, FIELD_TYPE, gl.LINEAR, gl.LINEAR);
  if (!glassBuf) fail("无法创建液面渲染目标");
}

function geoPass() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, glassBuf.fbo);
  gl.viewport(0, 0, GLASS_W, GLASS_H);
  gl.useProgram(progGeo);
  const n = Math.min(BLOB_MAX, blobs.length);
  for (let i = 0; i < BLOB_MAX; i += 1) {
    const b = blobs[i];
    blobData[i * 4] = b ? b.x : 0;
    blobData[i * 4 + 1] = b ? b.y : 0;
    blobData[i * 4 + 2] = b ? b.r : 0;
    blobData[i * 4 + 3] = b ? b.m : 0;
  }
  gl.uniform4fv(UG["uBlob[0]"], blobData);
  gl.uniform1i(UG.uBlobCount, n);
  gl.uniform2f(UG.uRes, GLASS_W, GLASS_H);
  gl.uniform1f(UG.uAspect, GLASS_W / Math.max(1, GLASS_H));
  gl.uniform1f(UG.uHeight, state.height);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function uvRect() {
  const view = outW / Math.max(1, outH);
  let sx = 1, sy = 1, ox = 0, oy = 0;
  if (bgAspect > view) {
    sx = view / bgAspect;
    ox = (1 - sx) * 0.5;
  } else {
    sy = bgAspect / view;
    oy = (1 - sy) * 0.5;
  }
  return [sx, sy, ox, oy];
}

function fillPalette() {
  const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return fillLight ? [1, 1, 1] : [lin(0.12), lin(0.12), lin(0.12)];
}

function composite() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, outW, outH);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (off) return;

  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, glassBuf.tex);
  gl.uniform1i(UC.uGlass, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.uniform1i(UC.uBg, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, envTex);
  gl.uniform1i(UC.uEnv, 2);
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, srgbTex);
  gl.uniform1i(UC.uSRGB, 3);

  const [sx, sy, ox, oy] = uvRect();
  gl.uniform2f(UC.uRes, outW, outH);
  gl.uniform2f(UC.uUvScale, sx, sy);
  gl.uniform2f(UC.uUvOffset, ox, oy);
  gl.uniform1f(UC.uOn, 1);
  gl.uniform1f(UC.uLod, state.lod);
  gl.uniform1f(UC.uSpec, state.spec);
  gl.uniform1f(UC.uFillAlpha, state.density);
  gl.uniform1f(UC.uEnvRot, (state.envRot * Math.PI) / 180);
  gl.uniform1f(UC.uEnvIntensity, state.env);
  gl.uniform1f(UC.uHref, Math.max(0.04, state.height * 0.7));
  gl.uniform1f(UC.uGlassT, state.glass / WORLD_MM);
  gl.uniform3fv(UC.uFill, fillPalette());
  gl.uniform3fv(UC.uLightDir, envLight);
  drawQuad();
}

function drawDebug() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, outW, outH);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(progDebug);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, glassBuf.tex);
  gl.uniform1i(UDebug.uTex, 0);
  gl.uniform2f(UDebug.uRes, outW, outH);
  if (debugMode === "h") {
    gl.uniform1i(UDebug.uMode, 2);
    gl.uniform1f(UDebug.uScale, 5);
  } else {
    gl.uniform1i(UDebug.uMode, 1);
    gl.uniform1f(UDebug.uScale, 1);
  }
  drawQuad();
}

/* ================================================================== *
 * 11. 尺寸 / 自适应
 * ================================================================== */
function resizeOutput() {
  const w = Math.max(2, Math.round(cssW * dpr));
  const h = Math.max(2, Math.round(cssH * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  outW = w; outH = h;
  elRes.textContent = "输出 " + w + "×" + h + " · DPR " + dpr.toFixed(2);
}

function resizeLayout() {
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  flowCanvas.width = Math.max(2, Math.round(cssW));
  flowCanvas.height = Math.max(2, Math.round(cssH));
  dprLevel = Math.min(MAX_DPR_LEVELS.length - 1, Math.max(0, dprLevel));
  dpr = MAX_DPR_LEVELS[dprLevel];
  resizeOutput();
  allocGlass();
  resetScene();
}

/* ================================================================== *
 * 12. 循环
 * ================================================================== */
let last = performance.now();
let acc = 0, frames = 0, fps = 0, frameMs = 0;
let lastAdjust = 0;
let justDown = false;
let gpuMs = 6.0;
const BUDGET_HI = 8.0, BUDGET_LO = 4.8;
const timerExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");
let gpuQuery = null;
const gpuPending = [];

const elFps = document.getElementById("fps");
const elMs = document.getElementById("ms");
const elGpu = document.getElementById("gpu");
const elRes = document.getElementById("res");
const elBlobs = document.getElementById("blobs");
const elGrav = document.getElementById("grav");
const elMass = document.getElementById("mass");

function drawFlowOverlay() {
  const w = flowCanvas.width, h = flowCanvas.height;
  fctx.clearRect(0, 0, w, h);
  if (!showFlow) return;
  fctx.strokeStyle = "rgba(150,195,255,0.30)";
  fctx.fillStyle = "rgba(150,195,255,0.30)";
  fctx.lineWidth = 1;
  const cols = 16, rows = 10;
  for (let j = 0; j < rows; j += 1) {
    for (let i = 0; i < cols; i += 1) {
      const px = ((i + 0.5) / cols - 0.5) * (w / h);
      const py = 0.5 - (j + 0.5) / rows;
      const u = flowAt(px, py, flowTime);
      const g = gravityAt(px, py);
      const sx = w * 0.5 + px * h;
      const sy = h * 0.5 - py * h;
      const scale = h * 1.1;
      const ex = sx + (u[0] + g[0]) * scale;
      const ey = sy - (u[1] + g[1]) * scale;
      fctx.beginPath(); fctx.moveTo(sx, sy); fctx.lineTo(ex, ey); fctx.stroke();
      const a = Math.atan2(ey - sy, ex - sx);
      fctx.beginPath();
      fctx.moveTo(ex, ey);
      fctx.lineTo(ex - 4 * Math.cos(a - 0.5), ey - 4 * Math.sin(a - 0.5));
      fctx.lineTo(ex - 4 * Math.cos(a + 0.5), ey - 4 * Math.sin(a + 0.5));
      fctx.closePath(); fctx.fill();
    }
  }
  for (const g of gravityPoints) {
    const sx = w * 0.5 + g.x * h;
    const sy = h * 0.5 - g.y * h;
    const r = 5 + g.w * 8;
    fctx.strokeStyle = "rgba(255,190,120,0.9)";
    fctx.lineWidth = 1.5;
    fctx.beginPath(); fctx.arc(sx, sy, r, 0, TAU); fctx.stroke();
    fctx.fillStyle = "rgba(255,220,170,0.9)";
    fctx.beginPath(); fctx.arc(sx, sy, 2, 0, TAU); fctx.fill();
  }
  fctx.fillStyle = "rgba(150,220,255,0.45)";
  for (const b of blobs) {
    const sx = w * 0.5 + b.x * h;
    const sy = h * 0.5 - b.y * h;
    fctx.beginPath(); fctx.arc(sx, sy, 1.6, 0, TAU); fctx.fill();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = Math.min((now - last) / 1000, 0.05);
  const dt = rawDt * state.speed;
  last = now;

  if (timerExt && !gpuQuery) {
    gpuQuery = gl.createQuery();
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, gpuQuery);
  }

  if (!paused) {
    flowTime += dt;
    updateBlobs(Math.min(dt, 0.033));
  }
  geoPass();
  if (debugMode) drawDebug(); else composite();
  drawFlowOverlay();

  if (timerExt && gpuQuery) {
    gl.endQuery(timerExt.TIME_ELAPSED_EXT);
    gpuPending.push(gpuQuery);
    gpuQuery = null;
  }
  if (timerExt) {
    while (gpuPending.length) {
      const q = gpuPending[0];
      if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break;
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
        const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);
        gpuMs = gpuMs * 0.88 + (ns / 1e6) * 0.12;
      }
      gl.deleteQuery(q);
      gpuPending.shift();
    }
    while (gpuPending.length > 8) gl.deleteQuery(gpuPending.shift());
  } else {
    gpuMs = gpuMs * 0.92 + Math.min(rawDt * 1000, 33) * 0.08;
  }

  const budgetHi = timerExt ? BUDGET_HI : 19.0;
  const budgetLo = timerExt ? BUDGET_LO : 17.4;
  if (now - lastAdjust > (justDown ? 1600 : 5000) && now > 2500 && !document.hidden) {
    if (gpuMs > budgetHi && dprLevel > 0) {
      dprLevel -= 1; dpr = MAX_DPR_LEVELS[dprLevel]; resizeOutput();
      lastAdjust = now; justDown = true;
    } else if (gpuMs < budgetLo && dprLevel < MAX_DPR_LEVELS.length - 1) {
      dprLevel += 1; dpr = MAX_DPR_LEVELS[dprLevel]; resizeOutput();
      lastAdjust = now; justDown = false;
    }
  }

  acc += rawDt; frames += 1;
  if (acc >= 0.5) {
    fps = frames / acc;
    frameMs = (acc / frames) * 1000;
    elFps.textContent = fps.toFixed(0);
    elMs.textContent = frameMs.toFixed(1);
    elGpu.textContent = gpuMs.toFixed(1);
    elBlobs.textContent = String(blobs.length);
    elGrav.textContent = String(gravityPoints.length);
    const total = blobs.reduce((s, b) => s + b.m, 0);
    elMass.textContent = total.toFixed(2);
    acc = 0; frames = 0;
  }
}

/* ================================================================== *
 * 13. UI
 * ================================================================== */
const slidersEl = document.getElementById("sliders");
const inputs = {};
for (const [key, label, min, max, step, desc] of SLIDERS) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("label");
  const name = document.createElement("span");
  const val = document.createElement("span");
  name.textContent = label;
  lab.append(name, val);
  const input = document.createElement("input");
  input.type = "range";
  input.min = min; input.max = max; input.step = step;
  input.value = state[key];
  input.title = desc || "";
  const show = () => {
    const v = Number(input.value);
    if (key === "k" || key === "envRot") { val.textContent = v.toFixed(0); return; }
    const dp = step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    val.textContent = v.toFixed(dp);
  };
  input.addEventListener("input", () => {
    state[key] = Number(input.value);
    if (key === "k") state.k = Math.round(state.k);
    show();
  });
  input.addEventListener("change", () => {
    if (key === "amount") resetScene();
  });
  show();
  row.append(lab, input);
  if (desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = desc;
    row.append(d);
  }
  slidersEl.append(row);
  inputs[key] = { input, show };
}
function syncInputs() {
  for (const [key] of SLIDERS) {
    inputs[key].input.value = state[key];
    inputs[key].show();
  }
}

const panelEl = document.getElementById("panel");
const toggleEl = document.getElementById("toggle");
function setCollapsed(v) {
  panelEl.classList.toggle("collapsed", v);
  toggleEl.textContent = v ? "展开" : "收起";
  try { localStorage.setItem("lg.panel4", v ? "1" : "0"); } catch (_) {}
}
toggleEl.addEventListener("click", () => setCollapsed(!panelEl.classList.contains("collapsed")));
try {
  if (localStorage.getItem("lg.panel4") !== "0") setCollapsed(true);
} catch (_) {
  setCollapsed(true);
}
window.addEventListener("keydown", (e) => {
  if (e.code === "KeyH") setCollapsed(!panelEl.classList.contains("collapsed"));
  if (e.code === "Escape") setCollapsed(true);
});

const btnPause = document.getElementById("btnPause");
btnPause.addEventListener("click", () => {
  paused = !paused;
  btnPause.classList.toggle("on", paused);
  btnPause.textContent = paused ? "继续" : "暂停";
});
const btnCompare = document.getElementById("btnCompare");
btnCompare.addEventListener("pointerdown", () => { off = true; btnCompare.classList.add("on"); });
btnCompare.addEventListener("pointerup", () => { off = false; btnCompare.classList.remove("on"); });
btnCompare.addEventListener("pointerleave", () => { off = false; btnCompare.classList.remove("on"); });
document.getElementById("btnReset").addEventListener("click", () => resetScene());

const btnFill = document.getElementById("btnFill");
btnFill.addEventListener("click", () => {
  fillLight = !fillLight;
  btnFill.textContent = fillLight ? "底色：亮" : "底色：暗";
});
const btnFlow = document.getElementById("btnFlow");
btnFlow.addEventListener("click", () => {
  showFlow = !showFlow;
  flowCanvas.style.display = showFlow ? "block" : "none";
  btnFlow.classList.toggle("on", showFlow);
});
const btnPhoto = document.getElementById("btnPhoto");
const btnChart = document.getElementById("btnChart");
btnPhoto.addEventListener("click", () => {
  setBackground("photo");
  btnPhoto.classList.add("on"); btnChart.classList.remove("on");
});
btnChart.addEventListener("click", () => {
  setBackground("chart");
  btnChart.classList.add("on"); btnPhoto.classList.remove("on");
});
document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
});
function loadFile(file) {
  if (!file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  pageBg.src = url;
  const img = new Image();
  img.onload = () => {
    uploadImage(img);
    btnPhoto.classList.remove("on");
    btnChart.classList.remove("on");
  };
  img.src = url;
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); off = true; }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") { e.preventDefault(); off = false; }
});
const dropEl = document.getElementById("drop");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  e.preventDefault(); dragDepth++; dropEl.classList.add("show");
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("dragleave", (e) => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("show"); }
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0; dropEl.classList.remove("show");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});
window.addEventListener("resize", () => {
  clearTimeout(window.__lgResizeTimer);
  window.__lgResizeTimer = setTimeout(resizeLayout, 180);
});

/* ================================================================== *
 * 14. 启动 / hash
 * ================================================================== */
const hash = location.hash.slice(1);
const hashParts = hash.split("&").filter(Boolean);
const hashMap = {};
for (const kv of hashParts) {
  const [k, v] = kv.split("=");
  if (!k) continue;
  hashMap[k] = v === undefined ? true : v;
}
for (const k of Object.keys(state)) {
  if (hashMap[k] !== undefined && typeof state[k] === "number") {
    const n = parseFloat(hashMap[k]);
    if (isFinite(n)) state[k] = n;
  }
}
if (hashMap.clean) document.body.classList.add("clean");
if (hashMap.debug) debugMode = String(hashMap.debug);
if (hashMap.seed !== undefined) {
  const s = parseInt(hashMap.seed, 10);
  if (isFinite(s)) fixedSeed = s;
}
state.k = Math.max(1, Math.min(5, Math.round(state.k)));

setBackground(hashMap.chart ? "chart" : "photo");
if (hashMap.chart) {
  btnChart.classList.add("on");
  btnPhoto.classList.remove("on");
}
syncInputs();
buildEnvironment();

cssW = Math.max(1, window.innerWidth);
cssH = Math.max(1, window.innerHeight);
flowCanvas.width = Math.max(2, Math.round(cssW));
flowCanvas.height = Math.max(2, Math.round(cssH));
resizeOutput();
allocGlass();
resetScene();

window.__lg = {
  state,
  reset: resetScene,
  step: (n) => {
    for (let i = 0; i < n; i += 1) {
      flowTime += 1 / 60;
      updateBlobs(1 / 60);
    }
  },
  render: () => { geoPass(); if (debugMode) drawDebug(); else composite(); drawFlowOverlay(); },
  info: () => ({
    blobs: blobs.length,
    gravity: gravityPoints.length,
    mass: blobs.reduce((s, b) => s + b.m, 0),
    points: gravityPoints.map((g) => ({ x: g.x, y: g.y, w: g.w })),
    radii: blobs.map((b) => b.r),
  }),
  gl,
};

if (hashMap.still) {
  const steps = Math.max(1, Math.min(1200, parseInt(hashMap.steps || "180", 10) || 180));
  window.__lg.step(steps);
  window.__lg.render();
  const info = window.__lg.info();
  document.title = "STILL blobs=" + info.blobs +
    " grav=" + info.gravity +
    " mass=" + info.mass.toFixed(3) +
    " rmax=" + Math.max(...info.radii).toFixed(3) +
    " glass=" + GLASS_W + "x" + GLASS_H;
  const stillLoop = () => {
    geoPass();
    if (debugMode) drawDebug(); else composite();
    drawFlowOverlay();
    requestAnimationFrame(stillLoop);
  };
  requestAnimationFrame(stillLoop);
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
