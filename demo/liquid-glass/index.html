<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>液态玻璃 · 水珠演示</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #hud {
    position: fixed; top: 12px; right: 14px;
    font: 500 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #cfe3ff; text-shadow: 0 1px 3px #000a;
    text-align: right; pointer-events: none; user-select: none;
  }
  #hud b { font-weight: 700; color: #fff; }

  #panel {
    position: fixed; top: 12px; left: 12px; width: 268px;
    max-height: calc(100vh - 24px);
    display: flex; flex-direction: column;
    padding: 12px 14px 14px;
    border-radius: 14px;
    background: rgba(14, 18, 24, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px) saturate(140%);
    font: 400 12px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #dfe7f2; user-select: none;
  }
  #panel.collapsed { width: auto; padding: 8px 12px; }
  #panel.collapsed .body { display: none; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head h1 { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .02em; }
  #toggle {
    all: unset; cursor: pointer; padding: 2px 7px; border-radius: 7px;
    font-size: 11px; color: #9fb3cc; background: rgba(255,255,255,.07);
  }
  #toggle:hover { background: rgba(255,255,255,.13); color: #dbe7f7; }

  .body { margin-top: 10px; display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  #sliders { overflow-y: auto; min-height: 0; padding-right: 4px; }
  #sliders::-webkit-scrollbar { width: 6px; }
  #sliders::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
  .row { margin: 9px 0; }
  .row label { display: flex; justify-content: space-between; gap: 8px; color: #a8b8cc; font-size: 11px; }
  .row label span:last-child { color: #e8f1ff; font-variant-numeric: tabular-nums; }
  .desc { margin-top: 1px; font-size: 10px; line-height: 1.35; color: #8395ab; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
    background: transparent; margin: 2px 0 0; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: rgba(255,255,255,.16);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px;
    border-radius: 50%; background: #e9f2ff; box-shadow: 0 0 0 1px #0006, 0 2px 6px #0007;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .btns button, .btns label {
    all: unset; cursor: pointer; padding: 5px 9px; border-radius: 8px;
    font-size: 11px; color: #cfe0f5; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.08);
  }
  .btns button:hover, .btns label:hover { background: rgba(255,255,255,.15); }
  .btns button.on { background: rgba(120,180,255,.28); border-color: rgba(150,200,255,.35); color: #fff; }
  input[type=file] { display: none; }
  .hint { margin-top: 10px; color: #7f90a6; font-size: 10.5px; line-height: 1.5; }
  kbd { font: inherit; padding: 0 4px; border-radius: 4px; background: rgba(255,255,255,.1); }

  #drop {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(8, 12, 18, .72); z-index: 20;
    font: 600 18px ui-sans-serif, system-ui, sans-serif; color: #dbe9ff;
    border: 3px dashed rgba(140, 190, 255, .5); border-radius: 10px;
  }
  #drop.show { display: grid; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div><b id="fps">–</b> fps · <span id="ms">–</span> ms</div>
  <div style="opacity:.65"><span id="res">–</span> · <span id="nblob">–</span> 滴</div>
  <div style="opacity:.45">GPU <span id="gpu">–</span> ms</div>
</div>

<div id="panel">
  <div class="head">
    <h1>液态玻璃 · 水珠</h1>
    <button id="toggle">收起</button>
  </div>
  <div class="body">
    <div id="sliders"></div>
    <div class="btns">
      <button id="btnPause">暂停</button>
      <button id="btnCompare">对比原图</button>
      <button id="btnReset">重置</button>
      <button id="btnFill">底色：暗</button>
    </div>
    <div class="btns">
      <button id="btnPhoto" class="on">风景</button>
      <button id="btnChart">测试图</button>
      <label for="file">上传照片…</label>
      <input id="file" type="file" accept="image/*" />
    </div>
    <div class="hint">
      按住 <kbd>空格</kbd> 看原图 · <kbd>H</kbd> 收起面板 · 图片可直接拖进窗口
    </div>
  </div>
</div>

<div id="drop">松手载入图片</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * 状态
 * ------------------------------------------------------------------ */
const DEFAULTS = {
  num: 5,
  merge: 0.08,
  contact: 80,
  ior: 1.333,
  disp: 0.01,
  lod: 0.15,
  radius: 0.155,
  spec: 1.0,
  fill: 0.30,
  env: 0.35,
  shadow: 0.14,
  speed: 0.35,
};

const SLIDERS = [
  ["num",     "液滴数量", 2,    9,    1,     "同时存在几滴"],
  ["merge",   "融合",     0,    0.20, 0.005, "平滑并集的宽度；0 = 硬边相交，越大脖子越粗"],
  ["contact", "接触角",   50,   90,   1,     "球冠在接触线处的角度；80° 是珠子，60° 更摊"],
  ["ior",     "折射率",   1.30, 1.40, 0.001, "水 1.333；越大透镜越强"],
  ["disp",    "色散",     0,    0.05, 0.001, "红蓝折射率差；水的实际相对差约 1%"],
  ["lod",     "模糊",    -2,    3,    0.1,   "0 = 清透，往上加磨砂"],
  ["radius",  "尺寸",     0.06, 0.20, 0.002, "每一滴的半径"],
  ["spec",    "高光",     0,    2.5,  0.02,  "曲面把光聚成的小点"],
  ["fill",    "底色",     0,    1,    0.01,  "Fluent 中性面颜色混入液滴本体的比例；0 = 全透"],
  ["env",     "环境反射", 0,    1,    0.01,  "低频环境色混入反射的比例；只取颜色，不取细节"],
  ["shadow",  "投影",     0,    0.5,  0.01,  "液滴落在壁纸上的接触阴影"],
  ["speed",   "速度",     0,    3,    0.02,  "整体漂移速度"],
];

const state = Object.assign({}, DEFAULTS);
let off = false;          // 对比原图
let fillLight = false;    // 底色：暗 / 亮

let paused = false;

/* ------------------------------------------------------------------ *
 * WebGL
 * ------------------------------------------------------------------ */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", {
  alpha: false,
  antialias: false,
  depth: false,
  stencil: false,
  premultipliedAlpha: false,
  preserveDrawingBuffer: false,
  powerPreference: "high-performance",
});

if (!gl) {
  document.body.innerHTML =
    '<div style="padding:40px;font:16px system-ui;color:#dde">这个浏览器/机器没有 WebGL2，跑不了。</div>';
  throw new Error("no webgl2");
}

const VERT = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;



// ---- 几何（低分辨率）------------------------------------------------
// 距离场 → 球冠高度场。u=1 顶点、u=0 接触线，斜率在接触线正好 tanθ。
const FIELD_FRAG = `#version 300 es
precision highp float;

out vec4 outColor;

uniform vec2  uRes;
uniform int   uNum;
uniform float uMerge;
uniform float uRadius;
uniform float uSinCA;
uniform float uCosCA;
uniform vec2  uPos[9];

float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}

float sdSeg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  return length(pa - ba * h);
}

float capFromU(float u) {
  float q = 1.0 - clamp(u, 0.0, 1.0);
  float s = uSinCA;
  return (sqrt(max(1.0 - q * q * s * s, 0.0)) - uCosCA) / (1.0 - uCosCA);
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  float d = 1e9;

  for (int i = 0; i < 9; i++) {
    if (i >= uNum) break;
    float di = length(p - uPos[i]) - uRadius;
    d = smin(d, di, uMerge);
  }

  // 液丝：两滴快要分开时先拉出一根细颈。
  // 它同时也进入高度场，所以颈是低矮的液体桥，不是一张平的膜。
  for (int i = 0; i < 9; i++) {
    if (i >= uNum) break;
    for (int j = i + 1; j < 9; j++) {
      if (j >= uNum) break;
      float dist = length(uPos[j] - uPos[i]);
      float w = 1.0 - smoothstep(2.0 * uRadius, 2.7 * uRadius, dist);
      if (w > 0.002) {
        float ds = sdSeg(p, uPos[i], uPos[j]);
        d = min(d, ds - uRadius * 0.12 * w);
      }
    }
  }

  float u = clamp(-d / uRadius, 0.0, 1.0);
  outColor = vec4(d, capFromU(u), 0.0, 1.0);
}`;

// ---- 法线（低分辨率）------------------------------------------------
// 对高度场做中心差分；p 的单位是屏高，梯度乘绝对冠高 uHeight。
const GEO_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;

out vec4 outColor;

uniform sampler2D uD;
uniform vec2      uRes;
uniform float     uHeight;

void main() {
  vec2  uv = gl_FragCoord.xy / uRes;
  vec2  tx = 1.0 / uRes;

  vec4  s  = texture(uD, uv);
  float d  = s.r;
  float h  = s.g;
  float hx = texture(uD, uv + vec2(tx.x, 0.0)).g - texture(uD, uv - vec2(tx.x, 0.0)).g;
  float hy = texture(uD, uv + vec2(0.0, tx.y)).g - texture(uD, uv - vec2(0.0, tx.y)).g;

  vec2  g  = vec2(hx, hy) * uRes.y * 0.5 * uHeight;
  vec3  N  = normalize(vec3(-g, 1.0));

  outColor = vec4(N.xy * 0.5 + 0.5, clamp(d / 0.25, -1.0, 1.0) * 0.5 + 0.5, h);
}`;

// ---- 合成（全分辨率）------------------------------------------------
// 液滴是一块凸透镜：视线在表面折射后打到 z=0 的壁纸，
// 采样 Q = P + d1·h/(-d1.z)。接触线 h=0，位移自然归零。
const COMP_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;

out vec4 outColor;

uniform sampler2D uGlass;
uniform sampler2D uBg;
uniform vec2      uRes;
uniform vec2      uUvScale;
uniform vec2      uUvOffset;
uniform float     uShadow;
uniform float     uOn;
uniform float     uLod;
uniform float     uSpec;
uniform float     uFillAlpha;
uniform float     uEnvMix;
uniform float     uPhase;
uniform float     uIOR;
uniform float     uDisp;
uniform float     uHeight;
uniform vec3      uFill;
uniform vec3      uEnvTop;
uniform vec3      uEnvBottom;
uniform vec3      uEnvAvg;

void main() {
  vec2 uv  = gl_FragCoord.xy / uRes;
  vec2 tUv = uv * uUvScale + uUvOffset;

  vec4  gbuf = texture(uGlass, uv);
  vec2  nxy  = gbuf.rg * 2.0 - 1.0;
  float d    = (gbuf.b * 2.0 - 1.0) * 0.25;
  float hn   = gbuf.a;
  vec3  N    = vec3(nxy, sqrt(max(1.0 - dot(nxy, nxy), 0.0)));

  float aa   = 1.5 / uRes.y;
  float mask = (1.0 - smoothstep(-aa, aa, d)) * uOn;

  vec3 bg = textureLod(uBg, tUv, 0.0).rgb;

  const float ELEV = 0.72;
  vec3 L = normalize(vec3(cos(uPhase * 0.09) * 0.69,
                          sin(uPhase * 0.09) * 0.69,
                          ELEV));

  // 接触阴影：用高度场，落在光的反方向；水珠的阴影是中性灰。
  if (uShadow > 0.001 && mask < 0.999) {
    vec2  suv = uv - L.xy * 0.012;
    float hs  = texture(uGlass, suv).a;
    float sh  = smoothstep(0.0, 0.45, hs) * (1.0 - mask);
    bg *= exp(-vec3(0.55, 0.55, 0.60) * sh * uShadow * 1.8);
  }

  if (mask > 0.001) {
    // ---- 透镜成像 ----------------------------------------------------
    vec3  I      = vec3(0.0, 0.0, -1.0);
    vec3  T      = refract(I, N, 1.0 / uIOR);
    float hAbs   = hn * uHeight;
    float tHit   = hAbs / max(-T.z, 1e-4);
    vec2  dp     = T.xy * tHit;
    float aspect = uRes.x / max(uRes.y, 1.0);
    vec2  duv    = vec2(dp.x / aspect, dp.y) * uUvScale;

    float lod = uLod + (1.0 - N.z) * 1.2;

    // 水的色散很小：n 从 1.331 到 1.344，相对差 ~1%。
    float disp = uDisp;
    vec3 trans;
    trans.r = textureLod(uBg, tUv + duv * (1.0 + disp), lod).r;
    trans.g = textureLod(uBg, tUv + duv, lod).g;
    trans.b = textureLod(uBg, tUv + duv * (1.0 - disp), lod).b;

    trans *= exp(-vec3(0.035, 0.012, 0.045) * hn);

    // ---- 主题底色 ----------------------------------------------------
    trans = mix(trans, uFill, clamp(hn, 0.0, 1.0) * uFillAlpha);

    // ---- 菲涅尔 ------------------------------------------------------
    float F = 0.02 + 0.98 * pow(1.0 - clamp(N.z, 0.0, 1.0), 5.0);

    // ---- 环境反射 ----------------------------------------------------
    // 只取低频：壁纸上下半球平均色 + 高 mip 的局部色。
    vec3  R   = 2.0 * N.z * N - vec3(0.0, 0.0, 1.0);
    float gy  = clamp(0.5 + 0.5 * R.z, 0.0, 1.0);
    vec3  env = mix(uEnvBottom, uEnvTop, gy);
    env = mix(env, uEnvAvg, 0.18);
    vec3  local = textureLod(uBg, tUv, 5.0).rgb;
    env = mix(env, local, uEnvMix);

    // ---- 高光 --------------------------------------------------------
    float ndl  = max(dot(N, L), 0.0);
    float spec = pow(ndl, 256.0);

    vec3 col = trans * (1.0 - F) + env * F;
    col += spec * (0.02 + 0.98 * pow(1.0 - ndl, 5.0)) * uSpec * 12.0;

    // ---- 接触线 ------------------------------------------------------
    col *= mix(0.84, 1.0, smoothstep(0.0, 0.05, hn));

    bg = mix(bg, col, mask);
  }

  outColor = vec4(bg, 1.0);

  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  outColor.rgb += (ign - 0.5) * (1.0 / 255.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log, src);
    const pre = document.createElement("pre");
    pre.style.cssText =
      "position:fixed;inset:0;z-index:99;margin:0;padding:16px;overflow:auto;" +
      "background:#2a0d0d;color:#ffd7d7;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap";
    pre.textContent = "着色器编译失败\n\n" + log;
    document.body.appendChild(pre);
    throw new Error("shader: " + log);
  }
  return s;
}

function linkProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error("link: " + gl.getProgramInfoLog(p));
  }
  return p;
}

const progField = linkProgram(FIELD_FRAG);  // 低分辨率：距离场 → 球冠高度
const progGeo   = linkProgram(GEO_FRAG);    // 低分辨率：高度场 → 法线
const progComp  = linkProgram(COMP_FRAG);   // 全分辨率：透镜成像

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const UF = {};
for (const n of ["uRes", "uNum", "uMerge", "uRadius", "uSinCA", "uCosCA", "uPos"]) {
  UF[n] = gl.getUniformLocation(progField, n);
}

const UG = {};
for (const n of ["uD", "uRes", "uHeight"]) {
  UG[n] = gl.getUniformLocation(progGeo, n);
}

const UC = {};
for (const n of [
  "uGlass", "uBg", "uRes", "uUvScale", "uUvOffset", "uShadow", "uOn",
  "uLod", "uSpec", "uFill", "uFillAlpha", "uEnvMix", "uPhase", "uIOR", "uDisp",
  "uHeight", "uEnvTop", "uEnvBottom", "uEnvAvg",
]) {
  UC[n] = gl.getUniformLocation(progComp, n);
}

/* ------------------------------------------------------------------ *
 * 低分辨率的玻璃缓冲
 * ------------------------------------------------------------------ */
const canFloat = !!gl.getExtension("EXT_color_buffer_float");
const GLASS_FMT = canFloat ? gl.RGBA16F : gl.RGBA8;
const GLASS_TYPE = canFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, GLASS_FMT, 1, 1, 0, gl.RGBA, GLASS_TYPE, null);

  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: t, fbo: f };
}

const fieldBuf = makeTarget();   // 输出：距离场 + 球冠高度
const glassBuf = makeTarget();   // 输出：法线 + 距离 + 高度

function allocTargets() {
  for (const b of [fieldBuf, glassBuf]) {
    gl.bindTexture(gl.TEXTURE_2D, b.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, GLASS_FMT, glassW, glassH, 0, gl.RGBA, GLASS_TYPE, null);
  }
}

/* ------------------------------------------------------------------ *
 * 背景纹理
 * ------------------------------------------------------------------ */
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

let bgAspect = 3 / 2;
let bgPixelW = 1920;

const envTop = [0.55, 0.62, 0.72];
const envBottom = [0.18, 0.18, 0.22];
const envAvg = [0.36, 0.38, 0.44];

// 只取壁纸的低频颜色：上下半球平均 + 全局平均。
// 环境反射因此只有颜色变化，不会有"第二层壁纸"的细节。
function computeEnvironment(img) {
  try {
    const size = 24;
    const board = newCanvas(size, size);
    const ctx = board.getContext("2d", { willReadFrequently: true });
    if (!ctx) return;
    ctx.drawImage(img, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;

    let tr = 0, tg = 0, tb = 0, tn = 0;
    let br = 0, bg = 0, bb = 0, bn = 0;
    let ar = 0, ag = 0, ab = 0, an = 0;
    for (let y = 0; y < size; y += 1) {
      for (let x = 0; x < size; x += 1) {
        const i = (y * size + x) * 4;
        const r = data[i] / 255;
        const g = data[i + 1] / 255;
        const b = data[i + 2] / 255;
        ar += r; ag += g; ab += b; an += 1;
        if (y < size / 2) { tr += r; tg += g; tb += b; tn += 1; }
        else { br += r; bg += g; bb += b; bn += 1; }
      }
    }

    envTop[0] = Math.min(1, (tr / tn) * 1.12 + 0.02);
    envTop[1] = Math.min(1, (tg / tn) * 1.12 + 0.02);
    envTop[2] = Math.min(1, (tb / tn) * 1.12 + 0.02);
    envBottom[0] = Math.max(0, (br / bn) * 0.78);
    envBottom[1] = Math.max(0, (bg / bn) * 0.78);
    envBottom[2] = Math.max(0, (bb / bn) * 0.78);
    envAvg[0] = ar / an;
    envAvg[1] = ag / an;
    envAvg[2] = ab / an;
  } catch (_) {
    /* 跨源或读像素失败：保留深色兜底 */
  }
}

function uploadImage(img) {
  bgAspect = img.width / img.height;
  bgPixelW = img.width;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  computeEnvironment(img);
}

/* ------------------------------------------------------------------ *
 * 程序化背景（不依赖任何外部文件，双击就能跑）
 * ------------------------------------------------------------------ */
function newCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

function addGrain(ctx, w, h, amount) {
  const n = newCanvas(128, 128);
  const nx = n.getContext("2d");
  const id = nx.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 128 + (Math.random() * 2 - 1) * 46;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  nx.putImageData(id, 0, 0);
  ctx.save();
  ctx.globalAlpha = amount;
  ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = ctx.createPattern(n, "repeat");
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

function hill(ctx, w, h, baseY, amp, freq, phase, color) {
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 4) {
    const y =
      baseY +
      Math.sin((x / w) * Math.PI * freq + phase) * amp +
      Math.sin((x / w) * Math.PI * freq * 2.7 + phase * 2.1) * amp * 0.34;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function makePhoto(w, h) {
  const c = newCanvas(w, h);
  const x = c.getContext("2d");

  const sky = x.createLinearGradient(0, 0, 0, h * 0.82);
  sky.addColorStop(0.00, "#0a1730");
  sky.addColorStop(0.34, "#22386b");
  sky.addColorStop(0.58, "#6a5a8f");
  sky.addColorStop(0.76, "#c4705c");
  sky.addColorStop(0.90, "#eaa063");
  sky.addColorStop(1.00, "#f6c98a");
  x.fillStyle = sky;
  x.fillRect(0, 0, w, h);

  const sx = w * 0.665, sy = h * 0.615, sr = w * 0.075;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 6.5);
  sg.addColorStop(0.00, "rgba(255,247,215,1)");
  sg.addColorStop(0.10, "rgba(255,226,168,0.95)");
  sg.addColorStop(0.28, "rgba(255,168,104,0.42)");
  sg.addColorStop(0.60, "rgba(224,120,96,0.14)");
  sg.addColorStop(1.00, "rgba(200,100,90,0)");
  x.fillStyle = sg;
  x.fillRect(0, 0, w, h);

  x.fillStyle = "rgba(255,250,225,0.98)";
  x.beginPath();
  x.arc(sx, sy, sr, 0, 7);
  x.fill();

  hill(x, w, h, h * 0.655, h * 0.045, 2.1, 0.6, "#3b2f52");
  hill(x, w, h, h * 0.705, h * 0.055, 1.4, 2.1, "#2a2340");
  hill(x, w, h, h * 0.775, h * 0.040, 3.2, 4.0, "#191527");
  hill(x, w, h, h * 0.865, h * 0.030, 4.6, 1.2, "#0d0b15");

  const water = x.createLinearGradient(0, h * 0.87, 0, h);
  water.addColorStop(0, "rgba(120,90,130,0.10)");
  water.addColorStop(1, "rgba(20,18,34,0.55)");
  x.fillStyle = water;
  x.fillRect(0, h * 0.87, w, h * 0.13);

  addGrain(x, w, h, 0.07);
  return c;
}

function makeChart(w, h) {
  const c = newCanvas(w, h);
  const x = c.getContext("2d");

  x.fillStyle = "#0d1117";
  x.fillRect(0, 0, w, h);

  for (let i = 0; i <= w / 64; i++) {
    x.fillStyle = i % 4 === 0 ? "rgba(120,180,255,.28)" : "rgba(120,180,255,.11)";
    x.fillRect(i * 64, 0, i % 4 === 0 ? 2 : 1, h);
  }
  for (let j = 0; j <= h / 64; j++) {
    x.fillStyle = j % 4 === 0 ? "rgba(120,180,255,.28)" : "rgba(120,180,255,.11)";
    x.fillRect(0, j * 64, w, j % 4 === 0 ? 2 : 1);
  }

  const colors = ["#ff5d5d", "#ffb23f", "#ffe14a", "#5ddc7a", "#4fc3f7", "#9b7bff", "#ff6fd8"];
  for (let i = 0; i < 26; i++) {
    x.globalAlpha = 0.85;
    x.fillStyle = colors[i % colors.length];
    const bw = 40 + Math.random() * 190;
    const bh = 28 + Math.random() * 150;
    x.fillRect(Math.random() * (w - bw), Math.random() * (h - bh), bw, bh);
  }
  x.globalAlpha = 1;

  for (let i = 0; i < 9; i++) {
    x.strokeStyle = colors[i % colors.length];
    x.lineWidth = 2 + (i % 3);
    x.beginPath();
    x.arc(w * (0.12 + i * 0.095), h * (0.18 + (i % 3) * 0.30), 34 + i * 13, 0, Math.PI * 2);
    x.stroke();
  }

  x.fillStyle = "#f2f6ff";
  x.font = "600 92px ui-sans-serif, system-ui, sans-serif";
  x.fillText("LIQUID", w * 0.07, h * 0.80);
  x.font = "600 92px ui-monospace, Consolas, monospace";
  x.fillText("GLASS", w * 0.07, h * 0.90);

  addGrain(x, w, h, 0.05);
  return c;
}

function setBackground(kind) {
  const img = kind === "chart" ? makeChart(1920, 1280) : makePhoto(1920, 1280);
  uploadImage(img);
}

/* ------------------------------------------------------------------ *
 * 尺寸 / cover 映射
 * ------------------------------------------------------------------ */
let cssW = 1, cssH = 1;

let glassW = 1, glassH = 1;

// 质量档位 —— 唯一需要"调"的东西，交给控制器。
// dpr = 输出画布相对 CSS 像素的倍率（全分辨率合成是唯一的大头）
// 质量档位只改"输出分辨率"。几何层固定 0.18 屏宽 —— 在 ~160×110 上
// 几乎不花钱；换档时不重建，形状不会跳。
const GLASS_SCALE = 0.18;
const LEVELS = [
  { dpr: 0.70 },
  { dpr: 0.85 },
  { dpr: 1.00 },
  { dpr: 1.25 },
  { dpr: 1.50 },
];
let level = 2;

function maxLevel() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let i = 0;
  for (let k = 0; k < LEVELS.length; k++) if (LEVELS[k].dpr <= dpr + 0.001) i = k;
  return i;
}

function resize() {
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  const L = LEVELS[level];

  // 输出画布：照片在这里是清晰的
  const w = Math.max(2, Math.round(cssW * L.dpr));
  const h = Math.max(2, Math.round(cssH * L.dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }

  // 几何层：只影响液滴的形状精度，不影响清晰度。
  // 只有尺寸真的变了才重建缓冲；换输出档时不重建，形状不会跳。
  const gW = Math.max(2, Math.round(cssW * GLASS_SCALE));
  const gH = Math.max(2, Math.round(cssH * GLASS_SCALE));
  if (gW !== glassW || gH !== glassH) {
    glassW = gW;
    glassH = gH;
    allocTargets();
  }

  elRes.textContent =
    "质量 " + (level + 1) + "/" + LEVELS.length + " · " +
    w + "×" + h + " · 玻璃 " + glassW + "×" + glassH;
}

function uvRect() {
  const view = canvas.width / Math.max(1, canvas.height);
  let sx = 1, sy = 1, ox = 0, oy = 0;
  if (bgAspect > view) {
    sx = view / bgAspect;
    ox = (1 - sx) * 0.5;
  } else {
    sy = bgAspect / view;
    oy = (1 - sy) * 0.5;
  }
  return [sx, sy, ox, oy];
}

/* ------------------------------------------------------------------ *
 * 渲染循环
 * ------------------------------------------------------------------ */
const elFps = document.getElementById("fps");
const elMs = document.getElementById("ms");
const elGpu = document.getElementById("gpu");
const elBlob = document.getElementById("nblob");
const elRes = document.getElementById("res");

let phase = 0;
const blobPosArr = new Float32Array(18);
const blobVel = new Float32Array(18);   // 每滴的速度（带惯性）
const blobTgt = new Float32Array(18);   // 目标路径

// 液滴的运动是有惯性的：它们被一条缓慢的路径牵着走，但不是刚性地绑在上面。
// 用二阶阻尼振子（弹簧 + 阻尼）积分，于是它们会滞后、会有一点过冲 ——
// 这是"漂"和"被拖着走"的区别。
function updateBlobs(ph, dt) {
  const n = Math.round(state.num);
  const R = Math.max(0.02, state.radius);

  for (let i = 0; i < n; i++) {
    const a = i * 2.39996323;
    const w1 = 3 + (i % 3);
    const w2 = 4 + ((i * 2) % 3);
    blobTgt[i * 2]     = 0.55 * Math.sin(ph * w1 + a);
    blobTgt[i * 2 + 1] = 0.30 * Math.cos(ph * w2 + a * 1.7);
  }

  // 表面张力：靠近的两滴互相拉，目标点因此偏向对方
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = blobTgt[j * 2] - blobTgt[i * 2];
      const dy = blobTgt[j * 2 + 1] - blobTgt[i * 2 + 1];
      const dist = Math.hypot(dx, dy) || 1e-6;
      const near = Math.max(0, 1 - dist / (2.6 * R));
      const pull = near * near * 0.012;
      const ux = dx / dist, uy = dy / dist;
      blobTgt[i * 2]     += ux * pull;
      blobTgt[i * 2 + 1] += uy * pull;
      blobTgt[j * 2]     -= ux * pull;
      blobTgt[j * 2 + 1] -= uy * pull;
    }
  }

  // 阻尼振子：K 是刚度，D 是阻尼。ζ ≈ 0.46，轻微过冲，像黏性液体。
  const K = 3.0, D = 1.6, h = Math.min(dt, 0.05);
  for (let i = 0; i < n; i++) {
    const ix = i * 2, iy = ix + 1;
    if (blobPosArr[ix] === 0 && blobPosArr[iy] === 0 && blobVel[ix] === 0 && blobVel[iy] === 0) {
      blobPosArr[ix] = blobTgt[ix];               // 起始帧直接就位，不要从原点飞出来
      blobPosArr[iy] = blobTgt[iy];
    }
    blobVel[ix] += ((blobTgt[ix] - blobPosArr[ix]) * K - blobVel[ix] * D) * h;
    blobVel[iy] += ((blobTgt[iy] - blobPosArr[iy]) * K - blobVel[iy] * D) * h;
    blobPosArr[ix] += blobVel[ix] * h;
    blobPosArr[iy] += blobVel[iy] * h;
  }

}
let last = performance.now();
let lastPresent = 0;
let acc = 0, frames = 0, fps = 0, ms = 0;

// GPU 计时器：拿真实渲染耗时。rAF 的帧间隔被 vsync 量化过，看不出余量，
// 而这个能告诉我们"其实只花了 4ms"。没有这个扩展就退回帧间隔估算。
const timerExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");
let gpuQuery = null;
const gpuPending = [];
let gpuMs = 8.0;

// 预算按 120fps（8.3ms）定，留一倍余量，钉在 60 就绝对稳。
const BUDGET_HI = 9.0;   // 超过就降一档
const BUDGET_LO = 6.0;   // 低于就试着升一档
let lastAdjust = 0;
let justDown = false;

function frame(now) {
  // 先排下一帧：后面任何 early return 都不会断链
  requestAnimationFrame(frame);

  // 输出钉在 60fps。120Hz 屏上隔帧丢一次；60Hz 屏上这个条件永远不成立。
  if (now - lastPresent < 15.2) return;

  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  lastPresent = now;

  if (!paused) {
    phase += dt * state.speed * (Math.PI * 2 / 47);
  }
  if (phase > Math.PI * 2 * 1000) phase -= Math.PI * 2 * 1000;

  const [sx, sy, ox, oy] = uvRect();

  if (timerExt && !gpuQuery) {
    gpuQuery = gl.createQuery();
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, gpuQuery);
  }

  const R = Math.max(0.02, state.radius);
  const ca = state.contact * Math.PI / 180;
  const H = R * Math.tan(ca / 2);

  /* ---- 第一趟：几何（距离场 + 球冠高度）---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fieldBuf.fbo);
  gl.viewport(0, 0, glassW, glassH);
  gl.useProgram(progField);
  gl.uniform2f(UF.uRes, glassW, glassH);
  gl.uniform1i(UF.uNum, Math.round(state.num));
  gl.uniform1f(UF.uMerge, state.merge);
  gl.uniform1f(UF.uRadius, R);
  gl.uniform1f(UF.uSinCA, Math.sin(ca));
  gl.uniform1f(UF.uCosCA, Math.cos(ca));

  updateBlobs(phase, Math.min(dt, 0.05));
  gl.uniform2fv(UF.uPos, blobPosArr);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---- 第二趟：高度场 → 法线 ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, glassBuf.fbo);
  gl.viewport(0, 0, glassW, glassH);
  gl.useProgram(progGeo);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fieldBuf.tex);
  gl.uniform1i(UG.uD, 0);
  gl.uniform2f(UG.uRes, glassW, glassH);
  gl.uniform1f(UG.uHeight, H);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---- 第三趟：全分辨率合成 → 屏幕 ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(progComp);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(UC.uBg, 1);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, glassBuf.tex);
  gl.uniform1i(UC.uGlass, 0);

  gl.uniform2f(UC.uRes, canvas.width, canvas.height);
  gl.uniform2f(UC.uUvScale, sx, sy);
  gl.uniform2f(UC.uUvOffset, ox, oy);
  gl.uniform1f(UC.uShadow, off ? 0 : state.shadow);
  gl.uniform1f(UC.uOn, off ? 0 : 1);
  gl.uniform1f(UC.uLod, state.lod);
  gl.uniform1f(UC.uSpec, state.spec);
  gl.uniform1f(UC.uFillAlpha, state.fill);
  gl.uniform1f(UC.uEnvMix, state.env);
  gl.uniform1f(UC.uPhase, phase);
  gl.uniform1f(UC.uIOR, state.ior);
  gl.uniform1f(UC.uDisp, state.disp);
  gl.uniform1f(UC.uHeight, H);
  gl.uniform3f(UC.uFill, fillLight ? 1 : 0.12, fillLight ? 1 : 0.12, fillLight ? 1 : 0.12);
  gl.uniform3fv(UC.uEnvTop, envTop);
  gl.uniform3fv(UC.uEnvBottom, envBottom);
  gl.uniform3fv(UC.uEnvAvg, envAvg);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // ---- 收工时：结账 ------------------------------------------------
  if (timerExt && gpuQuery) {
    gl.endQuery(timerExt.TIME_ELAPSED_EXT);
    gpuPending.push(gpuQuery);
    gpuQuery = null;
  }

  if (timerExt) {
    while (gpuPending.length) {
      const q = gpuPending[0];
      if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break;
      // 只有真的取到结果时才查 disjoint，省掉每帧一次状态查询
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
        const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);
        gpuMs = gpuMs * 0.88 + (ns / 1e6) * 0.12;
      }
      gl.deleteQuery(q);
      gpuPending.shift();
    }
    while (gpuPending.length > 8) { gl.deleteQuery(gpuPending.shift()); }
  } else {
    // 没有计时器就退回帧间隔估算（被 vsync 量化，只能测到"掉帧"，测不到余量）
    gpuMs = gpuMs * 0.95 + Math.min(dt * 1000, 33) * 0.05;
  }

  // ---- 控制器：目标 120fps 预算 -------------------------------------
  // 降档要快、升档要慢：掉帧一眼就看得出，来回跳档反而更难受
  if (now - lastAdjust > (justDown ? 1500 : 6000) && now > 4000 && !document.hidden) {
    if (gpuMs > BUDGET_HI && level > 0) {
      level--; resize(); lastAdjust = now; justDown = true;
    } else if (gpuMs < BUDGET_LO && level < maxLevel()) {
      level++; resize(); lastAdjust = now; justDown = false;
    }
  }

  // 统计
  acc += dt; frames++;
  if (acc >= 0.5) {
    fps = frames / acc;
    ms = (acc / frames) * 1000;
    elFps.textContent = fps.toFixed(0);
    elMs.textContent = ms.toFixed(1);
    elBlob.textContent = Math.round(state.num);
    elGpu.textContent = gpuMs.toFixed(1);
    acc = 0; frames = 0;
  }
}

const slidersEl = document.getElementById("sliders");
const inputs = {};

for (const [key, label, min, max, step, desc] of SLIDERS) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("label");
  const name = document.createElement("span");
  const val = document.createElement("span");
  name.textContent = label;
  lab.append(name, val);

  const input = document.createElement("input");
  input.type = "range";
  input.min = min; input.max = max; input.step = step;
  input.value = state[key];
  input.title = desc || "";

  const show = () => {
    const v = Number(input.value);
    if (key === "num") { val.textContent = v.toFixed(0); return; }
    const dp = step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    val.textContent = v.toFixed(dp);
  };
  input.addEventListener("input", () => {
    state[key] = Number(input.value);
    show();
  });

  show();
  row.append(lab, input);
  if (desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = desc;
    row.append(d);
  }
  slidersEl.append(row);
  inputs[key] = { input, show };
}

function syncInputs() {
  for (const [key] of SLIDERS) {
    inputs[key].input.value = state[key];
    inputs[key].show();
  }
}

function loadFile(file) {
  if (!file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    uploadImage(img);
    URL.revokeObjectURL(url);
    btnPhoto.classList.remove("on");
    btnChart.classList.remove("on");
  };
  img.src = url;
}

let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  e.preventDefault(); dragDepth++; dropEl.classList.add("show");
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("dragleave", (e) => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("show"); }
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0; dropEl.classList.remove("show");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ *
 * 启动
 * ------------------------------------------------------------------ */
const startChart = location.hash.includes("chart");
setBackground(startChart ? "chart" : "photo");
if (startChart) {
  btnChart.classList.add("on");
  btnPhoto.classList.remove("on");
}

// 支持 hash 覆盖任意参数，方便 A/B 对比：
//   #chart             网格测试图
//   #contact=85        覆盖任意参数
//   #chart&fill=0.45   组合
location.hash.slice(1).split("&").forEach((kv) => {
  const [k, v] = kv.split("=");
  if (k && Object.prototype.hasOwnProperty.call(state, k)) {
    const n = parseFloat(v);
    if (isFinite(n)) state[k] = n;
  }
});
syncInputs();

level = maxLevel();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
