<script src="hdri.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 * 物理常量 / 状态
 * ------------------------------------------------------------------ */
const GAMMA = 0.0728;
const RHO = 998;
const GRAV = 9.81;
const LC_MM = Math.sqrt(GAMMA / (RHO * GRAV)) * 1000;
const WORLD_MM = 10;
const TAU = Math.PI * 2;
const NW = [1.331, 1.333, 1.344];
const NG = [1.514, 1.520, 1.528];

const DEFAULTS = {
  num: 5,
  size: 1.5,
  contact: 80,
  flow: 0.04,
  pin: 0.0,
  eps: 2.2,
  mobility: 0.8,
  lod: 0.15,
  spec: 1.0,
  fill: 0.15,
  env: 1.0,
  envRot: 0,
  glass: 0.20,
  speed: 1.0,
};

const SLIDERS = [
  ["num",      "初始滴数", 2,    9,    1,     "相场初始化的 tanh 斑块数；之后由 CAC 自然合并/分裂"],
  ["size",     "尺寸",     0.5,  4.0,  0.05,  "物理接触半径（mm）；调大后按重力摊成水洼"],
  ["contact",  "接触角",   50,   90,   1,     "球冠在接触线处的角度；80° 是疏水屏"],
  ["flow",     "流场",     0,    0.20, 0.005, "全局无散度速度场强度"],
  ["pin",      "钉扎",     0,    0.05, 0.001, "接触线静摩擦阈值；默认 0，纯流场平流"],
  ["eps",      "界面宽度", 1.2,  3.5,  0.1,   "CAC 界面宽度（相场格），影响边缘柔度"],
  ["mobility", "迁移率",   0.2,  2.0,  0.02,  "Allen-Cahn 迁移率；越大拓扑变化越快"],
  ["lod",      "模糊",    -2,    3,    0.1,   "0 = 清透，往上加磨砂"],
  ["spec",     "高光",     0,    2.5,  0.02,  "曲面把环境光聚成的小点"],
  ["fill",     "底色",     0,    1,    0.01,  "介质光学厚度；暗色吸收、亮色散射"],
  ["env",      "环境亮度", 0,    2,    0.05,  "HDR 环境反射强度"],
  ["envRot",   "环境旋转", 0,    360,  1,     "旋转 HDR 环境"],
  ["glass",    "玻璃厚度", 0,    1.5,  0.05,  "屏幕玻璃层厚度（mm）"],
  ["speed",    "速度",     0,    3,    0.02,  "整体时间倍率"],
];

const state = Object.assign({}, DEFAULTS);
let off = false;
let paused = false;
let fillLight = false;
let showFlow = false;

/* ------------------------------------------------------------------ *
 * WebGL / DOM
 * ------------------------------------------------------------------ */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", {
  alpha: true,
  antialias: false,
  depth: false,
  stencil: false,
  premultipliedAlpha: false,
  preserveDrawingBuffer: false,
  powerPreference: "high-performance",
});
if (!gl) {
  document.body.innerHTML =
    '<div style="padding:40px;font:16px system-ui;color:#dde">这个浏览器/机器没有 WebGL2，跑不了。</div>';
  throw new Error("no webgl2");
}
const pageBg = document.getElementById("pagebg");
const flowCanvas = document.getElementById("flow");
const fctx = flowCanvas.getContext("2d");

/* ------------------------------------------------------------------ *
 * 1D 轴对称 Young-Laplace（只求基础尺寸的轮廓）
 * ------------------------------------------------------------------ */
function integrateProfile(P, thetaDeg, ds = 0.003, sMax = 80) {
  const theta = (thetaDeg * Math.PI) / 180;
  const pts = [];
  let r = 0, z = 0, phi = 0, V = 0, s = 0;
  const s0 = 1e-4;
  r = s0; z = (P * s0 * s0) / 4; phi = (P * s0) / 2;
  const deriv = (r, z, phi) => [
    Math.cos(phi),
    Math.sin(phi),
    P + z - (r > 1e-9 ? Math.sin(phi) / r : 0),
    Math.PI * r * r * Math.sin(phi),
  ];
  while (s < sMax) {
    const prev = [r, z, phi, V];
    pts.push([r, z]);
    const k1 = deriv(r, z, phi);
    const k2 = deriv(r + (ds / 2) * k1[0], z + (ds / 2) * k1[1], phi + (ds / 2) * k1[2]);
    const k3 = deriv(r + (ds / 2) * k2[0], z + (ds / 2) * k2[1], phi + (ds / 2) * k2[2]);
    const k4 = deriv(r + ds * k3[0], z + ds * k3[1], phi + ds * k3[2]);
    r += (ds / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    z += (ds / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    phi += (ds / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
    V += (ds / 6) * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]);
    s += ds;
    if (phi >= theta) {
      const t = (theta - prev[2]) / Math.max(phi - prev[2], 1e-9);
      const rr = prev[0] + t * (r - prev[0]);
      const zz = prev[1] + t * (z - prev[1]);
      const vv = prev[3] + t * (V - prev[3]);
      pts.push([rr, zz]);
      return { R: rr, H: zz, V: vv, Bo: rr * rr, pts };
    }
  }
  return null;
}

function profileAt(q, R, H, pts) {
  const r = q * R;
  for (let i = 1; i < pts.length; i++) {
    if (pts[i][0] >= r) {
      const a = pts[i - 1], b = pts[i];
      const t = (r - a[0]) / Math.max(b[0] - a[0], 1e-9);
      const z = a[1] + t * (b[1] - a[1]);
      return (H - z) / H;
    }
  }
  return 0;
}

let profileTex = null;
let base = { Rmm: 1.5, Hmm: 1.0, Bo: 0.2, Rref: 0.15, H0: 0.1 };

function buildBaseProfile(thetaDeg, sizeMm) {
  const entries = [];
  const Pmin = 0.03, Pmax = 60, count = 52;
  for (let i = 0; i < count; i += 1) {
    const P = Pmin * Math.pow(Pmax / Pmin, i / (count - 1));
    const s = integrateProfile(P, thetaDeg);
    if (!s || !isFinite(s.R) || s.R <= 0 || s.H <= 0) continue;
    const prof = new Float32Array(64);
    for (let k = 0; k < 64; k += 1) {
      prof[k] = Math.max(0, Math.min(1, profileAt(k / 63, s.R, s.H, s.pts)));
    }
    entries.push({ R: s.R * LC_MM, H: s.H * LC_MM, V: s.V * LC_MM ** 3, Bo: s.Bo, prof });
  }
  entries.sort((a, b) => a.R - b.R);
  if (!entries.length) return;
  let lo = 0, hi = entries.length - 1;
  const target = Math.max(entries[0].R, Math.min(entries[hi].R, sizeMm));
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (entries[mid].R <= target) lo = mid; else hi = mid;
  }
  const t = (target - entries[lo].R) / Math.max(entries[hi].R - entries[lo].R, 1e-9);
  const a = entries[lo], b = entries[hi];
  const prof = new Float32Array(64);
  for (let k = 0; k < 64; k += 1) prof[k] = a.prof[k] + (b.prof[k] - a.prof[k]) * t;
  const Hmm = a.H + (b.H - a.H) * t;
  base = {
    Rmm: target,
    Hmm,
    Bo: a.Bo + (b.Bo - a.Bo) * t,
    Rref: target / WORLD_MM,
    H0: Hmm / WORLD_MM,
    prof,
  };

  if (!profileTex) profileTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, profileTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const data = new Float32Array(64 * 4);
  for (let k = 0; k < 64; k += 1) { data[k * 4] = prof[k]; data[k * 4 + 3] = 1; }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 64, 1, 0, gl.RGBA, gl.FLOAT, data);
}

/* ------------------------------------------------------------------ *
 * HDR 环境（hdri.js -> 256x128 RGBE -> cubemap）
 * ------------------------------------------------------------------ */
const ENV_W = 256;
const ENV_H = 128;
const ENV_SIZE = 128;
let envTex = null;
let envLight = [0.3, 0.5, 0.8];

function decodeHDRI() {
  if (!window.HDRI_RGBE || !window.HDRI_W || !window.HDRI_H) return null;
  try {
    const bin = atob(window.HDRI_RGBE);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
    const w = window.HDRI_W, h = window.HDRI_H;
    if (bytes.length < w * h * 4) return null;
    const data = new Float32Array(w * h * 3);
    for (let i = 0; i < w * h; i += 1) {
      const e = bytes[i * 4 + 3];
      if (e !== 0) {
        const f = Math.pow(2, e - 136);
        data[i * 3] = bytes[i * 4] * f;
        data[i * 3 + 1] = bytes[i * 4 + 1] * f;
        data[i * 3 + 2] = bytes[i * 4 + 2] * f;
      }
    }
    return { w, h, data };
  } catch (_) {
    return null;
  }
}

function sampleEquirect(data, u, v, w, h) {
  const x = (((u % 1) + 1) % 1) * w - 0.5;
  const y = Math.max(0, Math.min(h - 1, v * h - 0.5));
  const x0 = Math.floor(x), x1 = (x0 + 1 + w) % w;
  const y0 = Math.floor(y), y1 = Math.min(h - 1, y0 + 1);
  const fx = x - Math.floor(x), fy = y - y0;
  const a = (y0 * w + x0) * 3, b = (y0 * w + x1) * 3;
  const c = (y1 * w + x0) * 3, d = (y1 * w + x1) * 3;
  const out = [0, 0, 0];
  for (let k = 0; k < 3; k += 1) {
    const top = data[a + k] * (1 - fx) + data[b + k] * fx;
    const bot = data[c + k] * (1 - fx) + data[d + k] * fx;
    out[k] = top * (1 - fy) + bot * fy;
  }
  return out;
}

function buildEnvironment() {
  const dec = decodeHDRI();
  let hdr, hdrW, hdrH;
  if (dec) {
    hdr = dec.data; hdrW = dec.w; hdrH = dec.h;
    if (Array.isArray(window.HDRI_LIGHT)) envLight = window.HDRI_LIGHT.slice();
  } else {
    hdrW = ENV_W; hdrH = ENV_H;
    hdr = new Float32Array(hdrW * hdrH * 3);
    for (let y = 0; y < hdrH; y += 1) {
      const v = (y + 0.5) / hdrH;
      for (let x = 0; x < hdrW; x += 1) {
        const i = (y * hdrW + x) * 3;
        const sky = Math.max(0, 1 - Math.abs(v - 0.42) * 2.2);
        hdr[i] = 0.08 + sky * 0.7;
        hdr[i + 1] = 0.10 + sky * 0.8;
        hdr[i + 2] = 0.16 + sky * 0.95;
      }
    }
    envLight = [0.3, 0.5, 0.8];
  }

  if (!envTex) envTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, envTex);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const face = new Float32Array(ENV_SIZE * ENV_SIZE * 4);
  for (let f = 0; f < 6; f += 1) {
    for (let y = 0; y < ENV_SIZE; y += 1) {
      for (let x = 0; x < ENV_SIZE; x += 1) {
        const u = (2 * (x + 0.5)) / ENV_SIZE - 1;
        const v = (2 * (y + 0.5)) / ENV_SIZE - 1;
        let dx, dy, dz;
        if (f === 0) { dx = 1; dy = -v; dz = -u; }
        else if (f === 1) { dx = -1; dy = -v; dz = u; }
        else if (f === 2) { dx = u; dy = 1; dz = v; }
        else if (f === 3) { dx = u; dy = -1; dz = -v; }
        else if (f === 4) { dx = u; dy = -v; dz = 1; }
        else { dx = -u; dy = -v; dz = -1; }
        const len = Math.hypot(dx, dy, dz) || 1;
        dx /= len; dy /= len; dz /= len;
        const eu = Math.atan2(dz, dx) / TAU + 0.5;
        const ev = Math.acos(Math.max(-1, Math.min(1, dy))) / Math.PI;
        const c = sampleEquirect(hdr, eu, ev, hdrW, hdrH);
        const idx = (y * ENV_SIZE + x) * 4;
        face[idx] = c[0]; face[idx + 1] = c[1]; face[idx + 2] = c[2]; face[idx + 3] = 1;
      }
    }
    gl.texImage2D(
      gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, gl.RGBA16F, ENV_SIZE, ENV_SIZE, 0,
      gl.RGBA, gl.FLOAT, face,
    );
  }
}

/* ------------------------------------------------------------------ *
 * 全局流场
 * ------------------------------------------------------------------ */
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function flowPsi(x, y, t) {
  const win = smoothstep(0.86, 0.58, Math.abs(x)) * smoothstep(0.56, 0.36, Math.abs(y));
  if (win <= 0) return 0;
  const k1 = 2.6, k2 = 3.7, k3 = 5.1;
  const w1 = (TAU / 47) * 1, w2 = (TAU / 47) * 2, w3 = (TAU / 47) * 3;
  const m1 = Math.sin(k1 * x + w1 * t + 0.7) * Math.cos(k1 * y + 0.3);
  const m2 = Math.cos(k2 * x - 0.4) * Math.sin(k2 * y + w2 * t + 1.1);
  const m3 = Math.sin(k3 * (x + y) + w3 * t + 2.0) * Math.cos(k3 * (x - y) - 0.8);
  return win * (0.55 * m1 + 0.35 * m2 + 0.22 * m3);
}

function flowAt(x, y, t) {
  const e = 1e-3;
  const ux = (flowPsi(x, y + e, t) - flowPsi(x, y - e, t)) / (2 * e);
  const uy = -(flowPsi(x + e, y, t) - flowPsi(x - e, y, t)) / (2 * e);
  return [ux * state.flow, uy * state.flow];
}

const FLOW_W = 64, FLOW_H = 40;
let flowTex = null;
const flowData = new Float32Array(FLOW_W * FLOW_H * 2);

function updateFlowTexture() {
  const aspect = Math.max(1e-3, cssW / Math.max(1, cssH));
  for (let y = 0; y < FLOW_H; y += 1) {
    const py = (y + 0.5) / FLOW_H - 0.5;
    for (let x = 0; x < FLOW_W; x += 1) {
      const px = ((x + 0.5) / FLOW_W - 0.5) * aspect;
      const u = flowAt(px, py, flowTime);
      const i = (y * FLOW_W + x) * 2;
      flowData[i] = u[0]; flowData[i + 1] = u[1];
    }
  }
  if (!flowTex) flowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, flowTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, FLOW_W, FLOW_H, 0, gl.RG, gl.FLOAT, flowData);
}

/* ------------------------------------------------------------------ *
 * 着色器
 * ------------------------------------------------------------------ */
const VERT = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const CAC_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;

out vec4 outColor;

uniform sampler2D uPhi;
uniform sampler2D uFlow;
uniform vec2  uRes;
uniform float uDt;
uniform float uEps;
uniform float uM;
uniform float uTarget;
uniform float uRelax;
uniform float uPin;
uniform float uAspect;

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 vel = texture(uFlow, uv).xy;
  float speed = length(vel);
  float eff = smoothstep(uPin, uPin * 2.0 + 1e-6, speed);
  vec2 back = uv - vec2(vel.x / uAspect, vel.y) * uDt * eff;
  float phi = texture(uPhi, back).r;

  vec2 tx = 1.0 / uRes;
  float pL = texture(uPhi, uv - vec2(tx.x, 0.0)).r;
  float pR = texture(uPhi, uv + vec2(tx.x, 0.0)).r;
  float pD = texture(uPhi, uv - vec2(0.0, tx.y)).r;
  float pU = texture(uPhi, uv + vec2(0.0, tx.y)).r;
  float dx = 1.0 / uRes.y;
  float lap = (pL + pR + pD + pU - 4.0 * phi) / (dx * dx);
  float wp = 2.0 * phi * (1.0 - phi) * (1.0 - 2.0 * phi);
  float next = phi + uDt * uM * (uEps * uEps * lap - wp);

  float avg = textureLod(uPhi, vec2(0.5), 20.0).r;
  next += (uTarget - avg) * uRelax;
  outColor = vec4(clamp(next, 0.0, 1.0), 0.0, 0.0, 1.0);
}`;

const SEED_INIT_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uPhi;
uniform vec2 uRes;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float phi = texture(uPhi, uv).r;
  float band = abs(phi - 0.5);
  outColor = vec4(band < 0.06 ? uv : vec2(-1.0), 0.0, 1.0);
}`;

const SEED_JUMP_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uSeed;
uniform vec2 uRes;
uniform float uStep;
uniform float uAspect;
float distTo(vec2 uv, vec2 s) {
  return length(vec2((uv.x - s.x) * uAspect, uv.y - s.y));
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 best = vec2(-1.0);
  float bestD = 1e9;
  vec2 cur = texture(uSeed, uv).rg;
  if (cur.x >= 0.0) { best = cur; bestD = distTo(uv, cur); }
  for (int i = -1; i <= 1; i++) {
    for (int j = -1; j <= 1; j++) {
      if (i == 0 && j == 0) continue;
      vec2 nuv = uv + vec2(float(i), float(j)) * uStep / uRes;
      vec2 s = texture(uSeed, nuv).rg;
      if (s.x >= 0.0) {
        float d = distTo(uv, s);
        if (d < bestD) { best = s; bestD = d; }
      }
    }
  }
  outColor = vec4(best, 0.0, 1.0);
}`;

const HEIGHT_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uPhi;
uniform sampler2D uSeed;
uniform sampler2D uProfile;
uniform vec2 uRes;
uniform float uAspect;
uniform float uRref;
uniform float uH0;
uniform float uPV;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float phi = texture(uPhi, uv).r;
  vec2 s = texture(uSeed, uv).rg;
  float dist = s.x >= 0.0 ? length(vec2((uv.x - s.x) * uAspect, uv.y - s.y)) : 0.0;
  float d = phi > 0.5 ? dist : -dist;
  float rq = 1.0 - clamp(d / max(uRref, 1e-4), 0.0, 1.0);
  float h = uH0 * texture(uProfile, vec2(rq, uPV)).r;
  outColor = vec4(h, phi, 0.0, 1.0);
}`;

const GEO_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
uniform sampler2D uH;
uniform vec2 uRes;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 tx = 1.0 / uRes;
  vec4 s = texture(uH, uv);
  float h = s.r;
  float phi = s.g;
  float hx = texture(uH, uv + vec2(tx.x, 0.0)).r - texture(uH, uv - vec2(tx.x, 0.0)).r;
  float hy = texture(uH, uv + vec2(0.0, tx.y)).r - texture(uH, uv - vec2(0.0, tx.y)).r;
  vec2 g = vec2(hx, hy) * uRes.y * 0.5;
  vec3 N = normalize(vec3(-g, 1.0));
  float mask = smoothstep(0.45, 0.55, phi);
  outColor = vec4(N.xy * 0.5 + 0.5, mask, h);
}`;

const COMP_FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
precision highp samplerCube;

out vec4 outColor;

uniform sampler2D   uGlass;
uniform sampler2D   uBg;
uniform samplerCube uEnv;
uniform sampler2D   uSRGB;
uniform vec2        uRes;
uniform vec2        uUvScale;
uniform vec2        uUvOffset;
uniform float       uOn;
uniform float       uLod;
uniform float       uSpec;
uniform float       uFillAlpha;
uniform float       uEnvRot;
uniform float       uEnvIntensity;
uniform float       uHref;
uniform float       uGlassT;
uniform vec3        uFill;
uniform vec3        uLightDir;

const vec3 NW = vec3(1.331, 1.333, 1.344);
const vec3 NG = vec3(1.514, 1.520, 1.528);

vec3 rotY(vec3 p, float a) {
  float c = cos(a), s = sin(a);
  return vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z);
}
float fresnel(float cosI, float n1, float n2) {
  float sinI2 = max(0.0, 1.0 - cosI * cosI);
  float eta = n1 / n2;
  float sinT2 = eta * eta * sinI2;
  if (sinT2 >= 1.0) return 1.0;
  float cosT = sqrt(1.0 - sinT2);
  float rs = (n1 * cosI - n2 * cosT) / (n1 * cosI + n2 * cosT);
  float rp = (n1 * cosT - n2 * cosI) / (n1 * cosT + n2 * cosI);
  return 0.5 * (rs * rs + rp * rp);
}
vec3 encodeSRGB(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return vec3(
    texture(uSRGB, vec2(c.r, 0.5)).r,
    texture(uSRGB, vec2(c.g, 0.5)).r,
    texture(uSRGB, vec2(c.b, 0.5)).r
  );
}

void main() {
  vec2 uv  = gl_FragCoord.xy / uRes;
  vec2 tUv = uv * uUvScale + uUvOffset;

  vec4  gbuf = texture(uGlass, uv);
  vec2  nxy  = gbuf.rg * 2.0 - 1.0;
  vec3  N    = vec3(nxy, sqrt(max(1.0 - dot(nxy, nxy), 0.0)));
  float mask = gbuf.b * uOn;
  float h    = gbuf.a;
  vec3  bg   = textureLod(uBg, tUv, 0.0).rgb;
  vec3  col  = bg;

  if (mask > 0.001) {
    vec3 R = 2.0 * N.z * N - vec3(0.0, 0.0, 1.0);
    vec3 env = texture(uEnv, rotY(R, uEnvRot)).rgb * uEnvIntensity;
    vec3 L = rotY(normalize(uLightDir), uEnvRot);

    float aspect = uRes.x / max(uRes.y, 1.0);
    float lod = uLod + (1.0 - N.z) * 1.2;
    vec3 trans = vec3(0.0);
    float tGreen = 0.0;

    for (int c = 0; c < 3; c++) {
      float nw = c == 0 ? NW.r : (c == 1 ? NW.g : NW.b);
      float ng = c == 0 ? NG.r : (c == 1 ? NG.g : NG.b);
      vec3 T = refract(vec3(0.0, 0.0, -1.0), N, 1.0 / nw);
      float tw = h / max(-T.z, 1e-4);
      vec2 dp = T.xy * tw;
      if (uGlassT > 1e-6) {
        vec3 Tg = refract(T, vec3(0.0, 0.0, 1.0), nw / ng);
        float tg = uGlassT / max(-Tg.z, 1e-4);
        dp += Tg.xy * tg * smoothstep(0.0, 0.02 * uHref, h);
      }
      vec2 duv = vec2(dp.x / aspect, dp.y) * uUvScale;
      vec3 s = textureLod(uBg, tUv + duv, lod).rgb;
      if (c == 0) trans.r = s.r;
      else if (c == 1) { trans.g = s.g; tGreen = tw; }
      else trans.b = s.b;
    }

    float tau = uFillAlpha * (tGreen / max(uHref, 1e-4));
    float Tmed = exp(-tau);
    trans = Tmed * trans + (1.0 - Tmed) * uFill;

    float F = fresnel(clamp(N.z, 0.0, 1.0), 1.0, NW.g);
    float Fgw = uGlassT > 1e-6
      ? fresnel(clamp(-refract(vec3(0.0, 0.0, -1.0), N, 1.0 / NW.g).z, 0.0, 1.0), NW.g, NG.g)
      : 0.0;

    float ndl = max(dot(N, L), 0.0);
    float k2 = ndl * ndl;
    float k4 = k2 * k2;
    float k8 = k4 * k4;
    float k16 = k8 * k8;
    float k32 = k16 * k16;
    float k64 = k32 * k32;
    float k128 = k64 * k64;
    float k256 = k128 * k128;

    col = trans * (1.0 - F) * (1.0 - Fgw) + env * F;
    col += vec3(1.0, 0.95, 0.88) * k256 * uSpec * 12.0;
  }

  outColor = vec4(encodeSRGB(col), mask);
  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  outColor.rgb += (ign - 0.5) * (1.0 / 255.0);
}`;

/* ------------------------------------------------------------------ *
 * 编译 / 程序 / 目标
 * ------------------------------------------------------------------ */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const pre = document.createElement("pre");
    pre.style.cssText =
      "position:fixed;inset:0;z-index:99;margin:0;padding:16px;overflow:auto;" +
      "background:#2a0d0d;color:#ffd7d7;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap";
    pre.textContent = "着色器编译失败\n\n" + log;
    document.body.appendChild(pre);
    throw new Error("shader: " + log);
  }
  return s;
}

function linkProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error("link: " + gl.getProgramInfoLog(p));
  }
  return p;
}

const progCac = linkProgram(CAC_FRAG);
const progSeedInit = linkProgram(SEED_INIT_FRAG);
const progSeedJump = linkProgram(SEED_JUMP_FRAG);
const progHeight = linkProgram(HEIGHT_FRAG);
const progGeo = linkProgram(GEO_FRAG);
const progComp = linkProgram(COMP_FRAG);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function uniforms(program, names) {
  const out = {};
  for (const n of names) out[n] = gl.getUniformLocation(program, n);
  return out;
}
const UCac = uniforms(progCac, ["uPhi", "uFlow", "uRes", "uDt", "uEps", "uM", "uTarget", "uRelax", "uPin", "uAspect"]);
const USi = uniforms(progSeedInit, ["uPhi", "uRes"]);
const USj = uniforms(progSeedJump, ["uSeed", "uRes", "uStep", "uAspect"]);
const UH = uniforms(progHeight, ["uPhi", "uSeed", "uProfile", "uRes", "uAspect", "uRref", "uH0", "uPV"]);
const UG = uniforms(progGeo, ["uH", "uRes"]);
const UC = uniforms(progComp, [
  "uGlass", "uBg", "uEnv", "uSRGB", "uRes", "uUvScale", "uUvOffset", "uOn",
  "uLod", "uSpec", "uFillAlpha", "uEnvRot", "uEnvIntensity", "uHref",
  "uGlassT", "uFill", "uLightDir",
]);

const canFloat = !!gl.getExtension("EXT_color_buffer_float");
const PHI_FMT = gl.RGBA8;
const PHI_TYPE = gl.UNSIGNED_BYTE;
const FIELD_FMT = canFloat ? gl.RGBA16F : gl.RGBA8;
const FIELD_TYPE = canFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h, fmt, type, filter, channels) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, channels || gl.RGBA, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

function disposeTarget(t) {
  if (!t) return;
  gl.deleteTexture(t.tex);
  gl.deleteFramebuffer(t.fbo);
}

/* sRGB 编码 LUT */
const srgbTex = gl.createTexture();
{
  const lut = new Uint8Array(256);
  for (let i = 0; i < 256; i += 1) {
    const c = i / 255;
    const s = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    lut[i] = Math.round(Math.max(0, Math.min(1, s)) * 255);
  }
  gl.bindTexture(gl.TEXTURE_2D, srgbTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, 1, 0, gl.RED, gl.UNSIGNED_BYTE, lut);
}

/* 背景纹理 */
const bgTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, bgTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
let bgAspect = 3 / 2;

function uploadImage(img) {
  bgAspect = img.width / img.height;
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

/* ------------------------------------------------------------------ *
 * 程序化背景（页面上是原生 img，WebGL 只采纹理）
 * ------------------------------------------------------------------ */
function newCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
function addGrain(ctx, w, h, amount) {
  const n = newCanvas(128, 128);
  const nx = n.getContext("2d");
  const id = nx.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 128 + (Math.random() * 2 - 1) * 46;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  nx.putImageData(id, 0, 0);
  ctx.save();
  ctx.globalAlpha = amount;
  ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = ctx.createPattern(n, "repeat");
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}
function hill(ctx, w, h, baseY, amp, freq, phase, color) {
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 4) {
    const y = baseY +
      Math.sin((x / w) * Math.PI * freq + phase) * amp +
      Math.sin((x / w) * Math.PI * freq * 2.7 + phase * 2.1) * amp * 0.34;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function makePhoto(w, h) {
  const c = newCanvas(w, h);
  const x = c.getContext("2d");
  const sky = x.createLinearGradient(0, 0, 0, h * 0.82);
  sky.addColorStop(0.00, "#0a1730");
  sky.addColorStop(0.34, "#22386b");
  sky.addColorStop(0.58, "#6a5a8f");
  sky.addColorStop(0.76, "#c4705c");
  sky.addColorStop(0.90, "#eaa063");
  sky.addColorStop(1.00, "#f6c98a");
  x.fillStyle = sky;
  x.fillRect(0, 0, w, h);
  const sx = w * 0.665, sy = h * 0.615, sr = w * 0.075;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 6.5);
  sg.addColorStop(0.00, "rgba(255,247,215,1)");
  sg.addColorStop(0.10, "rgba(255,226,168,0.95)");
  sg.addColorStop(0.28, "rgba(255,168,104,0.42)");
  sg.addColorStop(0.60, "rgba(224,120,96,0.14)");
  sg.addColorStop(1.00, "rgba(200,100,90,0)");
  x.fillStyle = sg;
  x.fillRect(0, 0, w, h);
  x.fillStyle = "rgba(255,250,225,0.98)";
  x.beginPath(); x.arc(sx, sy, sr, 0, 7); x.fill();
  hill(x, w, h, h * 0.655, h * 0.045, 2.1, 0.6, "#3b2f52");
  hill(x, w, h, h * 0.705, h * 0.055, 1.4, 2.1, "#2a2340");
  hill(x, w, h, h * 0.775, h * 0.040, 3.2, 4.0, "#191527");
  hill(x, w, h, h * 0.865, h * 0.030, 4.6, 1.2, "#0d0b15");
  const water = x.createLinearGradient(0, h * 0.87, 0, h);
  water.addColorStop(0, "rgba(120,90,130,0.10)");
  water.addColorStop(1, "rgba(20,18,34,0.55)");
  x.fillStyle = water;
  x.fillRect(0, h * 0.87, w, h * 0.13);
  addGrain(x, w, h, 0.07);
  return c;
}
function makeChart(w, h) {
  const c = newCanvas(w, h);
  const x = c.getContext("2d");
  x.fillStyle = "#0d1117";
  x.fillRect(0, 0, w, h);
  for (let i = 0; i <= w / 64; i++) {
    x.fillStyle = i % 4 === 0 ? "rgba(120,180,255,.28)" : "rgba(120,180,255,.11)";
    x.fillRect(i * 64, 0, i % 4 === 0 ? 2 : 1, h);
  }
  for (let j = 0; j <= h / 64; j++) {
    x.fillStyle = j % 4 === 0 ? "rgba(120,180,255,.28)" : "rgba(120,180,255,.11)";
    x.fillRect(0, j * 64, w, j % 4 === 0 ? 2 : 1);
  }
  const colors = ["#ff5d5d", "#ffb23f", "#ffe14a", "#5ddc7a", "#4fc3f7", "#9b7bff", "#ff6fd8"];
  for (let i = 0; i < 26; i++) {
    x.globalAlpha = 0.85;
    x.fillStyle = colors[i % colors.length];
    const bw = 40 + Math.random() * 190;
    const bh = 28 + Math.random() * 150;
    x.fillRect(Math.random() * (w - bw), Math.random() * (h - bh), bw, bh);
  }
  x.globalAlpha = 1;
  for (let i = 0; i < 9; i++) {
    x.strokeStyle = colors[i % colors.length];
    x.lineWidth = 2 + (i % 3);
    x.beginPath();
    x.arc(w * (0.12 + i * 0.095), h * (0.18 + (i % 3) * 0.30), 34 + i * 13, 0, Math.PI * 2);
    x.stroke();
  }
  x.fillStyle = "#f2f6ff";
  x.font = "600 92px ui-sans-serif, system-ui, sans-serif";
  x.fillText("LIQUID", w * 0.07, h * 0.80);
  x.font = "600 92px ui-monospace, Consolas, monospace";
  x.fillText("GLASS", w * 0.07, h * 0.90);
  addGrain(x, w, h, 0.05);
  return c;
}

let bgKind = "photo";
function setBackground(kind) {
  bgKind = kind;
  const img = kind === "chart" ? makeChart(1920, 1280) : makePhoto(1920, 1280);
  pageBg.src = img.toDataURL("image/jpeg", 0.92);
  uploadImage(img);
}

/* ------------------------------------------------------------------ *
 * 相场 / 高度 / 渲染目标
 * ------------------------------------------------------------------ */
const PHI_SCALE = 0.24;
const FLOW_STEPS = [256, 128, 64, 32, 16, 8, 4, 2, 1];
let cssW = 1, cssH = 1;
let PHI_W = 2, PHI_H = 2;
let phiTex = [null, null], phiFbo = [null, null];
let phiCur = 0;
let seedTex = [null, null], seedFbo = [null, null];
let seedCur = 0;
let heightBuf = null, glassBuf = null;
let phiTarget = 0.2;
let seeds = [];
let flowTime = 0;

function allocTargets() {
  for (const t of phiTex) if (t) gl.deleteTexture(t);
  for (const f of phiFbo) if (f) gl.deleteFramebuffer(f);
  for (const t of seedTex) if (t) gl.deleteTexture(t);
  for (const f of seedFbo) if (f) gl.deleteFramebuffer(f);
  disposeTarget(heightBuf);
  disposeTarget(glassBuf);

  phiTex = []; phiFbo = []; seedTex = []; seedFbo = [];
  for (let i = 0; i < 2; i += 1) {
    const p = makeTarget(PHI_W, PHI_H, PHI_FMT, PHI_TYPE, gl.LINEAR);
    gl.bindTexture(gl.TEXTURE_2D, p.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    phiTex.push(p.tex); phiFbo.push(p.fbo);
    const s = makeTarget(PHI_W, PHI_H, FIELD_FMT, FIELD_TYPE, gl.NEAREST);
    seedTex.push(s.tex); seedFbo.push(s.fbo);
  }
  heightBuf = makeTarget(PHI_W, PHI_H, FIELD_FMT, FIELD_TYPE, gl.LINEAR);
  glassBuf = makeTarget(PHI_W, PHI_H, FIELD_FMT, FIELD_TYPE, gl.LINEAR);
  phiCur = 0;
  seedCur = 0;
}

function initPhi() {
  const aspect = Math.max(1e-3, cssW / Math.max(1, cssH));
  const eps = state.eps / PHI_H;
  const R = base.Rref;
  const n = Math.round(state.num);
  seeds = [];
  for (let i = 0; i < n; i += 1) {
    const a = (i / n) * TAU + 0.4;
    seeds.push({ x: 0.52 * Math.cos(a), y: 0.34 * Math.sin(a) });
  }
  const data = new Uint8Array(PHI_W * PHI_H * 4);
  let sum = 0;
  for (let y = 0; y < PHI_H; y += 1) {
    const py = (y + 0.5) / PHI_H - 0.5;
    for (let x = 0; x < PHI_W; x += 1) {
      const px = ((x + 0.5) / PHI_W - 0.5) * aspect;
      let phi = 0;
      for (const s of seeds) {
        const d = Math.hypot(px - s.x, py - s.y);
        const v = 0.5 * (1 + Math.tanh((R - d) / Math.max(eps, 1e-4)));
        if (v > phi) phi = v;
      }
      const i = (y * PHI_W + x) * 4;
      data[i] = Math.round(phi * 255);
      data[i + 3] = 255;
      sum += data[i] / 255;
    }
  }
  phiTarget = sum / (PHI_W * PHI_H);
  gl.bindTexture(gl.TEXTURE_2D, phiTex[0]);
  gl.texImage2D(gl.TEXTURE_2D, 0, PHI_FMT, PHI_W, PHI_H, 0, gl.RGBA, PHI_TYPE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  phiCur = 0;
  flowTime = 0;
  updateFlowTexture();
}

function resetScene() {
  buildBaseProfile(state.contact, state.size);
  initPhi();
}

/* ------------------------------------------------------------------ *
 * 相场步进 / 跳洪距离场 / 高度 / 法线
 * ------------------------------------------------------------------ */
function cacStep(dt) {
  const dst = 1 - phiCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, phiFbo[dst]);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progCac);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, phiTex[phiCur]);
  gl.uniform1i(UCac.uPhi, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, flowTex);
  gl.uniform1i(UCac.uFlow, 1);
  gl.uniform2f(UCac.uRes, PHI_W, PHI_H);
  gl.uniform1f(UCac.uDt, dt);
  gl.uniform1f(UCac.uEps, state.eps / PHI_H);
  gl.uniform1f(UCac.uM, state.mobility);
  gl.uniform1f(UCac.uTarget, phiTarget);
  gl.uniform1f(UCac.uRelax, 0.3);
  gl.uniform1f(UCac.uPin, state.pin);
  gl.uniform1f(UCac.uAspect, PHI_W / Math.max(1, PHI_H));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, phiTex[dst]);
  gl.generateMipmap(gl.TEXTURE_2D);
  phiCur = dst;
}

function jumpFlood() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, seedFbo[0]);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progSeedInit);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, phiTex[phiCur]);
  gl.uniform1i(USi.uPhi, 0);
  gl.uniform2f(USi.uRes, PHI_W, PHI_H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  let src = 0;
  for (const step of FLOW_STEPS) {
    const dst = 1 - src;
    gl.bindFramebuffer(gl.FRAMEBUFFER, seedFbo[dst]);
    gl.viewport(0, 0, PHI_W, PHI_H);
    gl.useProgram(progSeedJump);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, seedTex[src]);
    gl.uniform1i(USj.uSeed, 0);
    gl.uniform2f(USj.uRes, PHI_W, PHI_H);
    gl.uniform1f(USj.uStep, step);
    gl.uniform1f(USj.uAspect, PHI_W / Math.max(1, PHI_H));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    src = dst;
  }
  seedCur = src;
}

function heightPass() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, heightBuf.fbo);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progHeight);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, phiTex[phiCur]);
  gl.uniform1i(UH.uPhi, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, seedTex[seedCur]);
  gl.uniform1i(UH.uSeed, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, profileTex);
  gl.uniform1i(UH.uProfile, 2);
  gl.uniform2f(UH.uRes, PHI_W, PHI_H);
  gl.uniform1f(UH.uAspect, PHI_W / Math.max(1, PHI_H));
  gl.uniform1f(UH.uRref, base.Rref);
  gl.uniform1f(UH.uH0, base.H0);
  gl.uniform1f(UH.uPV, 0.5);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function geoPass() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, glassBuf.fbo);
  gl.viewport(0, 0, PHI_W, PHI_H);
  gl.useProgram(progGeo);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, heightBuf.tex);
  gl.uniform1i(UG.uH, 0);
  gl.uniform2f(UG.uRes, PHI_W, PHI_H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ------------------------------------------------------------------ *
 * 流场种子（只用于 scissor 包围盒） / scissor
 * ------------------------------------------------------------------ */
function updateSeeds(dt) {
  for (const s of seeds) {
    const u = flowAt(s.x, s.y, flowTime);
    const speed = Math.hypot(u[0], u[1]);
    const eff = smoothstep(state.pin, state.pin * 2.0 + 1e-6, speed);
    s.x += u[0] * eff * dt;
    s.y += u[1] * eff * dt;
  }
}

function seedBoxes() {
  const boxes = [];
  const rad = Math.max(base.Rref * 2.2, 0.22);
  const pad = 6;
  for (const s of seeds) {
    const cx = 0.5 * outW + s.x * outH;
    const cy = 0.5 * outH + s.y * outH;
    const r = rad * outH + pad;
    const x0 = Math.max(0, Math.floor(cx - r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const x1 = Math.min(outW, Math.ceil(cx + r));
    const y1 = Math.min(outH, Math.ceil(cy + r));
    if (x1 > x0 && y1 > y0) boxes.push([x0, y0, x1 - x0, y1 - y0]);
  }
  return boxes;
}

/* ------------------------------------------------------------------ *
 * 画布尺寸 / 自适应
 * ------------------------------------------------------------------ */
let outW = 2, outH = 2;
const LEVELS = [{ dpr: 0.70 }, { dpr: 0.85 }, { dpr: 1.00 }, { dpr: 1.25 }, { dpr: 1.50 }];
let level = 2;

function maxLevel() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let i = 0;
  for (let k = 0; k < LEVELS.length; k += 1) if (LEVELS[k].dpr <= dpr + 0.001) i = k;
  return i;
}

function resize() {
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  const L = LEVELS[level];
  const w = Math.max(2, Math.round(cssW * L.dpr));
  const h = Math.max(2, Math.round(cssH * L.dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  outW = w; outH = h;

  const gW = Math.max(8, Math.round(cssW * PHI_SCALE));
  const gH = Math.max(8, Math.round(cssH * PHI_SCALE));
  if (gW !== PHI_W || gH !== PHI_H) {
    PHI_W = gW; PHI_H = gH;
    allocTargets();
    if (profileTex) resetScene();
  }

  flowCanvas.width = Math.max(2, Math.round(cssW));
  flowCanvas.height = Math.max(2, Math.round(cssH));
  elRes.textContent =
    "质量 " + (level + 1) + "/" + LEVELS.length + " · " + w + "×" + h;
  elPhi.textContent = PHI_W + "×" + PHI_H;
}

function uvRect() {
  const view = outW / Math.max(1, outH);
  let sx = 1, sy = 1, ox = 0, oy = 0;
  if (bgAspect > view) {
    sx = view / bgAspect;
    ox = (1 - sx) * 0.5;
  } else {
    sy = bgAspect / view;
    oy = (1 - sy) * 0.5;
  }
  return [sx, sy, ox, oy];
}

/* ------------------------------------------------------------------ *
 * 渲染循环
 * ------------------------------------------------------------------ */
const elFps = document.getElementById("fps");
const elMs = document.getElementById("ms");
const elGpu = document.getElementById("gpu");
const elRes = document.getElementById("res");
const elPhi = document.getElementById("phi");
const elBo = document.getElementById("bo");

let last = performance.now();
let lastPresent = 0;
let acc = 0, frames = 0, fps = 0, ms = 0;
const timerExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");
let gpuQuery = null;
const gpuPending = [];
let gpuMs = 8.0;
const BUDGET_HI = 9.0, BUDGET_LO = 6.0;
let lastAdjust = 0, justDown = false;

function fillPalette() {
  const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return fillLight ? [1, 1, 1] : [lin(0.12), lin(0.12), lin(0.12)];
}

function drawFlowOverlay() {
  const w = flowCanvas.width, h = flowCanvas.height;
  fctx.clearRect(0, 0, w, h);
  if (!showFlow) return;
  fctx.strokeStyle = "rgba(150,195,255,0.34)";
  fctx.fillStyle = "rgba(150,195,255,0.34)";
  fctx.lineWidth = 1;
  const cols = 16, rows = 10;
  for (let j = 0; j < rows; j += 1) {
    for (let i = 0; i < cols; i += 1) {
      const px = ((i + 0.5) / cols - 0.5) * (w / h);
      const py = 0.5 - (j + 0.5) / rows;
      const u = flowAt(px, py, flowTime);
      const sx = w * 0.5 + px * h;
      const sy = h * 0.5 - py * h;
      const scale = h * 1.1;
      const ex = sx + u[0] * scale;
      const ey = sy - u[1] * scale;
      fctx.beginPath(); fctx.moveTo(sx, sy); fctx.lineTo(ex, ey); fctx.stroke();
      const a = Math.atan2(ey - sy, ex - sx);
      fctx.beginPath();
      fctx.moveTo(ex, ey);
      fctx.lineTo(ex - 4 * Math.cos(a - 0.5), ey - 4 * Math.sin(a - 0.5));
      fctx.lineTo(ex - 4 * Math.cos(a + 0.5), ey - 4 * Math.sin(a + 0.5));
      fctx.closePath(); fctx.fill();
    }
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastPresent < 15.2) return;
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  lastPresent = now;

  if (timerExt && !gpuQuery) {
    gpuQuery = gl.createQuery();
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, gpuQuery);
  }

  if (!paused) {
    const sdt = dt * state.speed;
    flowTime += sdt;
    updateFlowTexture();
    updateSeeds(sdt);
    const dtCac = Math.min(sdt * 0.5, 0.02);
    cacStep(dtCac);
    cacStep(dtCac);
  }

  jumpFlood();
  heightPass();
  geoPass();

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, outW, outH);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if (!off) {
    gl.useProgram(progComp);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.uniform1i(UC.uBg, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_CUBE_MAP, envTex);
    gl.uniform1i(UC.uEnv, 2);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, srgbTex);
    gl.uniform1i(UC.uSRGB, 3);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, glassBuf.tex);
    gl.uniform1i(UC.uGlass, 0);

    const [sx, sy, ox, oy] = uvRect();
    gl.uniform2f(UC.uRes, outW, outH);
    gl.uniform2f(UC.uUvScale, sx, sy);
    gl.uniform2f(UC.uUvOffset, ox, oy);
    gl.uniform1f(UC.uOn, 1);
    gl.uniform1f(UC.uLod, state.lod);
    gl.uniform1f(UC.uSpec, state.spec);
    gl.uniform1f(UC.uFillAlpha, state.fill);
    gl.uniform1f(UC.uEnvRot, (state.envRot * Math.PI) / 180);
    gl.uniform1f(UC.uEnvIntensity, state.env);
    gl.uniform1f(UC.uHref, Math.max(0.02, base.H0));
    gl.uniform1f(UC.uGlassT, state.glass / WORLD_MM);
    gl.uniform3fv(UC.uFill, fillPalette());
    gl.uniform3fv(UC.uLightDir, envLight);

    gl.enable(gl.SCISSOR_TEST);
    for (const b of seedBoxes()) {
      gl.scissor(b[0], b[1], b[2], b[3]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.SCISSOR_TEST);
  }

  drawFlowOverlay();

  if (timerExt && gpuQuery) {
    gl.endQuery(timerExt.TIME_ELAPSED_EXT);
    gpuPending.push(gpuQuery);
    gpuQuery = null;
  }
  if (timerExt) {
    while (gpuPending.length) {
      const q = gpuPending[0];
      if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break;
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
        const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);
        gpuMs = gpuMs * 0.88 + (ns / 1e6) * 0.12;
      }
      gl.deleteQuery(q);
      gpuPending.shift();
    }
    while (gpuPending.length > 8) gl.deleteQuery(gpuPending.shift());
  } else {
    gpuMs = gpuMs * 0.92 + Math.min(dt * 1000, 33) * 0.08;
  }

  const budgetHi = timerExt ? BUDGET_HI : 19.0;
  const budgetLo = timerExt ? BUDGET_LO : 17.4;
  if (now - lastAdjust > (justDown ? 1500 : 6000) && now > 3000 && !document.hidden) {
    if (gpuMs > budgetHi && level > 0) {
      level -= 1; resize(); lastAdjust = now; justDown = true;
    } else if (gpuMs < budgetLo && level < maxLevel()) {
      level += 1; resize(); lastAdjust = now; justDown = false;
    }
  }

  acc += dt; frames += 1;
  if (acc >= 0.5) {
    fps = frames / acc;
    ms = (acc / frames) * 1000;
    elFps.textContent = fps.toFixed(0);
    elMs.textContent = ms.toFixed(1);
    elGpu.textContent = gpuMs.toFixed(1);
    elBo.textContent = base.Bo < 10 ? base.Bo.toFixed(2) : base.Bo.toFixed(1);
    acc = 0; frames = 0;
  }
}

/* ------------------------------------------------------------------ *
 * UI
 * ------------------------------------------------------------------ */
const slidersEl = document.getElementById("sliders");
const inputs = {};

function rebuildAndReset() {
  buildBaseProfile(state.contact, state.size);
  initPhi();
}

for (const [key, label, min, max, step, desc] of SLIDERS) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("label");
  const name = document.createElement("span");
  const val = document.createElement("span");
  name.textContent = label;
  lab.append(name, val);
  const input = document.createElement("input");
  input.type = "range";
  input.min = min; input.max = max; input.step = step;
  input.value = state[key];
  input.title = desc || "";
  const show = () => {
    const v = Number(input.value);
    if (key === "num" || key === "envRot") { val.textContent = v.toFixed(0); return; }
    const dp = step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    val.textContent = v.toFixed(dp);
  };
  input.addEventListener("input", () => {
    state[key] = Number(input.value);
    show();
  });
  input.addEventListener("change", () => {
    if (key === "num" || key === "size" || key === "contact") rebuildAndReset();
  });
  show();
  row.append(lab, input);
  if (desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = desc;
    row.append(d);
  }
  slidersEl.append(row);
  inputs[key] = { input, show };
}

function syncInputs() {
  for (const [key] of SLIDERS) {
    inputs[key].input.value = state[key];
    inputs[key].show();
  }
}

const panelEl = document.getElementById("panel");
const toggleEl = document.getElementById("toggle");
function setCollapsed(v) {
  panelEl.classList.toggle("collapsed", v);
  toggleEl.textContent = v ? "展开" : "收起";
  try { localStorage.setItem("lg.panel", v ? "1" : "0"); } catch (_) {}
}
toggleEl.addEventListener("click", () => setCollapsed(!panelEl.classList.contains("collapsed")));
try {
  if (localStorage.getItem("lg.panel") !== "0") setCollapsed(true);
} catch (_) {
  setCollapsed(true);
}

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyH") setCollapsed(!panelEl.classList.contains("collapsed"));
  if (e.code === "Escape") setCollapsed(true);
});

const btnPause = document.getElementById("btnPause");
btnPause.addEventListener("click", () => {
  paused = !paused;
  btnPause.classList.toggle("on", paused);
  btnPause.textContent = paused ? "继续" : "暂停";
});

const btnCompare = document.getElementById("btnCompare");
btnCompare.addEventListener("pointerdown", () => { off = true; btnCompare.classList.add("on"); });
btnCompare.addEventListener("pointerup", () => { off = false; btnCompare.classList.remove("on"); });
btnCompare.addEventListener("pointerleave", () => { off = false; btnCompare.classList.remove("on"); });

document.getElementById("btnReset").addEventListener("click", () => {
  Object.assign(state, DEFAULTS);
  syncInputs();
  rebuildAndReset();
});

const btnFill = document.getElementById("btnFill");
btnFill.addEventListener("click", () => {
  fillLight = !fillLight;
  btnFill.textContent = fillLight ? "底色：亮" : "底色：暗";
});

const btnFlow = document.getElementById("btnFlow");
btnFlow.addEventListener("click", () => {
  showFlow = !showFlow;
  flowCanvas.style.display = showFlow ? "block" : "none";
  btnFlow.classList.toggle("on", showFlow);
});

const btnPhoto = document.getElementById("btnPhoto");
const btnChart = document.getElementById("btnChart");
btnPhoto.addEventListener("click", () => {
  setBackground("photo");
  btnPhoto.classList.add("on"); btnChart.classList.remove("on");
});
btnChart.addEventListener("click", () => {
  setBackground("chart");
  btnChart.classList.add("on"); btnPhoto.classList.remove("on");
});

document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
});

function loadFile(file) {
  if (!file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  pageBg.src = url;
  const img = new Image();
  img.onload = () => {
    uploadImage(img);
    btnPhoto.classList.remove("on");
    btnChart.classList.remove("on");
  };
  img.src = url;
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); off = true; }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") { e.preventDefault(); off = false; }
});

const dropEl = document.getElementById("drop");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  e.preventDefault(); dragDepth++; dropEl.classList.add("show");
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("dragleave", (e) => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("show"); }
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0; dropEl.classList.remove("show");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ *
 * 启动
 * ------------------------------------------------------------------ */
const startChart = location.hash.includes("chart");
setBackground(startChart ? "chart" : "photo");
if (startChart) {
  btnChart.classList.add("on");
  btnPhoto.classList.remove("on");
}

location.hash.slice(1).split("&").forEach((kv) => {
  const [k, v] = kv.split("=");
  if (k && Object.prototype.hasOwnProperty.call(state, k)) {
    const n = parseFloat(v);
    if (isFinite(n)) state[k] = n;
  }
});
syncInputs();

buildEnvironment();
level = Math.min(maxLevel(), 2);
resize();
buildBaseProfile(state.contact, state.size);
initPhi();
requestAnimationFrame(frame);
</script>
</body>
