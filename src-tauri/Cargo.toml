[package]
name = "app"
version = "0.9.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"

# A1 系统能力
flate2 = "1.1"            # zip 解压（deflate）
percent-encoding = "2.3"  # 自定义协议里的路径解码
winreg = "0.56"           # 开机自启（HKCU Run）
# 站点权限自愈：ICoreWebView2Profile4::SetPermissionState
# （麦克风被 WebView2 持久化成 Block 之后，只有这条 API 能覆盖它；版本与 wry 传递的那份一致，不多编一份）
webview2-com = "0.39"
# WinRT 异步操作类型（IAsyncOperation / AsyncStatus）在 windows-future 里；
# 状态机需要用 Status()/Cancel() 做超时兜底，直接依赖它才能写类型。
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Devices_Geolocation",              # Windows Geolocator
  "Devices_Enumeration",              # DeviceInformation / DeviceWatcher（蓝牙音频设备枚举与事件）
  "Devices_Bluetooth",                # BluetoothDevice.ConnectionStatus（退出时等 A2DP 链路真正断开）
  "Devices_Radios",                   # 蓝牙无线电开关
  "Devices_Sensors",                  # LightSensor.GetDefault（自动亮度能力检测）
  "Media_Audio",                      # AudioPlaybackConnection（A2DP Sink）
  "Media_Control",                    # GlobalSystemMediaTransportControlsSessionManager（SMTC 媒体会话）
  "Storage_Streams",                  # 封面缩略图：IRandomAccessStream / DataReader
  "Foundation_Collections",           # WinRT 集合（SMTC 的会话列表 IVectorView 等）
  "Win32_Devices_Bluetooth",          # bluetoothapis：退出时停用/启动时恢复手机 A2DP 音频服务
  "Win32_Media_Audio",                # CoreAudio：默认渲染端点
  "Win32_Media_Audio_Endpoints",      # IAudioEndpointVolume（主音量/静音）
  "Win32_System_Com",                 # CoCreateInstance（CoreAudio / WMI COM）
  "Win32_System_Com_StructuredStorage", # IMMDevice::Activate 的 PROPVARIANT 参数
  "Win32_System_Diagnostics_ToolHelp",  # Toolhelp32：自身进程树（含 msedgewebview2 子进程）
  "Win32_System_Ole",                 # WMI 需要的 OLE 基础类型
  "Win32_System_Variant",             # VARIANT（WMI 属性读写）
  "Win32_System_Wmi",                 # root\wmi：WmiMonitorBrightness（亮度）
  "Win32_System_Registry",            # PowerRead/WriteACValueIndex 的 HKEY 参数
  "Foundation",
  "Win32_System_Power",               # GetSystemPowerStatus / 自适应亮度电源设置
  "Win32_System_SystemInformation",   # GetTickCount
  "Win32_System_Threading",           # OpenProcess / QueryFullProcessImageNameW（按进程名认设置窗口）
  "Win32_System_WinRT",               # RoInitialize（WinRT 线程初始化）
  "Win32_NetworkManagement_IpHelper", # GetExtendedTcpTable：从调试端口反查真实浏览器进程
  "Win32_Networking_WinSock",         # AF_INET（GetExtendedTcpTable 地址族参数）
  "Win32_UI_Input_KeyboardAndMouse",  # GetLastInputInfo
  "Win32_UI_WindowsAndMessaging",     # EnumWindows / SetForegroundWindow（设置页切前台）
] }

# E2b 网络定位（ip.cn，D-16）：async，在 async command 里直接 await。
# 只开 native-tls（Windows 走 SChannel，无 OpenSSL/CMake 依赖）+ 系统代理；
# 不开 reqwest 0.13 默认的 rustls/aws-lc-rs，避免引入 CMake/NASM 工具链。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }

