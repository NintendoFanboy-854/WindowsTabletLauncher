<!doctype html>
<html lang="zh-CN" data-phase="focus">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>番茄钟</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      正常模式：环形时间（Primary）+ 当前任务（1 行，Secondary）+ 主按钮（开始/暂停）。
      跳过 / 重置 / 统计 / 白噪音 / 沉浸 / 设置全部收进 ⋯ 菜单或详情，无常驻齿轮。
    -->
    <div class="app" id="app">
      <div class="visual" id="visual" role="button" tabindex="0" aria-label="查看番茄钟详情">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="45"></circle>
          <circle class="ring-progress" id="ring-progress" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="visual-center">
          <span class="phase-label" id="phase-label">专注</span>
          <span class="time" id="time-main">25:00</span>
        </div>
      </div>

      <div class="plain" id="plain" role="button" tabindex="0" aria-label="番茄钟时间：点击开始或暂停，长按查看详情">
        <span class="phase-chip" id="phase-chip">专注</span>
        <span class="time-plain" id="time-plain">25:00</span>
      </div>

      <div class="side" id="side">
        <div class="task-line" id="task-line">未关联任务</div>

        <div class="actions" id="actions">
          <button class="primary-btn" id="toggle-btn" type="button" aria-label="开始专注">
            <svg viewBox="0 0 20 20" aria-hidden="true" class="btn-icon" id="toggle-icon">
              <path
                fill="currentColor"
                d="M17.22 8.69a1.5 1.5 0 0 1 0 2.62l-10 5.5A1.5 1.5 0 0 1 5 15.5v-11A1.5 1.5 0 0 1 7.22 3.2zm-.48 1.75a.5.5 0 0 0 0-.88l-10-5.5A.5.5 0 0 0 6 4.5v11c0 .38.4.62.74.44z"
              />
            </svg>
            <span class="btn-label" id="toggle-label">开始</span>
          </button>
          <button class="icon-btn menu-btn" id="menu-btn" type="button" title="更多操作" aria-label="更多操作" aria-haspopup="menu">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6.25 10a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0m5 0a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0M15 11.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 长按菜单（3×2 有 ⋯ 入口，其它尺寸走详情） -->
    <div class="menu-backdrop" id="menu-backdrop" hidden></div>
    <div class="menu" id="action-menu" role="menu" aria-label="番茄钟更多操作" hidden>
      <button class="menu-item" id="menu-detail" type="button" role="menuitem">详情与统计</button>
      <button class="menu-item" id="menu-skip" type="button" role="menuitem">跳过本轮</button>
      <button class="menu-item" id="menu-reset" type="button" role="menuitem">重置</button>
      <button class="menu-item" id="menu-settings" type="button" role="menuitem">设置</button>
    </div>

    <!-- 详情：统计 / 白噪音 / 次要操作（点击环形或长按卡片打开） -->
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
      <header class="sheet-head">
        <h2 class="sheet-title" id="detail-title">专注详情</h2>
        <button class="icon-btn" id="detail-close" type="button" title="关闭" aria-label="关闭详情">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07z"
            />
          </svg>
        </button>
      </header>
      <div class="sheet-body">
        <div class="detail-grid">
          <div class="detail-row"><span class="detail-label">今日完成</span><strong id="detail-completed">0 个</strong></div>
          <div class="detail-row"><span class="detail-label">今日专注</span><strong id="detail-minutes">0 分钟</strong></div>
          <div class="detail-row"><span class="detail-label">本轮进度</span><strong id="detail-rounds">0 / 4</strong></div>
          <div class="detail-row"><span class="detail-label">白噪音</span><strong id="detail-noise">关</strong></div>
        </div>

        <div class="form-row">
          <span class="field-label" id="noise-group-label">白噪音</span>
          <div class="segmented" id="noise-options" role="radiogroup" aria-labelledby="noise-group-label"></div>
        </div>

        <div class="form-row">
          <label class="field-label" for="set-volume">音量：<span id="volume-value">40</span></label>
          <input class="slider" id="set-volume" type="range" min="0" max="100" step="1" />
        </div>

        <div class="form-actions">
          <button class="btn" id="detail-skip" type="button">跳过本轮</button>
          <button class="btn" id="detail-reset" type="button">重置</button>
          <span class="spacer"></span>
          <button class="btn" id="detail-settings" type="button">设置</button>
          <button class="btn btn-primary" id="detail-immersive" type="button">沉浸模式</button>
        </div>
      </div>
    </section>

    <section class="sheet" id="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <header class="sheet-head">
        <h2 class="sheet-title" id="settings-title">番茄钟设置</h2>
        <button class="icon-btn" id="settings-close" type="button" title="关闭" aria-label="关闭设置">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07z"
            />
          </svg>
        </button>
      </header>
      <div class="sheet-body">
        <div class="num-grid">
          <label class="form-row">
            <span class="field-label">专注（分钟）</span>
            <input class="text-input num-input" id="set-focus" type="number" min="1" step="1" inputmode="numeric" />
          </label>
          <label class="form-row">
            <span class="field-label">短休（分钟）</span>
            <input class="text-input num-input" id="set-short" type="number" min="1" step="1" inputmode="numeric" />
          </label>
          <label class="form-row">
            <span class="field-label">长休（分钟）</span>
            <input class="text-input num-input" id="set-long" type="number" min="1" step="1" inputmode="numeric" />
          </label>
          <label class="form-row">
            <span class="field-label">长休前轮数</span>
            <input class="text-input num-input" id="set-rounds" type="number" min="1" step="1" inputmode="numeric" />
          </label>
        </div>

        <label class="row" for="set-auto">
          <span class="row-text">
            <span class="row-title">自动开始下一阶段</span>
            <span class="row-desc">关闭时阶段结束停在「待开始」</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-auto" role="switch" aria-label="自动开始下一阶段" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <label class="row" for="set-sound">
          <span class="row-text">
            <span class="row-title">阶段结束提示音</span>
            <span class="row-desc">用 WebAudio 合成，不联网</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-sound" role="switch" aria-label="阶段结束提示音" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <label class="row" for="set-keepawake">
          <span class="row-text">
            <span class="row-title">专注时阻止息屏</span>
            <span class="row-desc">通过宿主 setKeepAwake 实现</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-keepawake" role="switch" aria-label="专注时阻止息屏" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <p class="hint">修改仅影响下一轮；进行中的这一轮不改变时长。白噪音随阶段结束淡出。</p>
        <p class="hint">关联待办：通过 Agent 工具 <code>pomodoro.start({ taskId })</code> 指定；待办列表读取需宿主 Agent 桥接，本期未接。</p>
      </div>
    </section>

    <!-- 沉浸模式：覆盖整张卡片的详情层 -->
    <div class="immersive" id="immersive" hidden>
      <div class="immersive-inner">
        <div class="immersive-head">
          <span class="immersive-phase" id="immersive-phase">专注</span>
          <button class="icon-btn" id="immersive-close" type="button" title="退出沉浸模式" aria-label="退出沉浸模式">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                fill="currentColor"
                d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07z"
              />
            </svg>
          </button>
        </div>
        <div class="immersive-time" id="immersive-time">25:00</div>
        <div class="immersive-task" id="immersive-task">未关联任务</div>
        <div class="immersive-actions">
          <button class="btn" id="immersive-toggle" type="button">暂停</button>
          <button class="btn btn-primary" id="immersive-stop" type="button">结束本轮</button>
        </div>
        <div class="immersive-stats" id="immersive-stats">今日 0 个 · 0 分钟</div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
