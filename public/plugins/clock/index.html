<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时钟</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="clock" id="clock" role="button" tabindex="0" aria-label="时钟：点击切换 12 / 24 小时制">
      <div class="time-row">
        <span class="time-main" id="time-main">--:--</span>
        <span class="time-sec" id="time-sec" aria-hidden="true"></span>
        <span class="time-meridiem" id="time-meridiem" aria-hidden="true"></span>
      </div>
      <div class="meta">
        <span class="date" id="date"></span>
        <span class="meta-dot" aria-hidden="true">·</span>
        <span class="weekday" id="weekday"></span>
      </div>
    </main>

    <button
      class="icon-btn settings-btn"
      id="settings-btn"
      type="button"
      title="时钟设置"
      aria-label="打开时钟设置"
      aria-haspopup="dialog"
    >
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path
          fill="currentColor"
          d="M1.91 7.38A8.5 8.5 0 0 1 3.7 4.3a.5.5 0 0 1 .54-.13l1.92.68a1 1 0 0 0 1.32-.76l.36-2a.5.5 0 0 1 .4-.4 9 9 0 0 1 3.55 0q.32.08.38.4l.37 2a1 1 0 0 0 1.32.76l1.92-.68a.5.5 0 0 1 .54.13 8.5 8.5 0 0 1 1.78 3.08q.08.31-.15.54l-1.56 1.32a1 1 0 0 0 0 1.52l1.56 1.32a.5.5 0 0 1 .15.54 8.5 8.5 0 0 1-1.78 3.08.5.5 0 0 1-.54.13l-1.92-.68a1 1 0 0 0-1.32.76l-.37 2a.5.5 0 0 1-.38.4 8.5 8.5 0 0 1-3.56 0 .5.5 0 0 1-.39-.4l-.36-2a1 1 0 0 0-1.32-.76l-1.92.68a.5.5 0 0 1-.54-.13 8.5 8.5 0 0 1-1.78-3.08.5.5 0 0 1 .15-.54l1.56-1.32a1 1 0 0 0 0-1.52L2.06 7.92a.5.5 0 0 1-.15-.54m1.06 0 1.3 1.1a2 2 0 0 1 0 3.04l-1.3 1.1q.45 1.19 1.25 2.16l1.6-.58a2 2 0 0 1 2.63 1.53l.3 1.67a8 8 0 0 0 2.5 0l.3-1.67a2 2 0 0 1 2.64-1.53l1.6.58a8 8 0 0 0 1.24-2.16l-1.3-1.1a2 2 0 0 1 0-3.04l1.3-1.1a8 8 0 0 0-1.25-2.16l-1.6.58a2 2 0 0 1-2.63-1.53l-.3-1.67a8 8 0 0 0-2.5 0l-.3 1.67A2 2 0 0 1 5.81 5.8l-1.6-.58a8 8 0 0 0-1.24 2.16M7.5 10a2.5 2.5 0 1 1 5 0 2.5 2.5 0 0 1-5 0m1 0a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0"
        />
      </svg>
    </button>

    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <header class="sheet-head">
        <h2 class="sheet-title" id="sheet-title">时钟设置</h2>
        <button class="icon-btn" id="close-settings" type="button" title="关闭" aria-label="关闭设置">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07z"
            />
          </svg>
        </button>
      </header>
      <div class="sheet-body">
        <label class="row" for="set-24h">
          <span class="row-text">
            <span class="row-title">24 小时制</span>
            <span class="row-desc">关闭后显示为 12 小时制（AM / PM）</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-24h" role="switch" aria-label="24 小时制" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
        <div class="divider"></div>
        <label class="row" for="set-seconds">
          <span class="row-text">
            <span class="row-title">显示秒</span>
            <span class="row-desc">1×1 档位空间不足，按规格不显示秒</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="set-seconds" role="switch" aria-label="显示秒" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
        <div class="divider"></div>
        <fieldset class="field-group">
          <legend>日期格式</legend>
          <label class="radio">
            <input type="radio" name="date-format" value="zh" />
            <span class="radio-mark" aria-hidden="true"></span>
            <span class="radio-label">10月18日 星期日</span>
          </label>
          <label class="radio">
            <input type="radio" name="date-format" value="iso" />
            <span class="radio-mark" aria-hidden="true"></span>
            <span class="radio-label">2026-10-18</span>
          </label>
          <label class="radio">
            <input type="radio" name="date-format" value="en" />
            <span class="radio-mark" aria-hidden="true"></span>
            <span class="radio-label">10/18 Sun</span>
          </label>
        </fieldset>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
